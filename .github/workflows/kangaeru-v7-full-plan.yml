name: Kangaeru Yoru v7 GPT-5.6 Terra FULL GK storyboard
on:
  push:
    branches: [kangaeru-yoru-v7-design-20261106]
    paths:
      - 'standalone_kangaeru_v7/approval/authorize_full.txt'
permissions:
  contents: read
jobs:
  full_storyboard:
    if: github.event.head_commit.message == 'AUTHORIZE_V7_FULL_GK_20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify full-episode approval commit
        run: |
          test "${{ github.ref_name }}" = "kangaeru-yoru-v7-design-20261106"
          test "$(cat standalone_kangaeru_v7/approval/authorize_full.txt)" = "I_APPROVE_OPENAI_FULL_GK_71_SCENES"
      - name: Install official OpenAI SDK and icon geometry prerequisites
        run: python -m pip install --quiet openai requests Pillow
      - name: Key existence gate; never display secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Missing OPENAI_API_KEY; stopped without API calls.'
            exit 1
          fi
      - name: Generate full chapter-aware GPT storyboard in bounded batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KANGAERU_V7_API_APPROVED: 'YES'
          KANGAERU_V7_FULL_APPROVED: 'YES'
        run: |
          python standalone_kangaeru_v7/full_plan.py \
            --source standalone_kangaeru_v6/gk_source.json \
            --out standalone_kangaeru_v7/output/full_gk_plan \
            --batch-size 6
      - name: Save full plan, actual usage and scene vector icons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kangaeru-yoru-v7-full-gk-gpt-storyboard-and-usage
          path: standalone_kangaeru_v7/output/full_gk_plan/
          if-no-files-found: warn
          retention-days: 14
