name: V63 Exiled Masterpieces Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v63-exiled-masterpieces-production.yml'
      - 'shared/bootstrap/v63-exiled-masterpieces.mjs'
      - 'shared/v63/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V63 production
        run: node shared/bootstrap/v63-exiled-masterpieces.mjs

      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V63 dependencies
        working-directory: v63-exiled-masterpieces
        run: npm install

      - name: Expose dependencies to shared tools
        working-directory: v63-exiled-masterpieces
        run: ln -sfn "$PWD/node_modules" ../node_modules

      - name: Build preproduction plan
        working-directory: v63-exiled-masterpieces
        run: node scripts/build-preproduction.mjs

      - name: Story, fine-scene and static-background guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v63-exiled-masterpieces/src/script-data.json');
          const d=require('./v63-exiled-masterpieces/src/scene-data.json');
          const n=s.beats.length;
          if(!s.beats[0].narration.startsWith('一〇八二年、中国の長江沿い。')) throw new Error('Wrong canonical V63 script loaded');
          if(n<95||n>125) throw new Error(`Unexpected V63 scene count ${n}`);
          if(d.length!==n) throw new Error(`Scene data mismatch ${d.length}/${n}`);
          if(new Set(s.beats.map(b=>b.visual)).size!==n) throw new Error('Every V63 scene must have a distinct visual key');
          const groups=[...new Set(d.map(x=>x.bgGroup))];
          if(groups.length<60) throw new Error(`Need at least 75 background groups, got ${groups.length}`);
          const seen=new Set(); let prev=''; const counts={};
          for(const x of d){
            counts[x.bgGroup]=(counts[x.bgGroup]||0)+1;
            if(x.bgGroup!==prev&&seen.has(x.bgGroup)) throw new Error(`Background reused non-consecutively: ${x.bgGroup}`);
            seen.add(x.bgGroup); prev=x.bgGroup;
          }
          for(const [g,c] of Object.entries(counts)) if(c>2) throw new Error(`Background ${g} used ${c} scenes; max 2`);
          const required=["prologue_river","prologue_question","definition","ovid_rome","ovid_coast","ovid_letters","ovid_transition","bai_capital","bai_river","bai_mirror","bai_music","bai_outcome","liu_reform","liu_path","liu_fish","liu_contrast","michizane_palace","michizane_road","michizane_plum","michizane_after","su_court","su_farm","su_coldfood","su_boat","su_riverchange","su_two_works","dante_florence","dante_wander","dante_inferno","dante_language","patterns","selection_bias","hypothesis_distance","modern_scene","ending"];
          const phases=new Set(d.map(x=>x.phase));
          for(const p of required) if(!phases.has(p)) throw new Error(`Missing semantic phase ${p}`);
          const code=fs.readFileSync('./shared/v63/scenes.tsx','utf8');
          for(const p of required) if(!code.includes(`case '${p}'`)) throw new Error(`Renderer missing phase ${p}`);
          if(code.includes('useCurrentFrame')) throw new Error('Scene renderer backgrounds must not use global frame motion');
          console.log(`V63 architecture: ${n} scenes / ${phases.size} phases / ${groups.length} background groups / sequential-only max2`);
          NODE

      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v63-exiled-masterpieces pre

      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs

      - name: TypeScript check
        working-directory: v63-exiled-masterpieces
        run: npm run check

      - name: Roman port, Tang music, Heian palace, Song rivers and Dante scene smoke tests
        working-directory: v63-exiled-masterpieces
        run: |
          mkdir -p out/preview
          for FRAME in 9 110 290 510 720 950 1160 1400 1630 1980; do
            npx remotion still src/index.tsx V63ScenePreview "out/preview/frame-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 10

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Generate measured narration
        working-directory: v63-exiled-masterpieces
        run: node scripts/generate-voicevox.mjs

      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v63-exiled-masterpieces/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} scenes`);
          if(s.durationSeconds<700) throw new Error(`V63 unexpectedly short: ${s.durationSeconds}s; expand academically instead of relaxing the gate`);
          if(s.durationSeconds>1300) throw new Error(`V63 unexpectedly long: ${s.durationSeconds}s`);
          NODE

      - name: Production QA post
        run: node shared/qa/validate-video.mjs v63-exiled-masterpieces post

      - id: plan
        working-directory: v63-exiled-masterpieces
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Pack prepared V63
        run: tar --exclude='v63-exiled-masterpieces/node_modules' -czf v63-prepared.tar.gz v63-exiled-masterpieces

      - uses: actions/upload-artifact@v4
        with:
          name: v63-prepared
          retention-days: 1
          if-no-files-found: error
          path: v63-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v63-prepared
          path: .
      - run: tar -xzf v63-prepared.tar.gz
      - name: Install V63 dependencies
        working-directory: v63-exiled-masterpieces
        run: npm install
      - name: Render segment
        working-directory: v63-exiled-masterpieces
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V63ExiledMasterpieces "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v63-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v63-exiled-masterpieces/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v63-prepared
          path: .
      - run: tar -xzf v63-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v63-segment-*
          path: v63-exiled-masterpieces/parts
          merge-multiple: true

      - name: Generate BGM
        working-directory: v63-exiled-masterpieces
        run: node scripts/generate-bgm.mjs

      - name: Concatenate segments
        working-directory: v63-exiled-masterpieces
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4

      - name: Mix narration and BGM
        working-directory: v63-exiled-masterpieces
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.042[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v63-exiled-masterpieces-final.mp4

      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v63-exiled-masterpieces v63-exiled-masterpieces/out/v63-exiled-masterpieces-final.mp4 v63-exiled-masterpieces/out/v63-exiled-masterpieces-contact-sheet.jpg

      - name: Verify QA scene count
        run: |
          node - <<'NODE'
          const s=require('./v63-exiled-masterpieces/src/sync-timing.json');
          if((s.beats||[]).length<95) throw new Error(`QA scene count too low: ${(s.beats||[]).length}`);
          console.log(`QA sheet sourced from ${(s.beats||[]).length} measured scenes`);
          NODE

      - name: Create V63 scene table
        working-directory: v63-exiled-masterpieces
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=require('./src/script-data.json'); const d=require('./src/scene-data.json'); const t=require('./src/sync-timing.json');
          let out='# V63 Scene Table\n\n| Scene | Time | Phase | Shot | Background | Narration |\n|---|---:|---|---|---|---|\n';
          for(let i=0;i<s.beats.length;i++){
            const b=s.beats[i],m=d[i],z=(t.beats||[])[i]||{};
            const st=Number(z.start||0).toFixed(1),en=Number(z.end||0).toFixed(1);
            out+=`| ${b.id} | ${st}-${en}s | ${m.phase} | ${m.shotKind||''} | ${m.bgGroup} | ${b.narration.replace(/\|/g,'／').replace(/\n/g,' ')} |\n`;
          }
          fs.writeFileSync('out/v63-exiled-masterpieces-scene-table.md',out);
          NODE

      - name: Publish GitHub Release
        working-directory: v63-exiled-masterpieces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v63-exiled-masterpieces-${GITHUB_RUN_ID}.mp4"
          cp out/v63-exiled-masterpieces-final.mp4 "out/${VIDEO_NAME}"
          TAG="v63-exiled-masterpieces-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v63-exiled-masterpieces-contact-sheet.jpg out/v63-exiled-masterpieces-scene-table.md public/audio/pronunciation-report.json qa/preproduction-summary.json preproduction-plan.json SOURCES.md V63_IMPLEMENTATION.md src/script-data.json src/scene-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V63 Exiled Masterpieces Production ${GITHUB_RUN_ID}" \
            --notes "失脚した六人の歴史上の書き手と、その後の代表作。オウィディウス（悲しみの歌・黒海からの手紙）、白居易（琵琶行）、柳宗元（永州八記）、菅原道真（菅家後集）、蘇軾（赤壁賦・黄州寒食詩）、ダンテ（神曲）。左遷・追放・亡命の区別を保持し、史料にない映像は歴史再現として扱う。全シーン固有視覚・音声実測字幕同期・BGM・全シーンQA。失脚が名作を生むとする因果の断定を避ける。"
