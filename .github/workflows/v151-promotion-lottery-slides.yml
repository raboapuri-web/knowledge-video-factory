name: v151-promotion-lottery-slides

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v151-promotion-lottery-slides.yml'
      - 'shared/v151/**'

env:
  VOICEVOX_URL: http://127.0.0.1:50021
  VOICEVOX_SPEAKER: '47'
  VOICEVOX_SPEED: '1.15'
  VIDEO_WIDTH: '1920'
  VIDEO_HEIGHT: '1080'
  VIDEO_FPS: '30'
  SLUG: v151-promotion-lottery

concurrency:
  group: v151-promotion-lottery-slides
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  storyboard:
    name: Storyboard validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v151
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile slides and validate narration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile.mjs 2>&1 | tee /tmp/v151-compile.log
          grep -F 'Slide count: 64 slides' /tmp/v151-compile.log
          grep -F 'Chapter breakdown:' /tmp/v151-compile.log
          test -s content/slides.json
          test -s content/audit.json

      - name: Upload storyboard and audit
        uses: actions/upload-artifact@v4
        with:
          name: v151-storyboard-audit
          path: |
            shared/v151/content/slides.json
            shared/v151/content/audit.json
          if-no-files-found: error
          retention-days: 21

  chapters:
    name: Render ${{ matrix.chapter }}
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter:
          - prologue
          - chapter1
          - chapter2
          - chapter3
          - chapter4
          - epilogue
    env:
      CHAPTER: ${{ matrix.chapter }}
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v151/.puppeteer
    defaults:
      run:
        working-directory: shared/v151
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shared/v124/package.json

      - name: Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y -qq fonts-noto-cjk fontconfig ffmpeg curl

      - name: Prepare the V124 Motion Canvas harness and V146 chapter renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/lib src/scenes src/projects scripts media/"$CHAPTER" output

          # V124 supplies the common Motion Canvas/Vite/Puppeteer headless harness.
          cp ../v124/package.json package.json
          cp ../v124/tsconfig.json tsconfig.json
          cp ../v124/vite.config.ts vite.config.ts
          cp ../v124/headless.html headless.html
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts
          cp ../v124/scripts/render.mjs scripts/render.mjs

          # Retarget the renderer's output naming to this independent V151 project.
          sed -i 's/v124/v151/g' scripts/render.mjs

          # V146 supplies the chapter composition engine; only its renderer is reused.
          cp ../v146/src/lib/chapter.tsx src/lib/chapter.tsx

          # Apply the V151-only palette and remove V146-specific visual labels/slide exceptions.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'src/lib/chapter.tsx';
          let s = fs.readFileSync(p, 'utf8');
          const replacements = new Map([
            ["const C_PAPER = '#F2EBDD';", "const C_PAPER = '#F5F1E6';"],
            ["const C_RED = '#A7353A';", "const C_RED = '#C1272D';"],
            ["const C_TEAL = '#4F9297';", "const C_TEAL = '#2E6F73';"],
            ["const C_GRAY = '#A9A6A0';", "const C_GRAY = '#F2C230';"],
            ["const C_BG = '#111317';", "const C_BG = '#0B1026';"],
            ["const C_PANEL = '#1a1d22';", "const C_PANEL = '#14213D';"],
            ["const C_LINE = '#2a2e35';", "const C_LINE = '#2E6F73';"],
            ["const C_AXIS = '#3a3f47';", "const C_AXIS = '#2E6F73';"],
          ]);
          for (const [from, to] of replacements) {
            if (!s.includes(from)) throw new Error(`Expected V146 palette token not found: ${from}`);
            s = s.replace(from, to);
          }
          s = s.replace(
            "const labels = s.id === '46' ? ['系統A', '系統B'] : ['\u6709\u6027\u751F\u6B96', '\u7121\u6027\u751F\u6B96'];",
            "const labels = ['昇進制度', 'ランダム選抜'];"
          );
          s = s.replaceAll("s.id === '48'", "false");
          s = s.replace("s.id + ' / 52'", "s.id + ' / 64'");
          const forbiddenLabels = ['\u6709\u6027\u751F\u6B96', '\u7121\u6027\u751F\u6B96'];
          if (forbiddenLabels.some((word) => s.includes(word))) {
            throw new Error('Forbidden labels remain in the chapter renderer.');
          }
          fs.writeFileSync(p, s);
          console.log('V151 renderer palette and labels configured.');
          NODE

      - name: Install and start VOICEVOX Engine
        shell: bash
        run: |
          set -euo pipefail
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm \
            -p 50021:50021 \
            --name "voicevox-${CHAPTER}" \
            voicevox/voicevox_engine:cpu-latest
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS "${VOICEVOX_URL}/version" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker logs "voicevox-${CHAPTER}" || true
            echo "VOICEVOX Engine did not become ready at ${VOICEVOX_URL}" >&2
            exit 1
          fi
          curl -fsS "${VOICEVOX_URL}/version"
          echo "VOICEVOX READY"

      - name: Synthesize this chapter with VOICEVOX
        run: |
          set -euo pipefail
          node scripts/synth.mjs "$CHAPTER"
          test -s "audio/${CHAPTER}.wav"
          test -s audio/speech-timing.json
          mkdir -p "media/${CHAPTER}"
          cp "audio/${CHAPTER}.wav" "media/${CHAPTER}/narration.wav"
          cp audio/speech-timing.json content/speech-timing.json
          node scripts/compile.mjs "$CHAPTER"
          test -s "content/narration-${CHAPTER}.txt"
          test -s "content/slides-${CHAPTER}.json"

      - name: Build V151 chapter data and Motion Canvas entry points
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const chapter = process.env.CHAPTER;
          const source = JSON.parse(fs.readFileSync(`content/slides-${chapter}.json`, 'utf8'));
          const timingSource = JSON.parse(fs.readFileSync('audio/speech-timing.json', 'utf8'));
          const chapterTiming = timingSource.chapters?.[chapter];
          if (!chapterTiming || !Array.isArray(chapterTiming.sentences)) {
            throw new Error(`Measured sentence timings are missing for ${chapter}`);
          }

          const compact = (value) => String(value ?? '').replace(/\s+/g, '');
          const slides = source.slides;
          const fullNarration = compact(
            fs.readFileSync(`content/narration-${chapter}.txt`, 'utf8')
          );

          const ranges = [];
          let charCursor = 0;
          for (const slide of slides) {
            const text = compact(slide.narration);
            const start = charCursor;
            const end = start + text.length;
            ranges.push({ start, end });
            charCursor = end;
          }
          if (charCursor !== fullNarration.length) {
            throw new Error(`Slide narration does not cover the full ${chapter} narration.`);
          }

          const slideSubs = slides.map(() => []);
          const slideStarts = slides.map(() => Number.POSITIVE_INFINITY);
          const slideEnds = slides.map(() => 0);
          let sentenceCursor = 0;
          let mappedSentences = 0;

          for (const sentence of chapterTiming.sentences) {
            const sentenceText = compact(sentence.text);
            const position = fullNarration.indexOf(sentenceText, sentenceCursor);
            if (!sentenceText || position < 0) {
              throw new Error(`Could not map VOICEVOX sentence ${sentence.index} to ${chapter} narration.`);
            }
            const sentenceEnd = position + sentenceText.length;
            // A VOICEVOX utterance can cross a slide boundary. Split subtitle time
          // by the original character positions while preserving the narration.
          let assignedCharacters = 0;
          for (let slideIndex = 0; slideIndex < ranges.length; slideIndex += 1) {
            const range = ranges[slideIndex];
            const overlapStart = Math.max(position, range.start);
            const overlapEnd = Math.min(sentenceEnd, range.end);
            if (overlapEnd <= overlapStart) continue;
            const startRatio = (overlapStart - position) / sentenceText.length;
            const endRatio = (overlapEnd - position) / sentenceText.length;
            const segmentStartSec = sentence.startSec +
              (sentence.endSec - sentence.startSec) * startRatio;
            const segmentEndSec = sentence.startSec +
              (sentence.endSec - sentence.startSec) * endRatio;
            slideStarts[slideIndex] = Math.min(slideStarts[slideIndex], segmentStartSec);
            slideEnds[slideIndex] = Math.max(slideEnds[slideIndex], segmentEndSec);
            slideSubs[slideIndex].push({
              text: sentenceText.slice(overlapStart - position, overlapEnd - position),
              startSec: segmentStartSec,
              endSec: segmentEndSec,
            });
            assignedCharacters += overlapEnd - overlapStart;
          }
          if (assignedCharacters !== sentenceText.length) {
            throw new Error(`Unmapped VOICEVOX sentence ${sentence.index} in ${chapter}.`);
          }
          sentenceCursor = sentenceEnd;
          mappedSentences += 1;
          }

          const renderSlides = slides.map((slide, index) => {
            const effects = {
              fade: 'fade',
              'slide-up': 'slide-up',
              stagger: 'stagger',
              'zoom-in': 'zoom',
              'pan-right': 'slide-right',
              'diagram-build': 'pulse',
              counter: 'pulse',
            };
            const heading = slide.screen?.heading ?? '';
            const keywords = slide.screen?.keywords ?? [];
            const headingText = String(heading);
            let viz = 'cards';
            if (/くじ引き|昇進制度|出世/.test(headingText)) viz = 'title';
            else if (/法則|理論|原則/.test(headingText)) viz = 'quote';
            else if (/比較|成績|評価|効率/.test(headingText)) viz = 'bars';
            else if (/能力|組織|階層|キャリア/.test(headingText)) viz = 'diagram';
            else if (/報酬|競争|協力/.test(headingText)) viz = 'flow';

            const first = slideStarts[index];
            const last = slideEnds[index];
            const duration = Number.isFinite(first) && last > first
              ? last - first
              : Number(slide.durationSec || 5);

            const subs = slideSubs[index].map((sentence) => ({
              text: sentence.text,
              start: sentence.startSec - (Number.isFinite(first) ? first : 0),
              duration: sentence.endSec - sentence.startSec,
            }));

            return {
              id: String(slide.id),
              ch: chapter,
              heading: headingText,
              display: [headingText, ...keywords.map(String)],
              viz,
              effect: effects[slide.effect?.type] ?? 'fade',
            };
          });

          const renderTiming = {
            slides: slides.map((slide, index) => {
              const first = slideStarts[index];
              const last = slideEnds[index];
              return {
                duration: Number.isFinite(first) && last > first
                  ? last - first
                  : Number(slide.durationSec || 5),
                subs: slideSubs[index].map((sentence) => ({
                  text: sentence.text,
                  start: sentence.startSec - (Number.isFinite(first) ? first : 0),
                  duration: sentence.endSec - sentence.startSec,
                })),
              };
            }),
          };

          fs.writeFileSync('content/render-data.json', JSON.stringify({ slides: renderSlides }, null, 2));
          fs.writeFileSync('content/render-timing.json', JSON.stringify(renderTiming, null, 2));

          fs.writeFileSync(
            `src/scenes/${chapter}.tsx`,
            `import {createChapterScene} from '../lib/chapter';\n` +
            `import data from '../../content/render-data.json';\n` +
            `import timing from '../../content/render-timing.json';\n` +
            `export default createChapterScene('${chapter}', data, timing);\n`
          );

          fs.writeFileSync(
            `src/projects/${chapter}.ts`,
            `import {makeProject} from '@motion-canvas/core';\n` +
            `import scene from '../scenes/${chapter}?scene';\n` +
            `export default makeProject({scenes: [scene]});\n`
          );

          console.log(`V151 render data ready: ${renderSlides.length} slides, ${mappedSentences} timed sentences.`);
          NODE

      - name: Install Motion Canvas dependencies
        run: npm install --no-audit --no-fund

      - name: Build Motion Canvas project
        run: npm run build

      - name: Render chapter video
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render.mjs "$CHAPTER"
          RENDERED="output/v151-${CHAPTER}.mp4"
          test -s "$RENDERED"
          ffmpeg -y -i "$RENDERED" -i "media/${CHAPTER}/narration.wav" \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k -shortest \
            "output/v151-${CHAPTER}-with-audio.mp4"
          mv "output/v151-${CHAPTER}-with-audio.mp4" "$RENDERED"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$RENDERED"

      - name: Upload chapter segment
        uses: actions/upload-artifact@v4
        with:
          name: v151-segment-${{ matrix.chapter }}
          path: shared/v151/output/v151-${{ matrix.chapter }}.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  finalize:
    name: Finalize, mix BGM, and publish release
    needs: chapters
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v151
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq ffmpeg

      - name: Download six chapter videos
        uses: actions/download-artifact@v4
        with:
          pattern: v151-segment-*
          path: ${{ github.workspace }}/shared/v151/segments
          merge-multiple: true

      - name: Generate original V151 ambient BGM
        run: |
          set -euo pipefail
          node scripts/gen-bgm.mjs bgm/ambient-v151.wav
          test -s bgm/ambient-v151.wav
          mkdir -p public
          ffmpeg -y -i bgm/ambient-v151.wav -codec:a libmp3lame -q:a 4 public/bgm.mp3
          test -s public/bgm.mp3

      - name: Concatenate chapters and mix BGM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          : > output/concat.txt
          for chapter in prologue chapter1 chapter2 chapter3 chapter4 epilogue; do
            file="$GITHUB_WORKSPACE/shared/v151/segments/v151-${chapter}.mp4"
            test -s "$file"
            printf "file '%s'\n" "$file" >> output/concat.txt
          done

          ffmpeg -y -f concat -safe 0 -i output/concat.txt \
            -c copy -movflags +faststart output/v151-voice-master.mp4

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v151-voice-master.mp4)"
          test -n "$DURATION"

          ffmpeg -y \
            -i output/v151-voice-master.mp4 \
            -stream_loop -1 -i public/bgm.mp3 \
            -filter_complex "[1:a]volume=0.15,atrim=duration=${DURATION}[bgm];[0:a]volume=1.0[voice];[voice][bgm]amix=inputs=2:duration=first:dropout_transition=3[aout]" \
            -map 0:v:0 -map "[aout]" \
            -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart \
            output/v151-promotion-lottery-slides.mp4

          VIDEO_DIMENSIONS="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/v151-promotion-lottery-slides.mp4)"
          if [ "$VIDEO_DIMENSIONS" != "1920x1080" ]; then
            echo "Unexpected final dimensions: $VIDEO_DIMENSIONS" >&2
            exit 1
          fi

          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 output/v151-promotion-lottery-slides.mp4

      - name: Create contact sheet
        shell: bash
        run: |
          set -euo pipefail
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v151-promotion-lottery-slides.mp4)"
          INTERVAL="$(python3 -c "print(max(1.0, float('$DURATION')/24))")"
          ffmpeg -y -i output/v151-promotion-lottery-slides.mp4 \
            -vf "fps=1/${INTERVAL},scale=384:-1,tile=6x4:padding=4:margin=4" \
            -frames:v 1 output/v151-contact-sheet.jpg

      - name: Upload final video and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: v151-promotion-lottery-final
          path: |
            shared/v151/output/v151-promotion-lottery-slides.mp4
            shared/v151/output/v151-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v151-promotion-lottery-slides \
            --title "V151 考える夜｜会社の昇進をくじ引きで決めるとどうなるのか？" \
            --notes "12行目専用の完成動画。1920x1080・30fps。64スライド。VOICEVOX 青山龍星（話者ID47、速度1.15）。BGMはv151専用のオリジナル音源。" \
            output/v151-promotion-lottery-slides.mp4 \
            spec.md \
            content/slides.json
