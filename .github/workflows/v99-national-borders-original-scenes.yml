name: V99 National Borders Original Scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v99-national-borders-original-scenes.yml','shared/bootstrap/v99-national-borders-original-scenes.mjs','shared/v99/**']
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v99-national-borders-original-scenes.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v99-national-borders-original-scenes
        run: npm install
      - working-directory: v99-national-borders-original-scenes
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v99-national-borders-original-scenes
        run: node scripts/build-preproduction.mjs
      - name: Fine scene and static-background guard
        run: |
          node - <<'NODE'
          const s=require('./v99-national-borders-original-scenes/src/script-data.json'),d=require('./v99-national-borders-original-scenes/src/scene-data.json');const n=s.beats.length;if(n!==195)throw Error(`expected 195 sentence-scenes, got ${n}`);if(d.length!==n)throw Error('scene mismatch');if(new Set(d.map(x=>x.visual)).size!==n)throw Error('visual key reuse');if(new Set(d.map(x=>x.bgGroup)).size!==n)throw Error('background ID reuse');if(new Set(d.map(x=>x.sceneKey)).size!==n)throw Error('scene key reuse');const phases=new Set(d.map(x=>x.phase)),families=new Set(d.map(x=>x.family));if(phases.size!==28)throw Error(`expected 28 phases, got ${phases.size}`);if(families.size<12)throw Error(`too few families ${families.size}`);for(let i=0;i<d.length;i++){if(i&&d[i].family===d[i-1].family)throw Error(`adjacent family repeat ${d[i].id}`);const w=d.slice(Math.max(0,i-5),i+1);if(w.length===6&&new Set(w.map(x=>x.family)).size<5)throw Error(`low six-shot variety ${d[i].id}`);}const fs=require('fs');for(const f of ['scenes.tsx','phases-a.tsx','phases-b.tsx','phases-c.tsx','phases-d.tsx']){const src=fs.readFileSync('./shared/v99/'+f,'utf8');if(!src.includes('throw new Error')&&f!=='scenes.tsx')throw Error(`renderer lacks unsupported-variant guard ${f}`);}const dispatcher=fs.readFileSync('./shared/v99/scenes.tsx','utf8');for(const ph of phases)if(!dispatcher.includes(`case'${ph}'`))throw Error(`missing explicit phase dispatcher ${ph}`);if(dispatcher.includes('default:return'))throw Error('generic renderer fallback prohibited');console.log(`${n} authored sentence-scenes / ${phases.size} phases / ${families.size} visual rhythm families`);
          NODE
      - working-directory: v99-national-borders-original-scenes
        run: npm run check
      - name: Preview critical original shots
        working-directory: v99-national-borders-original-scenes
        run: |
          mkdir -p out/preview
          for FRAME in 0 300 600 900 1200 1500 1800 2100 2400 2700 3000 3300 3600 3900 4200 4500 4800 5100 5400 5700; do
            npx remotion still src/index.tsx V99ScenePreview "out/preview/scene-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 20
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v99-national-borders-original-scenes
        run: node scripts/generate-voicevox.mjs
      - name: Enforce one-sentence original-scene timing
        working-directory: v99-national-borders-original-scenes
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v99-national-borders-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v99-national-borders-original-scenes/node_modules' -czf v99-prepared.tar.gz v99-national-borders-original-scenes
      - uses: actions/upload-artifact@v4
        with: {name: v99-prepared, path: v99-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v99-prepared}
      - run: tar -xzf v99-prepared.tar.gz
      - working-directory: v99-national-borders-original-scenes
        run: npm install
      - working-directory: v99-national-borders-original-scenes
        run: mkdir -p out && npx remotion render src/index.tsx V99NationalBordersOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v99-segment-${{ matrix.id }}', path: 'v99-national-borders-original-scenes/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v99-prepared}
      - run: tar -xzf v99-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v99-segment-*', path: v99-national-borders-original-scenes/parts, merge-multiple: true}
      - working-directory: v99-national-borders-original-scenes
        run: node scripts/generate-bgm.mjs
      - working-directory: v99-national-borders-original-scenes
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v99-final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v99-final.mp4 | head -1)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v99-final.mp4 | head -1)" = '1080'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v99-final.mp4 | cut -d. -f1)" -gt 650
      - run: node shared/qa/generate-scene-contact-sheet.mjs v99-national-borders-original-scenes v99-national-borders-original-scenes/out/v99-final.mp4 v99-national-borders-original-scenes/out/v99-contact-sheet.jpg
      - working-directory: v99-national-borders-original-scenes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v99-national-borders-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v99-national-borders-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v99-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v99-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V99_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V99 National Borders Original Scenes ${GITHUB_RUN_ID}" --notes "V99 full original-scene rebuild: 195 full-sentence scenes, 28 explicit phase renderers, no imported reusable background assets, no generic fallback, unique background and scene key for every sentence, measured under-15-second scene guard, 20 preview stills, neutral sourced treatment, VOICEVOX, subtitles and BGM."
