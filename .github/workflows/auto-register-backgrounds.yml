name: Auto-register uploaded backgrounds
on:
  push:
    branches: [main]
    paths:
      - 'shared/asset-library/背景/**'
      - 'shared/asset-library/register-backgrounds.mjs'
      - '.github/workflows/auto-register-backgrounds.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: background-catalog-main
  cancel-in-progress: false
jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Register background files in JSON master
        run: node shared/asset-library/register-backgrounds.mjs
      - name: Verify catalog and video selector
        run: |
          node shared/asset-library/test-assets.mjs
          node shared/asset-library/test-register.mjs
      - name: Commit master changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/asset-library/catalog.json
          if git diff --cached --quiet; then
            echo 'No new backgrounds to register.'
          else
            git commit -m 'Sync uploaded background image metadata into catalog'
            git push origin HEAD:main
          fi
