name: V146 Mammal Sex Evolution Presentation Motion Canvas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v146-mammal-sex-evolution-slides.yml
      - shared/v146/**

permissions:
  contents: write

concurrency:
  group: v146-mammal-sex-evolution-${{ github.sha }}
  cancel-in-progress: false

jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v146
    steps:
      - uses: actions/checkout@v4
      - name: Validate narration and slide boundaries
        run: node scripts/compile.mjs
      - name: Check audit
        run: node -e "const a=require('./content/audit.json'); if(a.totalSlides!==52||a.errors.length){console.error(a);process.exit(1)} console.log('PREFLIGHT_OK', a.totalSlides, 'render units /', a.specSlides, 'spec slides')"
      - uses: actions/upload-artifact@v4
        with:
          name: v146-source-audit
          path: shared/v146/content/audit.json
          retention-days: 21

  chapter:
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter: [prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, epilogue]
    env:
      CHAPTER: ${{ matrix.chapter }}
      VOICEVOX_SPEED: '1.15'
      VOICEVOX_SPEAKER_ID: '13'
      VOICE_PARALLEL: '3'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v146/.puppeteer
    defaults:
      run:
        working-directory: shared/v146
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system packages
        run: sudo apt-get install -y -qq fonts-noto-cjk fontconfig ffmpeg
      - name: Reuse stable Motion Canvas rendering runtime from V124
        run: |
          cp ../v124/package.json .
          cp ../v124/tsconfig.json .
          cp ../v124/vite.config.ts .
          cp ../v124/headless.html .
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts
          cp ../v124/scripts/render.mjs scripts/render.mjs
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          mkdir -p src/lib
          sed -i 's/v124/v146/g; s/!smoke/false/g' scripts/render.mjs
          grep -n "v146" scripts/render.mjs
      - name: Compile slides and generate project
        run: |
          node --check scripts/compile.mjs
          node --check scripts/synth.mjs
          node scripts/compile.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start VOICEVOX engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then echo VOICEVOX_UP; exit 0; fi
            sleep 2
          done
          echo "VOICEVOX did not start" >&2
          docker logs $(docker ps -q --filter ancestor=voicevox/voicevox_engine:cpu-latest | head -1) || true
          exit 1
      - name: Synthesize narration
        run: |
          node scripts/synth.mjs "$CHAPTER"
          test -s "media/$CHAPTER/narration.wav"
          test -s "content/measured-$CHAPTER.json"
      - name: Build
        run: npm run build
      - name: Smoke render
        run: |
          node scripts/render.mjs "$CHAPTER" --smoke
          test -s "output/v146-$CHAPTER-smoke.mp4"
      - name: Render chapter video
        run: |
          node scripts/render.mjs "$CHAPTER"
          test -s "output/v146-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v146-$CHAPTER.mp4"
      - name: Mix narration audio
        run: |
          ffmpeg -y -i "output/v146-$CHAPTER.mp4" -i "media/$CHAPTER/narration.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "output/v146-$CHAPTER-with-audio.mp4"
          mv "output/v146-$CHAPTER-with-audio.mp4" "output/v146-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v146-$CHAPTER.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: v146-segment-${{ matrix.chapter }}
          path: shared/v146/output/v146-${{ matrix.chapter }}.mp4
          retention-days: 14
          compression-level: 0

  finalize:
    needs: chapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v146
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: v146-segment-*
          path: ${{ github.workspace }}/shared/v146/segments
          merge-multiple: true
      - name: Concatenate chapters
        run: |
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 epilogue; do
            echo "file 'segments/v146-$c.mp4'" >> output/concat.txt
          done
          cat output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy -movflags +faststart output/v146-voice-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v146-voice-master.mp4
      - name: Mix BGM if available
        run: |
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          BGM_FILE=""
          for cand in "../../common/BGM/Amazon-river-ambience.mp3" "../common/BGM/Amazon-river-ambience.mp3" "common/BGM/Amazon-river-ambience.mp3"; do
            if [ -f "$cand" ]; then BGM_FILE="$cand"; break; fi
          done
          if [ -n "$BGM_FILE" ]; then
            echo "BGM found at $BGM_FILE, mixing at 0.035"
            mkdir -p common/BGM
            cp "$BGM_FILE" common/BGM/Amazon-river-ambience.mp3
            D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v146-voice-master.mp4)
            node scripts/generate-bgm.mjs "$D"
            ffmpeg -y -i output/v146-voice-master.mp4 -i output/bgm.m4a -filter_complex "[0:a]volume=1[voice];[1:a]volume=.035[music];[voice][music]amix=inputs=2:duration=first;[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart output/v146-mammal-sex-evolution-slides-final.mp4
          else
            echo "BGM not found, finishing without BGM"
            cp output/v146-voice-master.mp4 output/v146-mammal-sex-evolution-slides-final.mp4
          fi
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 output/v146-mammal-sex-evolution-slides-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v146-mammal-sex-evolution-slides-final.mp4
      - name: Contact sheet
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v146-mammal-sex-evolution-slides-final.mp4)
          I=$(python3 -c "print(max(1.0, float('$D')/24))")
          ffmpeg -y -i output/v146-mammal-sex-evolution-slides-final.mp4 -vf "fps=1/$I,scale=384:-1,tile=6x4:padding=4:margin=4" -frames:v 1 output/v146-contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: v146-mammal-sex-evolution-slides-master
          path: |
            shared/v146/output/v146-mammal-sex-evolution-slides-final.mp4
            shared/v146/output/v146-contact-sheet.jpg
          retention-days: 21
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v146-mammal-sex-evolution-slides-${{ github.run_id }}"
          TITLE="V146 考える夜｜なぜ哺乳類は進化の過程を、非効率なセックスを残し続けたのか 完成動画"
          gh release create "$TAG" --title "$TITLE" --notes "V146 完成動画（1920x1080・30fps）。スライド48枚（レンダリング単位52）。ナレーションはVOICEVOX（青山龍星、速度1.15）で合成。" output/v146-mammal-sex-evolution-slides-final.mp4 output/v146-contact-sheet.jpg
