# V153 考える夜｜なぜあなたは、誰も覚えていない失敗を反省し続けるのか？
# - storyboard: 台本・スライド整合性監査 + audit.json をアーティファクト化
# - chapter: 6章並列(最大3)で VOICEVOX 合成→ Motion Canvas レンダ→音声ミックス
# - finalize: 章 MP4 を連結→ BGM ミックス→コンタクトシート→リリース作成
name: V153 Imaginary Audience / CINEMATIC ESSAY


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v153-imaginary-audience-cinematic.yml'
      - 'shared/v153/**'


permissions:
  contents: write


concurrency:
  group: v153-imaginary-audience-production
  cancel-in-progress: true


jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v153
    steps:
      - uses: actions/checkout@v4
      - name: Compile slides and check audit
        run: node scripts/compile.mjs
      - name: Check audit
        run: node -e "const a=require('./content/audit.json'); if(a.totalSlides<70||a.totalSlides>115||a.errors.length){console.error(a);process.exit(1)} console.log('PREFLIGHT_OK',a.totalSlides,'render units')"
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v153-source-audit
          path: shared/v153/content/audit.json
          retention-days: 21


  chapter:
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter: [prologue, chapter1, chapter2, chapter3, chapter4, epilogue]
    env:
      CHAPTER: ${{ matrix.chapter }}
      VOICEVOX_SPEED: '1.15'
      VOICEVOX_SPEAKER_ID: '13'
      VOICE_PARALLEL: '3'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v153/.puppeteer
    defaults:
      run:
        working-directory: shared/v153
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg with package-manager fallback
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 300 sudo apt-get update -qq || true
            timeout 480 sudo apt-get install -y --no-install-recommends ffmpeg || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            mkdir -p /tmp/v153-ffmpeg "$HOME/.local/bin"
            npm install --prefix /tmp/v153-ffmpeg --no-save --no-audit --no-fund ffmpeg-static @ffprobe-installer/ffprobe
            ln -sf /tmp/v153-ffmpeg/node_modules/ffmpeg-static/ffmpeg "$HOME/.local/bin/ffmpeg"
            ln -sf "$(node -p "require('/tmp/v153-ffmpeg/node_modules/@ffprobe-installer/ffprobe').path")" "$HOME/.local/bin/ffprobe"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Reuse v124 tested headless harness and V153 bespoke renderer
        run: |
          mkdir -p src src/lib scripts
          cp ../v124/package.json package.json
          cp ../v124/tsconfig.json tsconfig.json
          cp ../v124/vite.config.ts vite.config.ts
          cp ../v124/headless.html headless.html
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts # { echo; echo 'declare module "*.json" {'; echo '  const value: any;'; echo '  export default value;'; echo '}'; } >> src/types.d.ts
          
          cp ../v124/scripts/render.mjs scripts/render.mjs
          sed -i 's/v124/v153/g; s/!smoke/false/g' scripts/render.mjs # "s|page.on('pageerror',err=>console.error('PAGE_ERROR',err.message));|& page.on('console',msg=>console.log('PAGE_CONSOLE',msg.type(),msg.text())); page.on('response',res=>{if(res.status()>=400)console.log('PAGE_RESPONSE',res.status(),res.url());});|" scripts/render.mjs
          grep -n "v153" scripts/render.mjs
          # V153 has a dedicated renderer with custom footage-inspired Motion Canvas visuals
          test -s src/lib/chapter.tsx
          cp ../v150/scripts/synth.mjs scripts/synth.mjs
          echo "V153 CINEMATIC VECTOR ESSAY ENGINE READY"
      - name: Compile slides and generate project
        run: node scripts/compile.mjs "$CHAPTER" # content/slides.json && cp ../v149/content/narration-*.txt content/ && sed -i "s/!== 58/!== 33/" scripts/compile.mjs && node scripts/compile.mjs "$CHAPTER" && node -e "const fs=require('fs');const p='content/slides.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));for(const s of j.slides){}fs.writeFileSync(p,JSON.stringify(j));console.log('CONTROL_V149_DATA',j.slides.length);"
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            if npm install --no-audit --no-fund --prefer-online; then exit 0; fi
            echo "npm install attempt $attempt failed; retrying..."
            npm cache clean --force || true
            sleep $((attempt * 8))
          done
          exit 1
      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then echo "VOICEVOX READY"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version
      - name: Synthesize narration
        run: node scripts/synth.mjs "$CHAPTER" # cat "content/measured-${CHAPTER}.json" | head -c 3000; echo
      - name: Build
        run: npm run build #(require('./node_modules/typescript/package.json').version)"; ls content src/scenes src/projects; cat tsconfig.json; cat "src/scenes/${CHAPTER}.tsx" "src/projects/${CHAPTER}.ts"; npm run build
      - name: Smoke render
        run: |
          timeout 600 npm run render:smoke || true
          ls -la output/ || true
          if [ -d "output/v153-$CHAPTER" ]; then echo "SMOKE PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v153-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v153-$CHAPTER.mp4"; fi
          ls -la output/ || true
      - name: Render chapter video
        run: |
          timeout 2400 npm run render || true
          ls -la output/ || true
          if [ -d "output/v153-$CHAPTER" ]; then echo "PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v153-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v153-$CHAPTER.mp4"; fi
          ls -lh "output/v153-$CHAPTER.mp4"
      - name: Mix narration audio
        run: |
          ls -lh media/$CHAPTER/narration.wav "output/v153-$CHAPTER.mp4"
          ffmpeg -y -i "output/v153-$CHAPTER.mp4" -i media/$CHAPTER/narration.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "output/v153-$CHAPTER-with-audio.mp4"
          mv "output/v153-$CHAPTER-with-audio.mp4" "output/v153-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v153-$CHAPTER.mp4"
      - name: Upload chapter segment
        uses: actions/upload-artifact@v4
        with:
          name: v153-segment-${{ matrix.chapter }}
          path: shared/v153/output/v153-${{ matrix.chapter }}.mp4
          retention-days: 14
          compression-level: 0


  finalize:
    needs: chapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v153
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg for final assembly
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 300 sudo apt-get update -qq || true
            timeout 480 sudo apt-get install -y --no-install-recommends ffmpeg || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            mkdir -p /tmp/v153-ffmpeg "$HOME/.local/bin"
            npm install --prefix /tmp/v153-ffmpeg --no-save --no-audit --no-fund ffmpeg-static @ffprobe-installer/ffprobe
            ln -sf /tmp/v153-ffmpeg/node_modules/ffmpeg-static/ffmpeg "$HOME/.local/bin/ffmpeg"
            ln -sf "$(node -p "require('/tmp/v153-ffmpeg/node_modules/@ffprobe-installer/ffprobe').path")" "$HOME/.local/bin/ffprobe"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Download chapter segments
        uses: actions/download-artifact@v4
        with:
          pattern: v153-segment-*
          path: ${{ github.workspace }}/shared/v153/segments
          merge-multiple: true
      - name: Concatenate chapters
        run: |
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 chapter4 epilogue; do echo "file '$GITHUB_WORKSPACE/shared/v153/segments/v153-$c.mp4'" >> output/concat.txt; done
          cat output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy -movflags +faststart output/v153-voice-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v153-voice-master.mp4
      - name: Generate original ambient BGM and mix soundtrack
        run: |
          set -euo pipefail
          mkdir -p bgm output
          node ../v151/scripts/gen-bgm.mjs bgm/v153-original-ambient.wav
          test -s bgm/v153-original-ambient.wav
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v153-voice-master.mp4)
          ffmpeg -y -i output/v153-voice-master.mp4 -stream_loop -1 -i bgm/v153-original-ambient.wav \
            -filter_complex "[0:a]volume=1.0[voice];[1:a]volume=0.16[music];[voice][music]amix=inputs=2:duration=first:dropout_transition=3[aout]" \
            -map 0:v:0 -map "[aout]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart output/v153-imaginary-audience-cinematic-final.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 output/v153-imaginary-audience-cinematic-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v153-imaginary-audience-cinematic-final.mp4
      - name: Create contact sheet
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v153-imaginary-audience-cinematic-final.mp4)
          I=$(python3 -c "print(max(1.0, float('$D')/24))")
          ffmpeg -y -i output/v153-imaginary-audience-cinematic-final.mp4 -vf "fps=1/$I,scale=384:-1,tile=6x4:padding=4:margin=4" -frames:v 1 output/v153-contact-sheet.jpg
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: v153-imaginary-audience-cinematic-master
          path: |
            shared/v153/output/v153-imaginary-audience-cinematic-final.mp4
            shared/v153/output/v153-contact-sheet.jpg
          retention-days: 21
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v153-imaginary-audience-cinematic-${{ github.run_id }}"
          TITLE="V153 考える夜｜誰も覚えていない失敗｜CINEMATIC REMAKE"
          gh release create "$TAG" --title "$TITLE" --notes "Googleドキュメントの台本全文。V153 FULL CINEMATIC REMAKE｜1920×1080 / 30fps. 90 dedicated visual scenes, dynamic cinematic camera, editorial typography, animated psychological diagrams, bespoke transitions, verified VOICEVOX narration with subtitles, original ambient sound design." output/v153-imaginary-audience-cinematic-final.mp4 output/v153-contact-sheet.jpg


# Note: chapter render steps use npm run render / render:smoke; shared/v124/package.json must pass $CHAPTER to scripts/render.mjs.
