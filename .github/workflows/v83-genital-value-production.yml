name: V83 Genital Value Full Production
on:
  push:
    branches:
      - codex/v83-genital-value-production
    paths:
      - 'v83-genital-value/**'
      - '.github/workflows/v83-genital-value-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          cd v83-genital-value
          npm install --no-audit --no-fund
          ln -sfn "$PWD/node_modules" ../node_modules
      - name: Validate scene plan and stage reusable assets
        working-directory: v83-genital-value
        run: npm run prepare
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name v83-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs v83-voicevox
          exit 1
      - name: Generate measured narration
        working-directory: v83-genital-value
        run: npm run voice
      - name: Check scene renderer
        working-directory: v83-genital-value
        run: npm run check
      - name: Render MP4
        working-directory: v83-genital-value
        run: npm run render
      - name: Inspect delivered video
        working-directory: v83-genital-value
        run: |
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/V83_GENITAL_VALUE_FINAL.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of json out/V83_GENITAL_VALUE_FINAL.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: V83_GENITAL_VALUE_FINAL
          path: v83-genital-value/out/V83_GENITAL_VALUE_FINAL.mp4
          retention-days: 30
