name: Detailed visual analysis for pending assets
on:
  push:
    branches: [main]
    paths:
      - 'shared/asset-library/review-pending-assets.mjs'
      - '.github/workflows/review-pending-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: detailed-asset-review-main
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install SVG rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Analyze every pending background and prop image in detail
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node shared/asset-library/review-pending-assets.mjs
      - name: Validate resulting JSON catalog
        run: |
          node shared/asset-library/test-assets.mjs
          node shared/asset-library/test-register.mjs
      - name: Commit detailed metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add shared/asset-library/catalog.json
          if git diff --cached --quiet; then
            echo 'No pending visual metadata.'
          else
            git commit -m 'Detailed visual analysis for uploaded backgrounds and parts'
            git push origin HEAD:main
          fi
