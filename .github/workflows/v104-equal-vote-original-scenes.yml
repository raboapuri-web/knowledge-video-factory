name: V104 Equal Vote Original Scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v104-equal-vote-original-scenes.yml'
      - 'shared/v104/**'
      - 'shared/bootstrap/v104-equal-vote-original-scenes.mjs'
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize complete manually authored V104 scenes
        run: node shared/bootstrap/v104-equal-vote-original-scenes.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v104-equal-vote-original-scenes
        run: npm install
      - working-directory: v104-equal-vote-original-scenes
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v104-equal-vote-original-scenes
        run: node scripts/build-preproduction.mjs
      - name: Explicit semantic scene coverage and anti-repetition check
        run: |
          node - <<'NODE'
          const fs=require('fs'),dir='v104-equal-vote-original-scenes/src/';
          const d=require('./'+dir+'scene-data.json'),s=require('./'+dir+'script-data.json');
          if(d.length!==120||s.beats.length!==120)throw Error('Expected 120 authored narration scenes');
          if(new Set(d.map(b=>b.phase)).size!==6)throw Error('Missing narrative chapter');
          for(const k of ['actionId','visual','sceneKey','bgGroup','environment'])if(new Set(d.map(x=>x[k])).size!==120)throw Error('Duplicate V104 '+k);
          const fs2=new Set(d.map(x=>x.family));if(fs2.size<28)throw Error('Not enough genuine visual families '+fs2.size);
          for(let i=0;i<d.length;i++){
            const b=d[i];if(!b.action||!b.primary||!b.verb||!b.narration)throw Error('Unassigned original animation '+b.id);
            if(i&&d[i-1].family===b.family)throw Error('Adjacent similar cut '+b.id);
            const w=d.slice(Math.max(0,i-5),i+1);
            if(w.length===6&&new Set(w.map(x=>x.family)).size<5)throw Error('Six-cut visual repetition '+b.id);
          }
          const e=fs.readFileSync('shared/v104/civic-engine.tsx','utf8');
          const a=fs.readFileSync('shared/v104/civic-art.tsx','utf8');
          const back=fs.readFileSync('shared/v104/civic-backgrounds.tsx','utf8');
          if(!e.includes("default:throw Error('No V104 scene renderer")||!a.includes("default:throw Error('V104 unsupported original object")||!back.includes("throw Error('V104 has no bespoke backdrop"))throw Error('Generic visual fallback detected');
          console.log('V104 original-scene QA: 120 original actions, 120 distinct settings, '+fs2.size+' visual families, 6 chapters');
          NODE
      - working-directory: v104-equal-vote-original-scenes
        run: npm run check
      - name: Draw 24 storyboard stills before voice generation
        working-directory: v104-equal-vote-original-scenes
        run: |
          mkdir -p out/preview
          for I in $(seq 0 23); do
            FRAME=$(( I * (120 * 20 - 1) / 23 ))
            npx remotion still src/index.tsx V104ScenePreview "out/preview/scene-${I}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 24
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v104-equal-vote-original-scenes
        run: node scripts/generate-voicevox.mjs
      - name: Reject long or visually repetitive scenes using measured speech
        working-directory: v104-equal-vote-original-scenes
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v104-equal-vote-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v104-equal-vote-original-scenes/node_modules' -czf v104-prepared.tar.gz v104-equal-vote-original-scenes
      - uses: actions/upload-artifact@v4
        with: {name: v104-prepared, path: v104-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v104-prepared}
      - run: tar -xzf v104-prepared.tar.gz
      - working-directory: v104-equal-vote-original-scenes
        run: npm install
      - working-directory: v104-equal-vote-original-scenes
        run: mkdir -p out && npx remotion render src/index.tsx V104EqualVoteOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v104-segment-${{ matrix.id }}', path: 'v104-equal-vote-original-scenes/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with: {name: v104-prepared}
      - run: tar -xzf v104-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v104-segment-*', path: v104-equal-vote-original-scenes/parts, merge-multiple: true}
      - working-directory: v104-equal-vote-original-scenes
        run: node scripts/generate-bgm.mjs
      - name: Concat eight segments, mux sound and verify finished file
        working-directory: v104-equal-vote-original-scenes
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          test "$(wc -l < out/concat.txt)" -eq 8
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v104-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v104-final.mp4 | head -1 | tr -cd '0-9')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v104-final.mp4 | head -1 | tr -cd '0-9')
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v104-final.mp4 | tr -d '\r')
          A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 out/v104-final.mp4 | wc -l)
          echo "verified video ${W}x${H} duration=${D} audio-streams=${A}"
          test "$W" = 1920
          test "$H" = 1080
          test "$A" -ge 1
          awk "BEGIN{exit !($D > 700)}"
      - run: node shared/qa/generate-scene-contact-sheet.mjs v104-equal-vote-original-scenes v104-equal-vote-original-scenes/out/v104-final.mp4 v104-equal-vote-original-scenes/out/v104-contact-sheet.jpg
      - name: Publish original-scene V104 after verified output
        working-directory: v104-equal-vote-original-scenes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v104-equal-vote-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v104-equal-vote-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v104-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v104-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V104_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V104 Equal Vote Original Scenes ${GITHUB_RUN_ID}" --notes "V99-method V104: 120 individually authored narration-specific election scenes; all custom vector artworks; no borrowed V99/V102 plate; at least 28 visual families, six-shot diversity guard, measured VOICEVOX narration and synchronized Japanese subtitles, original action IDs, neutral historical exposition, 1920x1080 and restrained BGM."
