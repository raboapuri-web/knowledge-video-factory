name: Kangaeru Yoru v7 PHOTO-only result audit
on:
  push:
    branches: [kangaeru-yoru-v7-design-20261106]
    paths: ['.github/workflows/kangaeru-v7-photo-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  photo_audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kangaeru-yoru-v7-full-gk-photo-rights-and-visual-match
          run-id: 42169742050
          github-token: ${{ github.token }}
          path: audited/
      - uses: actions/download-artifact@v4
        with:
          name: kangaeru-yoru-v6-gk-aoyama-full-e2e
          run-id: 42149952048
          github-token: ${{ github.token }}
          path: old_v6/
      - name: Inspect rejected v7 image candidates and older correctly matched GK photo
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('audited')
          q=json.loads(next(root.rglob('qa_photos.json')).read_text(encoding='utf8'))
          m=json.loads(next(root.rglob('photo_ledger.json')).read_text(encoding='utf8'))
          print('PHOTO_QA',json.dumps(q,ensure_ascii=False))
          for x in m.get('rejected',[])[:30]:
            print('REJECT',json.dumps(x,ensure_ascii=False))
          print('VISION_API_USAGE',json.dumps(m['vision_usage'],ensure_ascii=False))
          old=list(pathlib.Path('old_v6').rglob('materials.json'))
          for item in old[:2]:
            z=json.loads(item.read_text(encoding='utf8'))
            for a in z.get('photos',[]):
              print('OLDER_V6_PHOTO',json.dumps({'title':a.get('title'),'license':a.get('license'),'source_page':a.get('source_page'),'description':a.get('description')},ensure_ascii=False))
          PY
