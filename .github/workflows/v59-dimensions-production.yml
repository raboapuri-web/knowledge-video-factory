name: V59 Dimensions Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v59-dimensions-production.yml'
      - 'shared/bootstrap/v59-dimensions.mjs'
      - 'shared/v59/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V59 production
        run: node shared/bootstrap/v59-dimensions.mjs

      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V59 dependencies
        working-directory: v59-dimensions
        run: npm install

      - name: Expose dependencies to shared tools
        working-directory: v59-dimensions
        run: ln -sfn "$PWD/node_modules" ../node_modules

      - name: Build preproduction plan
        working-directory: v59-dimensions
        run: node scripts/build-preproduction.mjs

      - name: Story, fine-scene and static-background guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v59-dimensions/src/script-data.json');
          const d=require('./v59-dimensions/src/scene-data.json');
          const n=s.beats.length;
          if(!s.beats[0].narration.startsWith('金曜日の午後七時。東京の巨大な駅で、一人の男性が恋人を待っている。')) throw new Error('Wrong canonical V59 script loaded');
          if(n<115||n>140) throw new Error(`Unexpected V59 scene count ${n}`);
          if(d.length!==n) throw new Error(`Scene data mismatch ${d.length}/${n}`);
          if(new Set(s.beats.map(b=>b.visual)).size!==n) throw new Error('Every V59 scene must have a distinct visual key');
          const groups=[...new Set(d.map(x=>x.bgGroup))];
          if(groups.length<70) throw new Error(`Need at least 65 background groups, got ${groups.length}`);
          const seen=new Set(); let prev=''; const counts={};
          for(const x of d){
            counts[x.bgGroup]=(counts[x.bgGroup]||0)+1;
            if(x.bgGroup!==prev&&seen.has(x.bgGroup)) throw new Error(`Background reused non-consecutively: ${x.bgGroup}`);
            seen.add(x.bgGroup); prev=x.bgGroup;
          }
          for(const [g,c] of Object.entries(counts)) if(c>2) throw new Error(`Background ${g} used ${c} scenes; max 2`);
          const required=['station','station_slice','question','line_world','plane_world','paper_fly','axes','flatland_book','flatland_house','sphere_section','fourth_thought','riemann','dimension_build','tesseract','four_dimensions','time_station','einstein','train','simultaneity','minkowski','worldline','lightcone','gps','four_compare','fifth_geometry','fifth_types','kaluza','klein_hose','compactification','collider','evidence','misconceptions','return_station','teach','closing','summary'];
          const phases=new Set(d.map(x=>x.phase));
          for(const p of required) if(!phases.has(p)) throw new Error(`Missing semantic phase ${p}`);
          const code=fs.readFileSync('./shared/v59/scenes.tsx','utf8');
          for(const p of required) if(!code.includes(`case '${p}'`)) throw new Error(`Renderer missing phase ${p}`);
          if(code.includes('useCurrentFrame')) throw new Error('Scene renderer backgrounds must not use global frame motion');
          console.log(`V59 architecture: ${n} scenes / ${phases.size} phases / ${groups.length} background groups / sequential-only max2`);
          NODE

      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v59-dimensions pre

      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs

      - name: TypeScript check
        working-directory: v59-dimensions
        run: npm run check

      - name: Geometry and timeline render smoke test
        working-directory: v59-dimensions
        run: |
          mkdir -p out/preview
          for FRAME in 9 310 710 1110 1510 1910 2310; do
            npx remotion still src/index.tsx V59ScenePreview "out/preview/frame-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 7

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Generate measured narration
        working-directory: v59-dimensions
        run: node scripts/generate-voicevox.mjs

      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v59-dimensions/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} scenes`);
          if(s.durationSeconds<900) throw new Error(`V59 unexpectedly short: ${s.durationSeconds}s; expand academically instead of relaxing the gate`);
          if(s.durationSeconds>1500) throw new Error(`V59 unexpectedly long: ${s.durationSeconds}s`);
          NODE

      - name: Production QA post
        run: node shared/qa/validate-video.mjs v59-dimensions post

      - id: plan
        working-directory: v59-dimensions
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Pack prepared V59
        run: tar --exclude='v59-dimensions/node_modules' -czf v57-prepared.tar.gz v59-dimensions

      - uses: actions/upload-artifact@v4
        with:
          name: v57-prepared
          retention-days: 1
          if-no-files-found: error
          path: v57-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v57-prepared
          path: .
      - run: tar -xzf v57-prepared.tar.gz
      - name: Install V59 dependencies
        working-directory: v59-dimensions
        run: npm install
      - name: Render segment
        working-directory: v59-dimensions
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V59Dimensions "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v57-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v59-dimensions/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v57-prepared
          path: .
      - run: tar -xzf v57-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v57-segment-*
          path: v59-dimensions/parts
          merge-multiple: true

      - name: Generate BGM
        working-directory: v59-dimensions
        run: node scripts/generate-bgm.mjs

      - name: Concatenate segments
        working-directory: v59-dimensions
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4

      - name: Mix narration and BGM
        working-directory: v59-dimensions
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.042[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v59-dimensions-final.mp4

      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v59-dimensions v59-dimensions/out/v59-dimensions-final.mp4 v59-dimensions/out/v59-dimensions-contact-sheet.jpg

      - name: Verify QA scene count
        run: |
          node - <<'NODE'
          const s=require('./v59-dimensions/src/sync-timing.json');
          if((s.beats||[]).length<115) throw new Error(`QA scene count too low: ${(s.beats||[]).length}`);
          console.log(`QA sheet sourced from ${(s.beats||[]).length} measured scenes`);
          NODE

      - name: Create V59 scene table
        working-directory: v59-dimensions
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=require('./src/script-data.json'); const d=require('./src/scene-data.json'); const t=require('./src/sync-timing.json');
          let out='# V59 Scene Table\n\n| Scene | Time | Phase | Shot | Background | Narration |\n|---|---:|---|---|---|---|\n';
          for(let i=0;i<s.beats.length;i++){
            const b=s.beats[i],m=d[i],z=(t.beats||[])[i]||{};
            const st=Number(z.start||0).toFixed(1),en=Number(z.end||0).toFixed(1);
            out+=`| ${b.id} | ${st}-${en}s | ${m.phase} | ${m.shotKind||''} | ${m.bgGroup} | ${b.narration.replace(/\|/g,'／').replace(/\n/g,' ')} |\n`;
          }
          fs.writeFileSync('out/v59-dimensions-scene-table.md',out);
          NODE

      - name: Publish GitHub Release
        working-directory: v59-dimensions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v59-dimensions-${GITHUB_RUN_ID}.mp4"
          cp out/v59-dimensions-final.mp4 "out/${VIDEO_NAME}"
          TAG="v59-dimensions-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v59-dimensions-contact-sheet.jpg out/v59-dimensions-scene-table.md public/audio/pronunciation-report.json qa/preproduction-summary.json preproduction-plan.json SOURCES.md V59_IMPLEMENTATION.md src/script-data.json src/scene-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V59 Dimensions Production ${GITHUB_RUN_ID}" \
            --notes "3次元と4次元と5次元の違いを人に説明する動画【幾何学×相対性理論×高次元物理学】。駅・フラットランド・立方体とテッセラクトの投影・列車と時空図・GPS衛星・カルツァ＝クラインのコンパクト化を、台本の意味に合わせたオリジナルのRemotionアニメーションで映像化。VOICEVOX実測同期・字幕・BGM・全シーンQA。"
