name: V35 Villain Attraction Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v35-villain-attraction-production.yml'
      - 'v35-villain-attraction/**'
      - 'shared/remotion-templates/v35-villain.tsx'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v35-villain-attraction
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V35 dependencies to shared templates
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Production QA pre
        working-directory: .
        run: node shared/qa/validate-video.mjs v35-villain-attraction pre
      - name: Pronunciation regression tests
        working-directory: .
        run: node shared/voice/test-pronunciation.mjs
      - run: npm run check
      - name: Validate V35 visual coverage
        run: |
          node - <<'NODE'
          const s=require('./src/script-data.json');
          if(s.beats.length!==48) throw new Error(`Expected 48 beats, got ${s.beats.length}`);
          const supported=new Set([
            'cinema_dark','villain_entrance','lean_forward','hate_admire_split','thesis_question','morbid_gallery','curiosity_pull','immoral_file',
            'forest_threat','threat_radar','attention_capture','study_230k','real_bad_self','forbidden_self_mirror','fiction_safety_zone','shadow_self',
            'office_yes','social_brakes','civilization_cage','desire_orbit','villain_executes','proxy_release','trait_decompose','metric_axes',
            'package_separate','dominance_prestige_ladder','prestige_scene','dominance_room','power_signal','moral_dual_meter','dark_triad_orbit',
            'narcissism_first_impression','extract_confidence','roundtable_world','real_costs','safe_danger_glass','rollercoaster','benign_masochism',
            'danger_distilled','moral_disengage','court_pause','hero_rules','villain_freedom','prediction_uncertainty','question_mark_villain','two_scoreboards','ending_shadow'
          ]);
          const used=[...new Set(s.beats.map(b=>b.visual))];
          const missing=used.filter(v=>!supported.has(v));
          if(missing.length) throw new Error(`Unsupported visual keys: ${missing.join(', ')}`);
          if(used.length<40) throw new Error(`Need >=40 distinct visual keys, got ${used.length}`);
          const ids=s.beats.map(b=>b.id);
          if(new Set(ids).size!==ids.length) throw new Error('Duplicate beat ids');
          console.log(`V35 architecture: ${s.beats.length} beats / ${used.length} visual keys / 5 new reusable templates / no generic fallback`);
          NODE
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - run: node scripts/generate-voicevox.mjs
      - name: Production QA post
        working-directory: .
        run: node shared/qa/validate-video.mjs v35-villain-attraction post
      - id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v35-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v35-villain-attraction/src/sync-timing.json
            v35-villain-attraction/public/audio/narration.m4a
            v35-villain-attraction/public/audio/pronunciation-report.json
            v35-villain-attraction/qa/preproduction-summary.json
            v35-villain-attraction/qa/preproduction-summary.md

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v35-villain-attraction
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V35 dependencies to shared templates
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - uses: actions/download-artifact@v4
        with:
          name: v35-prepared
          path: v35-villain-attraction
      - name: Render segment
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V35VillainAttraction "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v35-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v35-villain-attraction/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v35-villain-attraction
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v35-prepared
          path: v35-villain-attraction
      - uses: actions/download-artifact@v4
        with:
          pattern: v35-segment-*
          path: v35-villain-attraction/parts
          merge-multiple: true
      - run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.05[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v35-villain-attraction-final.mp4
      - name: Create QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v35-villain-attraction-final.mp4 -vf "fps=1/18,scale=240:135,tile=8x8" -frames:v 1 -q:v 2 out/v35-villain-attraction-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v35-villain-attraction-${GITHUB_RUN_ID}.mp4"
          cp out/v35-villain-attraction-final.mp4 "out/${VIDEO_NAME}"
          TAG="v35-villain-attraction-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v35-villain-attraction-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V35 Villain Attraction Production ${GITHUB_RUN_ID}" \
            --notes "Full production: なぜ我々は悪役を憎み、悪役に憧れるのか？【道徳心理学×進化心理学】. 48 measured narration beats, 40+ distinct visual keys, 5 newly registered reusable Remotion templates, many cinematic one-off scenes, shared pronunciation regression tests, 青山龍星 VOICEVOX, synchronized subtitles, restrained dark BGM, segmented parallel rendering and QA contact sheet."
