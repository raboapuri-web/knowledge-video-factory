name: V57 Spiritual Belief Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v57-spiritual-belief-production.yml'
      - 'shared/bootstrap/v57-spiritual-belief.mjs'
      - 'shared/v57/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V57 production
        run: node shared/bootstrap/v57-spiritual-belief.mjs

      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V57 dependencies
        working-directory: v57-spiritual-belief
        run: npm install

      - name: Expose dependencies to shared tools
        working-directory: v57-spiritual-belief
        run: ln -sfn "$PWD/node_modules" ../node_modules

      - name: Build preproduction plan
        working-directory: v57-spiritual-belief
        run: node scripts/build-preproduction.mjs

      - name: Story, fine-scene and static-background guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v57-spiritual-belief/src/script-data.json');
          const d=require('./v57-spiritual-belief/src/scene-data.json');
          const n=s.beats.length;
          if(!s.beats[0].narration.startsWith('午前一時四十七分。暗いワンルームで、三十二歳の女性がベッドの上に座っている。')) throw new Error('Wrong canonical V57 script loaded');
          if(n<120||n>150) throw new Error(`Unexpected V57 scene count ${n}`);
          if(d.length!==n) throw new Error(`Scene data mismatch ${d.length}/${n}`);
          if(new Set(s.beats.map(b=>b.visual)).size!==n) throw new Error('Every V57 scene must have a distinct visual key');
          const groups=[...new Set(d.map(x=>x.bgGroup))];
          if(groups.length<65) throw new Error(`Need at least 65 background groups, got ${groups.length}`);
          const seen=new Set(); let prev=''; const counts={};
          for(const x of d){
            counts[x.bgGroup]=(counts[x.bgGroup]||0)+1;
            if(x.bgGroup!==prev&&seen.has(x.bgGroup)) throw new Error(`Background reused non-consecutively: ${x.bgGroup}`);
            seen.add(x.bgGroup); prev=x.bgGroup;
          }
          for(const [g,c] of Object.entries(counts)) if(c>2) throw new Error(`Background ${g} used ${c} scenes; max 2`);
          const required=['opening_room','feed_signs','rational_day','definition','trobriand_lagoon','trobriand_ocean','malinowski','control_lab','pattern_noise','roulette_order','compensatory_control','story_reframe','teleology','meaning_vs_cause','skinner_pigeon','bracelet','causal_illusion','forer','universal_reading','pseudo_profound','incomprehension_depth','repetition','unfalsifiable','prophecy_case','ritual_loss','ritual_motion','community','intelligence_nuance','evolution_false_positive','algorithm_signs','angel_numbers','selective_memory','secular_order','order_core','choice_uncertainty','thesis','stars_final','final_message'];
          const phases=new Set(d.map(x=>x.phase));
          for(const p of required) if(!phases.has(p)) throw new Error(`Missing semantic phase ${p}`);
          const code=fs.readFileSync('./shared/v57/scenes.tsx','utf8');
          for(const p of required) if(!code.includes(`case '${p}'`)) throw new Error(`Renderer missing phase ${p}`);
          if(code.includes('useCurrentFrame')) throw new Error('Scene renderer backgrounds must not use global frame motion');
          console.log(`V57 architecture: ${n} scenes / ${phases.size} phases / ${groups.length} background groups / sequential-only max2`);
          NODE

      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v57-spiritual-belief pre

      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs

      - name: TypeScript check
        working-directory: v57-spiritual-belief
        run: npm run check

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Generate measured narration
        working-directory: v57-spiritual-belief
        run: node scripts/generate-voicevox.mjs

      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v57-spiritual-belief/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} scenes`);
          if(s.durationSeconds<900) throw new Error(`V57 unexpectedly short: ${s.durationSeconds}s; expand academically instead of relaxing the gate`);
          if(s.durationSeconds>1500) throw new Error(`V57 unexpectedly long: ${s.durationSeconds}s`);
          NODE

      - name: Production QA post
        run: node shared/qa/validate-video.mjs v57-spiritual-belief post

      - id: plan
        working-directory: v57-spiritual-belief
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Pack prepared V57
        run: tar --exclude='v57-spiritual-belief/node_modules' -czf v57-prepared.tar.gz v57-spiritual-belief

      - uses: actions/upload-artifact@v4
        with:
          name: v57-prepared
          retention-days: 1
          if-no-files-found: error
          path: v57-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v57-prepared
          path: .
      - run: tar -xzf v57-prepared.tar.gz
      - name: Install V57 dependencies
        working-directory: v57-spiritual-belief
        run: npm install
      - name: Render segment
        working-directory: v57-spiritual-belief
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V57SpiritualBelief "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v57-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v57-spiritual-belief/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v57-prepared
          path: .
      - run: tar -xzf v57-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v57-segment-*
          path: v57-spiritual-belief/parts
          merge-multiple: true

      - name: Generate BGM
        working-directory: v57-spiritual-belief
        run: node scripts/generate-bgm.mjs

      - name: Concatenate segments
        working-directory: v57-spiritual-belief
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4

      - name: Mix narration and BGM
        working-directory: v57-spiritual-belief
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.042[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v57-spiritual-belief-final.mp4

      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v57-spiritual-belief v57-spiritual-belief/out/v57-spiritual-belief-final.mp4 v57-spiritual-belief/out/v57-spiritual-belief-contact-sheet.jpg

      - name: Verify QA scene count
        run: |
          node - <<'NODE'
          const s=require('./v57-spiritual-belief/src/sync-timing.json');
          if((s.beats||[]).length<120) throw new Error(`QA scene count too low: ${(s.beats||[]).length}`);
          console.log(`QA sheet sourced from ${(s.beats||[]).length} measured scenes`);
          NODE

      - name: Create V57 scene table
        working-directory: v57-spiritual-belief
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=require('./src/script-data.json'); const d=require('./src/scene-data.json'); const t=require('./src/sync-timing.json');
          let out='# V57 Scene Table\n\n| Scene | Time | Phase | Shot | Background | Narration |\n|---|---:|---|---|---|---|\n';
          for(let i=0;i<s.beats.length;i++){
            const b=s.beats[i],m=d[i],z=(t.beats||[])[i]||{};
            const st=Number(z.start||0).toFixed(1),en=Number(z.end||0).toFixed(1);
            out+=`| ${b.id} | ${st}-${en}s | ${m.phase} | ${m.shotKind||''} | ${m.bgGroup} | ${b.narration.replace(/\|/g,'／').replace(/\n/g,' ')} |\n`;
          }
          fs.writeFileSync('out/v57-spiritual-belief-scene-table.md',out);
          NODE

      - name: Publish GitHub Release
        working-directory: v57-spiritual-belief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v57-spiritual-belief-${GITHUB_RUN_ID}.mp4"
          cp out/v57-spiritual-belief-final.mp4 "out/${VIDEO_NAME}"
          TAG="v57-spiritual-belief-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v57-spiritual-belief-contact-sheet.jpg out/v57-spiritual-belief-scene-table.md public/audio/pronunciation-report.json qa/preproduction-summary.json preproduction-plan.json SOURCES.md V57_IMPLEMENTATION.md src/script-data.json src/scene-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V57 Spiritual Belief Production ${GITHUB_RUN_ID}" \
            --notes "Production render of なぜ人は『理解できないもの』を信じたがるのか？―なぜ人はスピるのか【認知科学×不確実性×宗教心理学】. Fine-scene original Remotion animation with sequential-only background groups, scene-specific historical/cognitive metaphors, measured 青山龍星 VOICEVOX timing, synchronized subtitles, restrained ambient BGM, segmented rendering, and scene-complete QA."
