name: V51 Short Men Evolution Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v51-short-men-production.yml'
      - 'shared/bootstrap/v51-short-men.mjs'
      - 'shared/v51/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4

      - name: Materialize V51 production
        run: node shared/bootstrap/v51-short-men.mjs

      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V51 dependencies
        working-directory: v51-short-men
        run: npm install

      - name: Expose dependencies to shared tools
        working-directory: v51-short-men
        run: ln -sfn "$PWD/node_modules" ../node_modules

      - name: Build preproduction plan
        working-directory: v51-short-men
        run: node scripts/build-preproduction.mjs

      - name: Story and visual uniqueness guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v51-short-men/src/script-data.json');
          const d=require('./v51-short-men/src/scene-data.json');
          const n=s.beats.length;
          if(!s.beats[0].narration.startsWith('金曜日の午後十一時。')) throw new Error('Wrong canonical V51 script loaded');
          if(n<60||n>95) throw new Error(`Unexpected V51 scene count ${n}`);
          if(d.length!==n) throw new Error(`Scene data mismatch ${d.length}/${n}`);
          if(new Set(s.beats.map(b=>b.visual)).size!==n) throw new Error('Every V51 scene must have a distinct visual key');
          if(new Set(d.map(x=>`${x.phase}:${x.variant}`)).size!==n) throw new Error('Phase/variant pairs must be unique');
          const phases=new Set(d.map(x=>x.phase));
          const required=['app_market','darwin','selection_context','polygenic','galton','relative_choice','mate_multivariate','selection_math','rainforest','tradeoff','dutch_history','environment','market_constraint','artificial_selection','real_selection','station','synthesis','final'];
          for(const p of required) if(!phases.has(p)) throw new Error(`Missing semantic phase ${p}`);
          const code=fs.readFileSync('./shared/v51/scenes.tsx','utf8');
          for(const p of required) if(!code.includes(`phase==='${p}'`)&&!['final'].includes(p)) throw new Error(`Renderer missing phase ${p}`);
          if(!code.includes("return <Backdrop n={n} p={p} label='進化はランキングではない'")) throw new Error('Final renderer fallback is missing');
          console.log(`V51 architecture: ${n} scenes / ${phases.size} phases / ${new Set(s.beats.map(b=>b.visual)).size} unique visual keys`);
          NODE

      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v51-short-men pre

      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs

      - name: TypeScript check
        working-directory: v51-short-men
        run: npm run check

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1

      - name: Generate measured narration
        working-directory: v51-short-men
        run: node scripts/generate-voicevox.mjs

      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v51-short-men/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} scenes`);
          if(s.durationSeconds<900) throw new Error(`V51 is unexpectedly short: ${s.durationSeconds}s; expand academically instead of relaxing the gate`);
          if(s.durationSeconds>1350) throw new Error(`V51 is unexpectedly long: ${s.durationSeconds}s`);
          NODE

      - name: Production QA post
        run: node shared/qa/validate-video.mjs v51-short-men post

      - id: plan
        working-directory: v51-short-men
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Pack prepared V51
        run: tar --exclude='v51-short-men/node_modules' -czf v51-prepared.tar.gz v51-short-men

      - uses: actions/upload-artifact@v4
        with:
          name: v51-prepared
          retention-days: 1
          if-no-files-found: error
          path: v51-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v51-prepared
          path: .
      - run: tar -xzf v51-prepared.tar.gz
      - name: Install V51 dependencies
        working-directory: v51-short-men
        run: npm install
      - name: Render segment
        working-directory: v51-short-men
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V51ShortMen "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v51-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v51-short-men/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v51-prepared
          path: .
      - run: tar -xzf v51-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v51-segment-*
          path: v51-short-men/parts
          merge-multiple: true

      - name: Generate BGM
        working-directory: v51-short-men
        run: node scripts/generate-bgm.mjs

      - name: Concatenate segments
        working-directory: v51-short-men
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4

      - name: Mix narration and BGM
        working-directory: v51-short-men
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.043[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v51-short-men-final.mp4

      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v51-short-men v51-short-men/out/v51-short-men-final.mp4 v51-short-men/out/v51-short-men-contact-sheet.jpg

      - name: Create V51 scene table
        working-directory: v51-short-men
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=require('./src/script-data.json'); const d=require('./src/scene-data.json'); const t=require('./src/sync-timing.json');
          let out='# V51 Scene Table\n\n| Scene | Time | Phase | Shot | Visual | Narration |\n|---|---:|---|---|---|---|\n';
          for(let i=0;i<s.beats.length;i++){const b=s.beats[i],m=d[i],z=(t.beats||[])[i]||{};const st=Number(z.start||0).toFixed(1),en=Number(z.end||0).toFixed(1);out+=`| ${b.id} | ${st}-${en}s | ${m.phase} | ${m.shotKind||''} | ${m.visual} | ${b.narration.replace(/\|/g,'／').replace(/\n/g,' ')} |\n`;}
          fs.writeFileSync('out/v51-short-men-scene-table.md',out);
          NODE

      - name: Publish GitHub Release
        working-directory: v51-short-men
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v51-short-men-${GITHUB_RUN_ID}.mp4"
          cp out/v51-short-men-final.mp4 "out/${VIDEO_NAME}"
          TAG="v51-short-men-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v51-short-men-contact-sheet.jpg out/v51-short-men-scene-table.md public/audio/pronunciation-report.json qa/preproduction-summary.json IMPLEMENTATION_PLAN.md SOURCES.md src/script-data.json src/scene-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V51 Short Men Evolution Production ${GITHUB_RUN_ID}" \
            --notes "Production render of なぜ低身長男子は淘汰されないのか？【性選択×量的遺伝学×進化のトレードオフ】. Every narration beat has a unique visual key and scene-specific moving background. The video distinguishes stated height preferences from realized pairing and reproductive success, treats height as a polygenic/environmentally influenced continuous trait, and explains natural selection as gradual frequency change rather than one-generation deletion."
