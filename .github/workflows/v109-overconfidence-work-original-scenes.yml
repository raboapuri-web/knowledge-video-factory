name: V109 Overconfidence Work Original Scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shared/bootstrap/v109-overconfidence-work-original-scenes.mjs'
      - 'shared/v109/**'
permissions: {contents: write}
concurrency:
  group: v109-production
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v109-overconfidence-work-original-scenes.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v109-overconfidence-work-original-scenes
        run: npm install
      - working-directory: v109-overconfidence-work-original-scenes
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v109-overconfidence-work-original-scenes
        run: node scripts/build-preproduction.mjs
      - name: Verify original actions and contiguous background policy
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./v109-overconfidence-work-original-scenes/src/scene-data.json');
          if(d.length<170)throw Error('V109 needs fine scene segmentation, got '+d.length);
          for(const k of ['action','actionId','sceneKey','visual'])if(new Set(d.map(x=>x[k])).size!==d.length)throw Error('V109 reused '+k);
          const seen=new Set();
          for(let i=0;i<d.length;i++){
            const b=d[i],prior=d[i-1];
            if(!b.narration||!b.primary||!b.verb||!b.environment||!b.family)throw Error('V109 incomplete beat '+b.id);
            if(seen.has(b.environment)&&(!prior||prior.environment!==b.environment))throw Error('V109 noncontiguous background reuse '+b.environment);
            if(prior&&prior.environment===b.environment&&prior.primary===b.primary&&prior.verb===b.verb)throw Error('V109 static background with unchanged foreground '+b.id);
            seen.add(b.environment);
          }
          const engine=fs.readFileSync('shared/v109/office-engine.tsx','utf8');
          const art=fs.readFileSync('shared/v109/office-art.tsx','utf8');
          const bg=fs.readFileSync('shared/v109/backgrounds.tsx','utf8');
          if(!engine.includes("V109 unsupported physical verb")||!art.includes("V109 unsupported object")||!bg.includes("V109 unsupported background family"))throw Error('V109 generic fallback detected');
          console.log('V109 QA PASS scenes='+d.length+' backgroundGroups='+seen.size);
          NODE
      - working-directory: v109-overconfidence-work-original-scenes
        run: npm run check
      - name: Fast structural visual-diversity QA
        working-directory: v109-overconfidence-work-original-scenes
        run: |
          node - <<'NODE'
          const d=require('./src/scene-data.json');
          const families=new Set(d.map(x=>x.family));
          const primaries=new Set(d.map(x=>x.primary));
          const signatures=d.map(x=>[x.family,x.primary,x.verb,x.shotKind].join('|'));
          if(families.size < 16) throw Error('V109 visual family diversity too low: '+families.size);
          if(primaries.size < 20) throw Error('V109 semantic subject diversity too low: '+primaries.size);
          for(let i=1;i<d.length;i++){
            if(signatures[i]===signatures[i-1]) throw Error('V109 adjacent visual signature duplicate '+d[i].id);
          }
          for(let i=0;i+12<=d.length;i+=12){
            const w=d.slice(i,i+12);
            if(new Set(w.map(x=>x.family)).size<4) throw Error('V109 12-scene window lacks family diversity at '+i);
            if(new Set(w.map(x=>x.primary)).size<3) throw Error('V109 12-scene window lacks semantic diversity at '+i);
            if(new Set(w.map(x=>x.verb)).size<3) throw Error('V109 12-scene window lacks motion diversity at '+i);
          }
          // Ignore the final partial window here; adjacent-signature QA above still covers it.
          console.log('V109 fast diversity QA PASS families='+families.size+' primaries='+primaries.size+' scenes='+d.length);
          NODE
      - name: One-pass semantic smoke render
        working-directory: v109-overconfidence-work-original-scenes
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V109SmokePreview out/v109-smoke.mp4 --codec=h264 --crf=30 --concurrency=4 --log=error
          test -s out/v109-smoke.mp4
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done
          exit 1
      - working-directory: v109-overconfidence-work-original-scenes
        run: node scripts/generate-voicevox.mjs
      - working-directory: v109-overconfidence-work-original-scenes
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v109-overconfidence-work-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v109-overconfidence-work-original-scenes/node_modules' --exclude='v109-overconfidence-work-original-scenes/.voice-tmp' --exclude='v109-overconfidence-work-original-scenes/out/preview' -czf v109-prepared.tar.gz v109-overconfidence-work-original-scenes
      - uses: actions/upload-artifact@v4
        with: {name: v109-prepared, path: v109-prepared.tar.gz, retention-days: 1}

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v109-prepared}
      - run: tar -xzf v109-prepared.tar.gz
      - working-directory: v109-overconfidence-work-original-scenes
        run: npm install
      - working-directory: v109-overconfidence-work-original-scenes
        run: mkdir -p out && npx remotion render src/index.tsx V109OverconfidenceWorkOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=4 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: 'v109-segment-${{ matrix.id }}'
          path: 'v109-overconfidence-work-original-scenes/out/segment-${{ matrix.id }}.mp4'
          retention-days: 1

  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v109-prepared}
      - run: tar -xzf v109-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v109-segment-*
          path: v109-overconfidence-work-original-scenes/parts
          merge-multiple: true
      - working-directory: v109-overconfidence-work-original-scenes
        run: node scripts/generate-bgm.mjs
      - working-directory: v109-overconfidence-work-original-scenes
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v109-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v109-final.mp4 | head -1 | tr -cd '0-9')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v109-final.mp4 | head -1 | tr -cd '0-9')
          F=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 out/v109-final.mp4 | head -1 | tr -d '\r')
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v109-final.mp4 | tr -d '\r')
          A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 out/v109-final.mp4 | wc -l)
          test "$W" = '1920' && test "$H" = '1080' && test "$F" = '30/1' && test "$A" -ge 1
          awk "BEGIN{exit !($D >= 1050)}"
          mkdir -p qa
          node -e 'const fs=require("fs");fs.writeFileSync("qa/final-validation.json",JSON.stringify({videoId:"V109-overconfidence-work-original-scenes",durationSeconds:Number(process.argv[1]),fps:30,audioStreams:Number(process.argv[2]),minimumSeconds:1050,passed:true},null,2))' "$D" "$A"
      - run: node shared/qa/generate-scene-contact-sheet.mjs v109-overconfidence-work-original-scenes v109-overconfidence-work-original-scenes/out/v109-final.mp4 v109-overconfidence-work-original-scenes/out/v109-contact-sheet.jpg
      - working-directory: v109-overconfidence-work-original-scenes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v109-overconfidence-work-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v109-overconfidence-work-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v109-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v109-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json qa/final-validation.json SOURCES.md V109_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V109 Overconfidence Work Original Scenes ${GITHUB_RUN_ID}" --notes "V109: long-form film on overconfidence, metacognition and organizational status; fine narration-linked cuts, contiguous-only static background reuse, narration-specific foreground actions, template office rigs/backgrounds, VOICEVOX/subtitles/BGM and full contact-sheet QA."
