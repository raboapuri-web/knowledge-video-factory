name: V105 Psychological Maturity Original Prologue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v105-psychological-maturity.yml'
      - 'shared/v105/**'
      - 'shared/bootstrap/v105-psychological-maturity.mjs'
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize complete manually authored V105 scenes
        run: node shared/bootstrap/v105-psychological-maturity.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v105-psychological-maturity
        run: npm install
      - working-directory: v105-psychological-maturity
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v105-psychological-maturity
        run: node scripts/build-preproduction.mjs
      - name: Validate 24 individually choreographed scenes and exclude generic fallback
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const dir='v105-psychological-maturity/src/';
          const d=require('./'+dir+'scene-data.json'),s=require('./'+dir+'script-data.json');
          if(d.length!==24||s.beats.length!==24)throw Error('Expected 24 prologue scenes');
          for(const k of ['actionId','family','sceneKey','bgGroup','environment','verb'])
            if(new Set(d.map(b=>b[k])).size!==24)throw Error('Repeated V105 '+k);
          const e=fs.readFileSync('shared/v105/immaturity-scenes.tsx','utf8');
          for(let i=1;i<=24;i++)if(!e.includes('case '+i+':'))throw Error('Missing authored animation '+i);
          if(!e.includes("default:throw Error('V105 original renderer missing"))throw Error('Generic renderer fallback');
          for(let i=0;i<d.length;i++){
            if(!d[i].action||!d[i].primary||!d[i].narration)throw Error('Unassigned original scene '+d[i].id);
            if(i&&d[i-1].family===d[i].family)throw Error('Adjacent similar cut '+d[i].id);
            const w=d.slice(Math.max(0,i-5),i+1);
            if(w.length===6&&new Set(w.map(x=>x.family)).size<5)throw Error('Six-cut similarity '+d[i].id);
          }
          console.log('PASS: 24 narration-specific original actions, settings and visual families');
          NODE
      - working-directory: v105-psychological-maturity
        run: npm run check
      - name: Draw 24 storyboard stills before voice generation
        working-directory: v105-psychological-maturity
        run: |
          mkdir -p out/preview
          for I in $(seq 0 23); do
            FRAME=$(( I * (24 * 20 - 1) / 23 ))
            npx remotion still src/index.tsx V105ScenePreview "out/preview/scene-${I}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 24
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v105-psychological-maturity
        run: node scripts/generate-voicevox.mjs
      - name: Reject long or visually repetitive scenes using measured speech
        working-directory: v105-psychological-maturity
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v105-psychological-maturity
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v105-psychological-maturity/node_modules' -czf v104-prepared.tar.gz v105-psychological-maturity
      - uses: actions/upload-artifact@v4
        with: {name: v104-prepared, path: v104-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v104-prepared}
      - run: tar -xzf v104-prepared.tar.gz
      - working-directory: v105-psychological-maturity
        run: npm install
      - working-directory: v105-psychological-maturity
        run: mkdir -p out && npx remotion render src/index.tsx V105Prologue "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v104-segment-${{ matrix.id }}', path: 'v105-psychological-maturity/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with: {name: v104-prepared}
      - run: tar -xzf v104-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v104-segment-*', path: v105-psychological-maturity/parts, merge-multiple: true}
      - working-directory: v105-psychological-maturity
        run: node scripts/generate-bgm.mjs
      - name: Concat three segments, mux sound and verify finished file
        working-directory: v105-psychological-maturity
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          test "$(wc -l < out/concat.txt)" -eq 3
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v105-prologue-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v105-prologue-final.mp4 | head -1 | tr -cd '0-9')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v105-prologue-final.mp4 | head -1 | tr -cd '0-9')
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v105-prologue-final.mp4 | tr -d '\r')
          A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 out/v105-prologue-final.mp4 | wc -l)
          echo "verified video ${W}x${H} duration=${D} audio-streams=${A}"
          test "$W" = 1920
          test "$H" = 1080
          test "$A" -ge 1
          awk "BEGIN{exit !($D > 60)}"
      - run: node shared/qa/generate-scene-contact-sheet.mjs v105-psychological-maturity v105-psychological-maturity/out/v105-prologue-final.mp4 v105-psychological-maturity/out/v105-contact-sheet.jpg
      - name: Publish prologue-only V105 after verified output
        working-directory: v105-psychological-maturity
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v105-psychological-maturity-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v105-psychological-maturity-${GITHUB_RUN_ID}.mp4"
          cp out/v105-prologue-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v105-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V105_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V105 Psychological Maturity Original Prologue ${GITHUB_RUN_ID}" --notes "V105 PROLOGUE ONLY with 24 authored physical actions, measured narration/subtitle sync, no effects."
