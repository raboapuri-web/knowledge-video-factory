name: Kangaeru Yoru v7 FULL plan offline preflight
on:
  push:
    branches: [kangaeru-yoru-v7-design-20261106]
    paths:
      - 'standalone_kangaeru_v7/full_plan.py'
      - 'standalone_kangaeru_v7/tests/test_full_plan.py'
      - '.github/workflows/kangaeru-v7-full-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies; no secret provided
        run: python -m pip install --quiet Pillow requests
      - name: Compile all production planners
        run: python -m py_compile standalone_kangaeru_v7/planner.py standalone_kangaeru_v7/full_plan.py standalone_kangaeru_v7/icons.py
      - name: Run 71-scene source and schema safeguards
        run: python -m unittest discover -s standalone_kangaeru_v7/tests -p 'test_full_plan.py' -v
