name: V122 Recover Chapter7 and Finalize
on:
  push:
    branches: [v122-hibernation-life-production]
    paths:
      - '.github/workflows/v122-recover-ch7-finalize.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: v122-ch7-recovery
  cancel-in-progress: true
env:
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v122/.puppeteer

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Download prepared renderer from source run
        uses: actions/download-artifact@v4
        with:
          name: v122-motion-base
          repository: raboapuri-web/knowledge-video-factory
          run-id: 38117399605
          github-token: ${{ github.token }}
      - name: Unpack prepared renderer
        run: tar -xzf v122-motion-base.tar.gz
      - name: Download measured chapter7 voice from source run
        uses: actions/download-artifact@v4
        with:
          name: v122-voice-chapter7
          repository: raboapuri-web/knowledge-video-factory
          run-id: 38117399605
          github-token: ${{ github.token }}
      - name: Merge chapter7 timing and verify build
        working-directory: shared/v122
        run: |
          tar -xzf ../../v122-voice-chapter7.tar.gz -C ../..
          python3 scripts/merge_timing.py chapter7
          python3 scripts/qa.py
          npm run build
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
      - name: Smoke and full-render chapter7
        working-directory: shared/v122
        run: |
          node scripts/render.mjs chapter7 --smoke
          python3 scripts/check_smoke.py output/v122-chapter7-smoke.mp4
          rm -f output/v122-chapter7-smoke.mp4
          chmod +x ../motion-canvas-standard/render-with-retry.sh
          MAX_ATTEMPTS=2 ../motion-canvas-standard/render-with-retry.sh 40m node scripts/render.mjs chapter7
          test -s output/v122-chapter7.mp4

      - name: Download finished chapter artifacts from source run
        uses: actions/download-artifact@v4
        with:
          pattern: v122-render-*
          path: renders
          merge-multiple: true
          repository: raboapuri-web/knowledge-video-factory
          run-id: 38117399605
          github-token: ${{ github.token }}
      - name: Restore eight completed chapters
        run: |
          shopt -s nullglob
          for f in renders/v122-render-*.tar.gz; do tar -xzf "$f"; done
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 epilogue; do test -s "shared/v122/output/v122-$c.mp4"; done
          test -s shared/v122/output/v122-chapter7.mp4
      - name: Final concat, BGM and QA
        working-directory: shared/v122
        run: |
          set -euo pipefail
          mkdir -p output qa
          : > output/concat.txt
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 chapter7 epilogue; do printf "file '%s'\n" "$(realpath "output/v122-$c.mp4")" >> output/concat.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i output/concat.txt -c copy output/v122-voice-master.mp4
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/v122-voice-master.mp4)
          node scripts/generate-bgm.mjs "$D"
          ffmpeg -y -loglevel error -i output/v122-voice-master.mp4 -i output/bgm.m4a             -filter_complex '[0:a]volume=1[vo];[1:a]volume=.035[bg];[vo][bg]amix=inputs=2:duration=first[a]'             -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart output/v122-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 output/v122-final.mp4 | head -1)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 output/v122-final.mp4 | head -1)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 output/v122-final.mp4 | head -1)
          AUD=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 output/v122-final.mp4 | wc -l)
          SIZE=$(stat -c%s output/v122-final.mp4)
          test "$W" = 1920 && test "$H" = 1080 && test "$FPS" = '30/1' && test "$AUD" -ge 1 && test "$SIZE" -gt 5000000
          awk "BEGIN {exit !($D>=600)}"
          printf '{"videoId":"V122","scenes":45,"visualStatesPerScene":8,"approxVisualBeats":360,"renderUnits":9,"resolution":"1920x1080","fps":30,"durationSeconds":%s,"audioTracks":%s,"bytes":%s,"passed":true,"recovery":"chapter7-runner"}\n' "$D" "$AUD" "$SIZE" > qa/final-validation.json
          set +e
          ffmpeg -hide_banner -i output/v122-final.mp4 -vf 'blackdetect=d=2:pix_th=0.02,freezedetect=n=-55dB:d=6' -an -f null - 2> qa/visual-anomaly-scan.txt
          set -e
          INTERVAL=$(awk "BEGIN{print $D/25}")
          ffmpeg -y -loglevel error -i output/v122-final.mp4 -vf "fps=1/$INTERVAL,scale=384:-1,tile=5x5:padding=6:margin=8" -frames:v 1 output/v122-contact-sheet.jpg
      - name: Publish recovered V122
        working-directory: shared/v122
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v122-hibernation-life-recovered-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v122-hibernation-life-${GITHUB_RUN_ID}.mp4"
          cp output/v122-final.mp4 "output/$NAME"
          gh release create "$TAG"             "output/$NAME" output/v122-contact-sheet.jpg qa/final-validation.json qa/visual-anomaly-scan.txt SOURCES.md README.md             output/v122-prologue.mp4 output/v122-chapter1.mp4 output/v122-chapter2.mp4 output/v122-chapter3.mp4             output/v122-chapter4.mp4 output/v122-chapter5.mp4 output/v122-chapter6.mp4 output/v122-chapter7.mp4 output/v122-epilogue.mp4             --repo "$GITHUB_REPOSITORY"             --title "V122 なぜ「何もしない時期」が人生には必要なのか？"             --notes 'Recovered chapter7 on a fresh runner; reused eight successful source-run chapter renders. 45 meaning scenes / 360 semantic visual states / measured VOICEVOX / smoke subtitle QA / final ffmpeg QA.'
