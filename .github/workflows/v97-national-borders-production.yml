name: V97 National Borders Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v97-national-borders-production.yml','shared/bootstrap/v97-national-borders.mjs','shared/v97/**']
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v97-national-borders.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v97-national-borders
        run: npm install
      - working-directory: v97-national-borders
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v97-national-borders
        run: node scripts/build-preproduction.mjs
      - name: Fine scene and static-background guard
        run: |
          node - <<'NODE'
          const s=require('./v97-national-borders/src/script-data.json'),d=require('./v97-national-borders/src/scene-data.json');const n=s.beats.length;if(n<270||n>380)throw Error(`scene count ${n}`);if(d.length!==n)throw Error('scene mismatch');if(new Set(s.beats.map(x=>x.visual)).size!==n)throw Error('visual key reuse');if(new Set(d.map(x=>x.bgGroup)).size!==n)throw Error('background reuse detected');const phases=new Set(d.map(x=>x.phase));if(phases.size!==28)throw Error(`expected 28 phases, got ${phases.size}`);if(n<270)throw Error('too few backgrounds');const src=require('fs').readFileSync('./shared/v97/scenes.tsx','utf8');if(!src.includes('const baseWorld=')||!src.includes('const fg=')||!src.includes('export const SceneVisual'))throw Error('Missing V97 animation engine');if(src.includes('useCurrentFrame'))throw Error('Scene engine must not animate background layer by frame');console.log(`${n} micro-scenes / ${n} unique backgrounds / ${phases.size} bespoke worlds`);
          NODE
      - working-directory: v97-national-borders
        run: npm run check
      - name: Preview critical original shots
        working-directory: v97-national-borders
        run: |
          mkdir -p out/preview
          for FRAME in 0 650 1300 1950 2600 3250 3900 4550 5200 5850; do
            npx remotion still src/index.tsx V97ScenePreview "out/preview/scene-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 10
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v97-national-borders
        run: node scripts/generate-voicevox.mjs
      - name: Enforce background duration under 30 seconds
        working-directory: v97-national-borders
        run: node scripts/check-background-duration.mjs
      - id: plan
        working-directory: v97-national-borders
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v97-national-borders/node_modules' -czf v97-prepared.tar.gz v97-national-borders
      - uses: actions/upload-artifact@v4
        with: {name: v97-prepared, path: v97-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v97-prepared}
      - run: tar -xzf v97-prepared.tar.gz
      - working-directory: v97-national-borders
        run: npm install
      - working-directory: v97-national-borders
        run: mkdir -p out && npx remotion render src/index.tsx V97NationalBorders "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v97-segment-${{ matrix.id }}', path: 'v97-national-borders/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v97-prepared}
      - run: tar -xzf v97-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v97-segment-*', path: v97-national-borders/parts, merge-multiple: true}
      - working-directory: v97-national-borders
        run: node scripts/generate-bgm.mjs
      - working-directory: v97-national-borders
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v97-final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v97-final.mp4 | head -1)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v97-final.mp4 | head -1)" = '1080'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v97-final.mp4 | cut -d. -f1)" -gt 650
      - run: node shared/qa/generate-scene-contact-sheet.mjs v97-national-borders v97-national-borders/out/v97-final.mp4 v97-national-borders/out/v97-contact-sheet.jpg
      - working-directory: v97-national-borders
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v97-national-borders-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v97-national-borders-${GITHUB_RUN_ID}.mp4"
          cp out/v97-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v97-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V97_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V97 National Borders Production ${GITHUB_RUN_ID}" --notes "Original national-borders documentary: 28 historical and institutional worlds, one unique background for every narration micro-scene, measured hard guard below 30 seconds per background, frequent object/background changes, neutral sourced treatment, VOICEVOX, subtitles and BGM."
