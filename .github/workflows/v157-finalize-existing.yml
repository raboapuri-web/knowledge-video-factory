name: V157 Brine Pool / finalize existing eight chapters

on:
  workflow_dispatch:
  push:
    branches:
      - v157-brine-pool-board-20261115
    paths:
      - ".github/workflows/v157-finalize-existing.yml"

permissions:
  contents: write
  actions: read

jobs:
  final:
    name: Assemble PCM master, endcard, decode QA and release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow requests
      - name: Prepare static FFmpeg and Japanese fonts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            npm install --prefix "$RUNNER_TEMP/v157-media" --no-audit --no-fund ffmpeg-static @ffprobe-installer/ffprobe
            mkdir -p "$RUNNER_TEMP/v157-bin"
            ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v157-media/node_modules/ffmpeg-static')")" "$RUNNER_TEMP/v157-bin/ffmpeg"
            ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v157-media/node_modules/@ffprobe-installer/ffprobe').path")" "$RUNNER_TEMP/v157-bin/ffprobe"
            echo "$RUNNER_TEMP/v157-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/v157-bin:$PATH"
          fi
          if ! command -v fc-match >/dev/null || ! fc-match "Noto Serif CJK JP" | grep -iq Noto; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk fontconfig
          fi
          ffmpeg -version | head -1
      - name: Download eight finished chapter video/WAV artifacts, no re-render
        uses: actions/download-artifact@v4
        with:
          run-id: 43721998017
          github-token: ${{ github.token }}
          pattern: v157-chapter-*
          path: shared/v157/artifact-download
          merge-multiple: false
      - name: Validate eight chapter artifacts
        shell: bash
        run: |
          set -euo pipefail
          for chapter in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 epilogue; do
            mkdir -p "shared/v157/output/$chapter"
            cp "shared/v157/artifact-download/v157-chapter-$chapter/"* "shared/v157/output/$chapter/"
            test -s "shared/v157/output/$chapter/chapter.mp4"
            test -s "shared/v157/output/$chapter/chapter.wav"
            test -s "shared/v157/output/$chapter/timing.json"
          done
          echo "8 FINISHED CHAPTERS RESTORED"
      - name: Assemble once-encoded AAC and verify complete 48kHz PCM timeline
        run: python -u shared/v157/finalize/finalize_existing.py
      - name: Print verified checksums and chapter start times
        shell: bash
        run: |
          cat shared/v157/output/final/qa.json
          sha256sum shared/v157/output/final/V157_brine_pool_master_1080p30.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 shared/v157/output/final/V157_brine_pool_master_1080p30.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: V157-final-master-and-QA
          path: |
            shared/v157/output/final/V157_brine_pool_master_1080p30.mp4
            shared/v157/output/final/qa.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish release MP4 and QA manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v157-brine-pool-${{ github.run_id }}"
          FILE="shared/v157/output/final/V157_brine_pool_master_1080p30.mp4"
          QA="shared/v157/output/final/qa.json"
          gh release create "$TAG" --target "${{ github.sha }}" \
            --title "V157 海底には「湖」がある？！ブラインプール" \
            --notes "V157 full 162-scene 1920×1080 / 30fps H.264 and VOICEVOX 青山龍星 (speaker 13, 1.10x). Eight verbatim chapter title cards; 20-second end screen; 48kHz PCM master aligned to every 30fps frame; AAC encoded once in final mux. Audio stream fully decoded for validation; final-voice transcription review remains separate." \
            "$FILE" "$QA"
