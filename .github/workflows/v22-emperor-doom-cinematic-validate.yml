name: V22 Cinematic Fast Validate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v22-emperor-doom-cinematic-validate.yml'
      - 'v22-emperor-doom-cinematic/src/**'
jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v22-emperor-doom-cinematic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cp ../v15-chiikawa/package.json package.json
          cp ../v15-chiikawa/tsconfig.json tsconfig.json
          npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate 37-scene long-form timeline
        run: |
          python3 - <<'PY'
          import re
          s=open('src/scenes-cinematic.tsx',encoding='utf-8').read()
          assert len(re.findall(r"\{id:'s\d+'",s))==37
          assert 'p*3' not in s
          print('37 cinematic scenes / no micro-cut splitter')
          PY
