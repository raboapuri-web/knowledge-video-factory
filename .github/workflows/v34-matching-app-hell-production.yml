name: V34 Matching App Hell Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v34-matching-app-hell-production.yml'
      - 'v34-matching-app-hell/**'
      - 'shared/remotion-templates/v34-dating.tsx'
      - 'shared/production-rules/visual-template-registry.json'
      - 'shared/production-rules/voice-pronunciation.json'
      - 'shared/voice/**'
      - 'shared/qa/validate-preproduction.mjs'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v34-matching-app-hell
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V34 dependencies to shared templates
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Validate approved preproduction plan
        working-directory: .
        run: node shared/qa/validate-preproduction.mjs v34-matching-app-hell render
      - name: Pronunciation regression tests
        working-directory: .
        run: node shared/voice/test-pronunciation.mjs
      - run: npm run check
      - name: Validate V34 visual coverage
        run: |
          node - <<'NODE'
          const s=require('./src/script-data.json');
          if(s.beats.length!==48) throw new Error(`Expected 48 beats, got ${s.beats.length}`);
          const supported=new Set([
            'night_phone','swipe_three','human_amazon','strength_compare','winner_trap','five_vs_hundred','max_expectation','benchmark_shift',
            'old_world','city_pool','highlight_reel','endless_corridor','option_fan','possibility_vault','overload_experiment','endless_buffet',
            'mate_dimensions','mutual_market','preference_sliders','likes_raise_value','goalpost','ambition_25','upward_arrows','popularity_orbit',
            'escalator_exit','swipe_new_candidate','real_possible','idealized_unknown','thousand_pool','algorithm_exception','criteria_orbit','iso_ranking',
            'compulsive_swipe','regret_tree','stop_button','option_bundle','relationship_growth','explore_vs_build','compounding_bond','profile_compression',
            'invisible_value','app_two_faces','world_50','choice_apps','red_queen','doom_cycle','two_hells','ending_black'
          ]);
          const used=[...new Set(s.beats.map(b=>b.visual))];
          const missing=used.filter(v=>!supported.has(v));
          if(missing.length) throw new Error(`Unsupported visual keys: ${missing.join(', ')}`);
          if(used.length<40) throw new Error(`Need >=40 distinct visual keys, got ${used.length}`);
          const ids=s.beats.map(b=>b.id);
          if(new Set(ids).size!==ids.length) throw new Error('Duplicate beat ids');
          console.log(`V34 architecture: ${s.beats.length} beats / ${used.length} visual keys / 5 new reusable templates / no fallback expected`);
          NODE
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - run: node scripts/generate-voicevox.mjs
      - id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v34-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v34-matching-app-hell/src/sync-timing.json
            v34-matching-app-hell/public/audio/narration.m4a
            v34-matching-app-hell/public/audio/pronunciation-report.json
            v34-matching-app-hell/qa/preproduction-summary.json
            v34-matching-app-hell/qa/preproduction-summary.md

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v34-matching-app-hell
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V34 dependencies to shared templates
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - uses: actions/download-artifact@v4
        with:
          name: v34-prepared
          path: v34-matching-app-hell
      - name: Render segment
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V34MatchingAppHell "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v34-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v34-matching-app-hell/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v34-matching-app-hell
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v34-prepared
          path: v34-matching-app-hell
      - uses: actions/download-artifact@v4
        with:
          pattern: v34-segment-*
          path: v34-matching-app-hell/parts
          merge-multiple: true
      - run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.052[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v34-matching-app-hell-final.mp4
      - name: Create QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v34-matching-app-hell-final.mp4 -vf "fps=1/18,scale=240:135,tile=8x8" -frames:v 1 -q:v 2 out/v34-matching-app-hell-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v34-matching-app-hell-${GITHUB_RUN_ID}.mp4"
          cp out/v34-matching-app-hell-final.mp4 "out/${VIDEO_NAME}"
          TAG="v34-matching-app-hell-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v34-matching-app-hell-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V34 Matching App Hell Production ${GITHUB_RUN_ID}" \
            --notes "Full production: なぜマッチングアプリは『モテる人』の恋愛も地獄にするのか【統計学×進化心理学】. 48 measured narration beats, 40+ distinct visual keys, 5 newly registered reusable Remotion templates, many one-off cinematic scenes, shared pronunciation dictionary with regression tests, 青山龍星 VOICEVOX, synchronized subtitles, restrained dark BGM, segmented parallel rendering and QA contact sheet."
