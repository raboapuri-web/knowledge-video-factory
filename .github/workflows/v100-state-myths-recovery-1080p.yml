name: V100 State Myths Recovery 1080p

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v100-state-myths-recovery-1080p.yml'

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download successful V100 prepared artifact
        uses: actions/download-artifact@v4
        with:
          name: v100-prepared
          run-id: 36326855445
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: tar -xzf v100-prepared.tar.gz
      - name: Patch only corrected 1080p composition
        run: cp shared/v100/index.tsx v100-state-myths-original-scenes/src/index.tsx
      - name: Validate corrected composition
        working-directory: v100-state-myths-original-scenes
        run: |
          npm install
          npm run check
          grep -q "width={1920} height={1080}" src/index.tsx
          node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v100-state-myths-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v100-state-myths-original-scenes/node_modules' -czf v100-recovery-prepared.tar.gz v100-state-myths-original-scenes
      - uses: actions/upload-artifact@v4
        with:
          name: v100-recovery-prepared
          path: v100-recovery-prepared.tar.gz
          retention-days: 1

  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/download-artifact@v4
        with:
          name: v100-recovery-prepared
      - run: tar -xzf v100-recovery-prepared.tar.gz
      - name: Install and render corrected 1080p segment
        working-directory: v100-state-myths-original-scenes
        run: |
          npm install
          mkdir -p out
          npx remotion render src/index.tsx V100StateMythsOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v100-recovery-segment-${{ matrix.id }}
          path: v100-state-myths-original-scenes/out/segment-${{ matrix.id }}.mp4
          retention-days: 1

  finalize:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v100-recovery-prepared
      - run: tar -xzf v100-recovery-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v100-recovery-segment-*
          path: v100-state-myths-original-scenes/parts
          merge-multiple: true
      - name: Join, mux audio and verify
        working-directory: v100-state-myths-original-scenes
        run: |
          node scripts/generate-bgm.mjs
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v100-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 out/v100-final.mp4 | head -1)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 out/v100-final.mp4 | head -1)
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/v100-final.mp4)
          echo "final: ${W}x${H} duration=${D}"
          test "$W" = "1920"
          test "$H" = "1080"
          awk "BEGIN{exit !($D > 650)}"
      - run: node shared/qa/generate-scene-contact-sheet.mjs v100-state-myths-original-scenes v100-state-myths-original-scenes/out/v100-final.mp4 v100-state-myths-original-scenes/out/v100-contact-sheet.jpg
      - name: Publish recovery release
        working-directory: v100-state-myths-original-scenes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v100-state-myths-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v100-state-myths-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v100-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v100-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V100_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V100 State Myths Original Scenes ${GITHUB_RUN_ID}" --notes "Recovered final 1920x1080 render using the already-approved V99-method narration, voice timing and 195 original scenes. 29 explicit phases, 18 visual rhythm families, no generic fallback, max measured scene 14.96s."
