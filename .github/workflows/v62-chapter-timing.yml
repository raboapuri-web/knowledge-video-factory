name: V62 Chapter Timing QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v62-chapter-timing.yml']
permissions: {actions: read, contents: read}
jobs:
  chapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v62-prepared
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35507748109
      - run: tar -xzf v62-prepared.tar.gz
      - name: Exact chapter timing from measured narration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('v62-conspiracy-income/src/script-data.json'));
          const s=JSON.parse(fs.readFileSync('v62-conspiracy-income/src/sync-timing.json'));
          console.log('MEASURED_DURATION',s.durationSeconds,'SCENES',d.beats.length,'SYNC',s.beats.length);
          if(s.beats.length!==d.beats.length)throw new Error('sync mismatch');
          let prev='';
          for(let i=0;i<d.beats.length;i++){
            const b=d.beats[i],t=s.beats[i];
            if(b.phase!==prev){console.log('CHAPTER',b.phase,Math.floor(t.start/60)+':'+String(Math.floor(t.start%60)).padStart(2,'0'),t.start,b.narration.slice(0,30));prev=b.phase;}
          }
          NODE
