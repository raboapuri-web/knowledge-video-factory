name: V38 Spider-Man Responsibility Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-spiderman-responsibility-production.yml'
      - 'v38-spiderman-responsibility/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v38-spiderman-responsibility
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V38 dependencies to shared tools
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Apply V38 renderer syntax patch
        run: node scripts/fix-renderer.mjs
      - name: V38 story and architecture guard
        run: |
          node - <<'NODE'
          const s=require('./src/script-data.json');
          if(s.beats.length!==56) throw new Error(`Expected 56 beats, got ${s.beats.length}`);
          const used=[...new Set(s.beats.map(b=>b.visual))];
          if(used.length!==56) throw new Error(`Expected 56 distinct visual keys, got ${used.length}`);
          if(new Set(s.beats.map(b=>b.id)).size!==56) throw new Error('Duplicate beat ids');
          const all=s.beats.map(b=>b.narration).join('\n');
          for(const phrase of ['善は、報われなくても善であり得る','ベン叔父さん','グウェン','ワン・モア・デイ','ティム']) if(!all.includes(phrase)) throw new Error(`Missing required narrative anchor: ${phrase}`);
          console.log(`V38 architecture: ${s.beats.length} beats / ${used.length} unique visual keys`);
          NODE
      - name: Production QA pre
        working-directory: .
        run: node shared/qa/validate-video.mjs v38-spiderman-responsibility pre
      - name: Pronunciation regression tests
        working-directory: .
        run: node shared/voice/test-pronunciation.mjs
      - run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - run: node scripts/generate-voicevox.mjs
      - name: Production QA post
        working-directory: .
        run: node shared/qa/validate-video.mjs v38-spiderman-responsibility post
      - id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: v38-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v38-spiderman-responsibility/src/script-data.json
            v38-spiderman-responsibility/src/sync-timing.json
            v38-spiderman-responsibility/public/audio/narration.m4a
            v38-spiderman-responsibility/public/audio/pronunciation-report.json
            v38-spiderman-responsibility/qa/preproduction-summary.json
            v38-spiderman-responsibility/qa/preproduction-summary.md
            v38-spiderman-responsibility/V38_IMPLEMENTATION.md

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v38-spiderman-responsibility
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Expose V38 dependencies to shared tools
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Apply V38 renderer syntax patch
        run: node scripts/fix-renderer.mjs
      - uses: actions/download-artifact@v4
        with:
          name: v38-prepared
          path: v38-spiderman-responsibility
      - name: Render segment
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V38SpiderResponsibility "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v38-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v38-spiderman-responsibility/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: v38-spiderman-responsibility
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v38-prepared
          path: v38-spiderman-responsibility
      - uses: actions/download-artifact@v4
        with:
          pattern: v38-segment-*
          path: v38-spiderman-responsibility/parts
          merge-multiple: true
      - run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.05[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v38-spiderman-responsibility-final.mp4
      - name: Create scene-complete QA contact sheet
        working-directory: .
        run: node shared/qa/generate-scene-contact-sheet.mjs v38-spiderman-responsibility v38-spiderman-responsibility/out/v38-spiderman-responsibility-final.mp4 v38-spiderman-responsibility/out/v38-spiderman-responsibility-scene-contact-sheet.jpg
      - name: Verify QA sheet source count
        run: |
          node - <<'NODE'
          const s=require('./src/sync-timing.json');
          if((s.beats||[]).length!==56) throw new Error(`QA requires 56 measured scenes, got ${(s.beats||[]).length}`);
          NODE
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v38-spiderman-responsibility-${GITHUB_RUN_ID}.mp4"
          cp out/v38-spiderman-responsibility-final.mp4 "out/${VIDEO_NAME}"
          TAG="v38-spiderman-responsibility-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v38-spiderman-responsibility-scene-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json V38_IMPLEMENTATION.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "V38 Spider-Man Responsibility Production ${GITHUB_RUN_ID}" \
            --notes "56-scene Remotion production. Original vector/typographic visuals, measured 青山龍星 VOICEVOX timing, synchronized subtitles, dark ambient BGM, parallel segmented rendering, and scene-complete QA. Core thesis: 善は、報われなくても善であり得る。"
