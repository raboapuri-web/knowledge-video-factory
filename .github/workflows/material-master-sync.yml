name: Sync Material Master
on:
  push:
    branches: [main]
    paths:
      - 'shared/material-candidates/**'
      - 'scripts/sync-material-master.mjs'
      - '.github/workflows/material-master-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: material-master-sync
  cancel-in-progress: false
jobs:
  append-only-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Append only unregistered new candidates
        env:
          MATERIAL_MASTER_SHEET_ID: ${{ secrets.MATERIAL_MASTER_SHEET_ID }}
          MATERIAL_MASTER_SERVICE_ACCOUNT_JSON: ${{ secrets.MATERIAL_MASTER_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-material-master.mjs
