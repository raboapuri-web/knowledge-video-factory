name: V46 Preserve Approved Chapter1 MP4 in Git
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-store-approved-chapter1.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: v46-preserve-approved-chapter1-mp4
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify Chapter1 approval lock and target absence
        run: |
          set -euo pipefail
          node v46hansyoku/scripts/verify-approved-chapters.mjs
          if test -e v46hansyoku/approved-video/V46_CHAPTER1_APPROVED_20260925.mp4; then
            echo "::error::Approved Chapter1 MP4 already archived; refusing replacement."
            exit 1
          fi
      - name: Download exact user-approved Chapter1 R3 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36137608832
          github-token: ${{ github.token }}
          name: v46hansyoku-chapter1-36-scenes-parallel-review
          path: chapter1-approved-artifact
      - name: Preserve exact MP4 bytes without rendering or transcoding
        run: |
          set -euo pipefail
          original="$(find chapter1-approved-artifact -type f -name "v46-chapter1.mp4" -print -quit)"
          test -s "$original"
          mkdir -p v46hansyoku/approved-video
          cp "$original" v46hansyoku/approved-video/V46_CHAPTER1_APPROVED_20260925.mp4
          sha256sum v46hansyoku/approved-video/V46_CHAPTER1_APPROVED_20260925.mp4
      - name: Commit exact approved Chapter1 MP4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v46hansyoku/approved-video/V46_CHAPTER1_APPROVED_20260925.mp4
          git commit -m "archive(v46): preserve byte-identical user-approved Chapter1 MP4 [skip ci]"
          git push origin HEAD:main
          echo "PRESERVED_CHAPTER1_COMMIT=$(git rev-parse HEAD)"
