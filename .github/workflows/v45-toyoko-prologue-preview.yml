name: V45 Toyoko Prologue Visual Review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v45-toyoko-prologue-preview.yml'
      - 'v45-toyoko/**'
      - 'shared/asset-library/人物テンプレート/hoodie-girl-rig.tsx'
      - 'shared/asset-library/人物テンプレート/hoodie-boy-rig.tsx'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare graphics tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Stage exact approved backgrounds and validate the scene plan
        working-directory: v45-toyoko
        run: |
          node scripts/check-prologue.mjs
          node scripts/stage-assets.mjs
      - name: Install production dependencies and typecheck
        working-directory: v45-toyoko
        run: |
          npm install --no-audit --no-fund
          ln -sfn "$PWD/node_modules" ../node_modules
          npm run check
      - name: Start VOICEVOX for shot-aligned chapter narration
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:50021/version && exit 0
            sleep 2
          done
          exit 1
      - name: Synthesize 18 narration and subtitle timings
        working-directory: v45-toyoko
        run: |
          npm run voice:prologue
          node scripts/check-voiced-review.mjs
          node scripts/build-subtitles.mjs
      - name: Render prologue with VOICEVOX narration and separate subtitles
        working-directory: v45-toyoko
        run: |
          mkdir -p out/shot-review
          npm run preview:prologue
          test -s out/toyoko-prologue-review.mp4
          test "$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out/toyoko-prologue-review.mp4 | wc -l)" -ge 1
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of default=noprint_wrappers=1 out/toyoko-prologue-review.mp4
      - name: Extract exactly one voice-timed midpoint for every storyboard cut
        working-directory: v45-toyoko
        run: |
          node scripts/extract-shot-reviews.mjs
      - name: Save viewable review video and per-cut inspection frames
        uses: actions/upload-artifact@v4
        with:
          name: v45-toyoko-prologue-18cuts-voiced-draft-review
          path: |
            v45-toyoko/out/toyoko-prologue-review.mp4
            v45-toyoko/out/toyoko-prologue-review.srt
            v45-toyoko/public/audio/narration.m4a
            v45-toyoko/out/shot-review/*.png
            v45-toyoko/out/shot-timestamps.tsv
            v45-toyoko/src/script-data.json
            v45-toyoko/src/sync-timing.json
            v45-toyoko/PROLOGUE_REVIEW.md
          if-no-files-found: error
          retention-days: 7
