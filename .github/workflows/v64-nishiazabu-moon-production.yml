name: V64 Nishiazabu Moon Cinematic Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v64-nishiazabu-moon-production.yml'
      - 'shared/bootstrap/v64-nishiazabu-moon.mjs'
      - 'shared/v64/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
      - name: Checkout SVG and character template library
        uses: actions/checkout@v4
        with:
          repository: raboapuri-web/test
          ref: main
          path: template-assets
      - name: Materialize V64 production
        run: node shared/bootstrap/v64-nishiazabu-moon.mjs
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install V64 dependencies
        working-directory: v64-nishiazabu-moon
        run: npm install
      - name: Expose dependencies to shared tools
        working-directory: v64-nishiazabu-moon
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Build preproduction plan
        working-directory: v64-nishiazabu-moon
        run: node scripts/build-preproduction.mjs
      - name: Story-specific visual continuity, asset and typography guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v64-nishiazabu-moon/src/script-data.json');
          const d=require('./v64-nishiazabu-moon/src/scene-data.json');
          const beats=s.beats;
          if(!beats[0].narration.startsWith('西麻布のギャラ飲み帰りだった。')) throw new Error('Wrong script');
          if(beats.length<55||beats.length>165) throw new Error('Unexpected beat count: '+beats.length);
          if(d.length!==beats.length) throw new Error('Scene count mismatch');
          if(new Set(beats.map(x=>x.id)).size!==beats.length) throw new Error('Duplicate beat IDs');
          if(new Set(beats.map(x=>x.visual)).size!==beats.length) throw new Error('Distinct visual keys required');
          const expected=['taxi_open','taxi_message','ebisu_meeting','date_walk','yutenji_room','uncertain_love','old_moon','old_chat','breakup','first_gallery','taxi_return','taxi_moon','taxi_exit','sangen_street','milk'];
          for(const phase of expected) if(!beats.some(x=>x.phase===phase)) throw new Error('Missing scene: '+phase);
          const scenic=require('./v64-nishiazabu-moon/src/scene-data.json');
          for(let i=1;i<scenic.length;i++){
            if(beats[i].location===beats[i-1].location&&scenic[i].location!==scenic[i-1].location) throw new Error('Location continuity lost');
          }
          const script=beats.map(x=>x.narration).join(' ');
          for(const phrase of ['西麻布交差点','既読というシステム','祐天寺','牛乳いる？','悠真','池尻大橋','三軒茶屋','茶沢通り']) if(!script.includes(phrase)) throw new Error('Missing story anchor '+phrase);
          const assets=['BG_v64_taxi_night.svg','BG_v64_gallery_night.svg','BG_v64_yutenji_1k.svg','BG_v64_ebisu_cafe.svg','BG_v64_convenience.svg'];
          for(const a of assets) if(!fs.existsSync('./v64-nishiazabu-moon/public/assets/backgrounds/'+a)) throw new Error('Missing bespoke SVG '+a);
          const index=fs.readFileSync('./v64-nishiazabu-moon/src/index.tsx','utf8');
          const renderer=fs.readFileSync('./v64-nishiazabu-moon/src/scenes.tsx','utf8');
          if(!index.includes('stageProgress')||!index.includes('stageElapsed')||!renderer.includes("case 'taxi'")) throw new Error('Persistent scene animation missing');
          if(/text\s*=\s*['"][^'"]*\\n[^'"]*['"]/.test(renderer)) throw new Error('Visible literal backslash-n detected');
          if(/["']\\n["']/.test(renderer)) throw new Error('Visible literal backslash-n token');
          console.log('V64:',beats.length,'story-specific shots,',expected.length,'phases,',assets.length,'bespoke SVGs, location continuity checked');
          NODE
      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v64-nishiazabu-moon pre
      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs
      - name: TypeScript check
        working-directory: v64-nishiazabu-moon
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        working-directory: v64-nishiazabu-moon
        run: node scripts/generate-voicevox.mjs
      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v64-nishiazabu-moon/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} shots`);
          if(s.durationSeconds<300) throw new Error(`V64 is unexpectedly short: ${s.durationSeconds}s`);
          if(s.durationSeconds>1300) throw new Error(`V64 is unexpectedly long: ${s.durationSeconds}s`);
          NODE
      - name: Production QA post
        run: node shared/qa/validate-video.mjs v64-nishiazabu-moon post
      - id: plan
        working-directory: v64-nishiazabu-moon
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Pack prepared V64
        run: tar --exclude='v64-nishiazabu-moon/node_modules' -czf v64-prepared.tar.gz v64-nishiazabu-moon
      - uses: actions/upload-artifact@v4
        with:
          name: v64-prepared
          retention-days: 1
          if-no-files-found: error
          path: v64-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v64-prepared
          path: .
      - run: tar -xzf v64-prepared.tar.gz
      - name: Install V64 dependencies
        working-directory: v64-nishiazabu-moon
        run: npm install
      - name: Render segment
        working-directory: v64-nishiazabu-moon
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V64NishiazabuMoon "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v64-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v64-nishiazabu-moon/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v64-prepared
          path: .
      - run: tar -xzf v64-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v64-segment-*
          path: v64-nishiazabu-moon/parts
          merge-multiple: true
      - name: Generate BGM
        working-directory: v64-nishiazabu-moon
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        working-directory: v64-nishiazabu-moon
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        working-directory: v64-nishiazabu-moon
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.043[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v64-nishiazabu-moon-final.mp4
      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v64-nishiazabu-moon v64-nishiazabu-moon/out/v64-nishiazabu-moon-final.mp4 v64-nishiazabu-moon/out/v64-nishiazabu-moon-contact-sheet.jpg
      - name: Create shot table
        working-directory: v64-nishiazabu-moon
        run: |
          node - <<'NODE'
          const fs=require('fs'); const s=require('./src/script-data.json'); const d=require('./src/scene-data.json'); const t=require('./src/sync-timing.json');
          let out='# V64 Shot Table\n\n| Shot | Time | Phase | Kind | Narration |\n|---|---:|---|---|---|\n';
          for(let i=0;i<s.beats.length;i++){
            const b=s.beats[i],m=d[i],z=(t.beats||[])[i]||{};
            const st=Number(z.start||0).toFixed(1),en=Number(z.end||0).toFixed(1);
            out+=`| ${b.id} | ${st}-${en}s | ${m.phase} | ${m.shotKind} | ${b.narration.replace(/\|/g,'／').replace(/\n/g,' ')} |\n`;
          }
          fs.writeFileSync('out/v64-nishiazabu-moon-shot-table.md',out);
          NODE
      - name: Publish GitHub Release
        working-directory: v64-nishiazabu-moon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v64-nishiazabu-moon-${GITHUB_RUN_ID}.mp4"
          cp out/v64-nishiazabu-moon-final.mp4 "out/${VIDEO_NAME}"
          TAG="v64-nishiazabu-moon-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v64-nishiazabu-moon-contact-sheet.jpg out/v64-nishiazabu-moon-shot-table.md public/audio/pronunciation-report.json qa/preproduction-summary.json IMPLEMENTATION_PLAN.md src/script-data.json src/scene-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V64 拝啓、高校生の僕へ ${GITHUB_RUN_ID}" \
            --notes "V64 Nishiazabu moon: first-person narrative of a taxi ride from Nishiazabu to Sangenjaya, memories of Yuma in Ebisu, Nakameguro and Yutenji, a painful cafe farewell, and buying milk on Chazawa-dori. V46 measured VOICEVOX narration, custom SVG scenery, continuous-location animated compositions, synchronized subtitles, segmented Remotion render, BGM, shot table and QA contact sheet. No literal backslash-n in video titles or annotations."
