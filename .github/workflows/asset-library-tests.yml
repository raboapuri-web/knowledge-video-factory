name: Asset Library QA
on:
  push:
    paths:
      - 'shared/asset-library/**'
      - 'shared/remotion-templates/office-worker-rig.tsx'
      - 'shared/v69/index.tsx'
      - '.github/workflows/asset-library-tests.yml'
  pull_request:
    paths:
      - 'shared/asset-library/**'
      - '.github/workflows/asset-library-tests.yml'
permissions:
  contents: read
jobs:
  asset-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node shared/asset-library/test-assets.mjs
      - run: node shared/asset-library/register-backgrounds.mjs
      - run: node shared/asset-library/test-register.mjs
      - name: Bootstrap V69 without rendering or voice synthesis
        run: node shared/bootstrap/v69-free-services.mjs
      - name: Prepare selected assets for the actual Remotion episode
        run: node shared/asset-library/prepare.mjs v69-free-services
      - name: Stage an approved background for the composited character preview
        run: node shared/asset-library/人物テンプレート/stage-background.mjs v69-free-services BG_office.png
      - run: node shared/asset-library/人物テンプレート/test-scene.mjs
      - name: Stage room background for hoodie-girl preview
        run: node shared/asset-library/人物テンプレート/stage-background.mjs v69-free-services BG_oneroom.png
      - run: node shared/asset-library/人物テンプレート/test-catalog.mjs
      - name: Typecheck the Remotion integration
        run: |
          cd v69-free-services
          npm install --ignore-scripts --no-audit --no-fund
          cd ..
          ln -sfn "$PWD/v69-free-services/node_modules" node_modules
          cd v69-free-services
          npm run check
