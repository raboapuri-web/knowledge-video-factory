name: Kangaeru Yoru v7 full renderer offline QA
on:
  push:
    branches: [kangaeru-yoru-v7-design-20261106]
    paths:
      - 'standalone_kangaeru_v7/render_full.py'
      - 'standalone_kangaeru_v7/photo_v7.py'
      - 'standalone_kangaeru_v7/tests/test_render_full.py'
      - '.github/workflows/kangaeru-v7-full-render-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install keyless renderer/test packages
        run: python -m pip install --quiet Pillow requests cairosvg
      - name: Compile final renderer, photo filter and brand vectors
        run: python -m py_compile standalone_kangaeru_v7/render_full.py standalone_kangaeru_v7/photo_v7.py standalone_kangaeru_v7/brand.py standalone_kangaeru_v7/icons.py
      - name: Run visual geometry, rights guard and stream spec tests
        run: python -m unittest discover -s standalone_kangaeru_v7/tests -p 'test_render_full.py' -v
