name: V28 30 Minute Sleep Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v28-30min-sleep-production.yml'
      - 'v28-30min-sleep/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v28-30min-sleep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check before narration generation
        run: npm run check
      - name: Validate semantic visual architecture
        run: |
          node - <<'NODE'
          const s=require('./src/script-data.json');
          if(s.beats.length!==68) throw new Error(`Expected 68 beats, got ${s.beats.length}`);
          const unique=new Set(s.beats.map(b=>b.visual));
          if(unique.size<30) throw new Error(`Need >=30 semantic visual scenes, got ${unique.size}`);
          console.log(`V28: ${s.beats.length} narration beats / ${unique.size} semantic cinematic visual scenes`);
          NODE
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then echo 'VOICEVOX ready'; exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        run: node scripts/generate-voicevox.mjs
      - name: Plan render segments
        id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared timing and narration
        uses: actions/upload-artifact@v4
        with:
          name: v28-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v28-30min-sleep/src/sync-timing.json
            v28-30min-sleep/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v28-30min-sleep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Download measured timing
        uses: actions/download-artifact@v4
        with:
          name: v28-prepared
          path: v28-30min-sleep
      - name: Render segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V28ThirtyMinuteSleep "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 \
            --crf=19 \
            --concurrency=2 \
            --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - name: Upload segment ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: v28-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v28-30min-sleep/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: v28-30min-sleep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download narration and timing
        uses: actions/download-artifact@v4
        with:
          name: v28-prepared
          path: v28-30min-sleep
      - name: Download all rendered segments
        uses: actions/download-artifact@v4
        with:
          pattern: v28-segment-*
          path: v28-30min-sleep/parts
          merge-multiple: true
      - name: Generate restrained BGM
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments without re-encoding
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do
            printf "file '%s'\n" "$(realpath "$f")"
          done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error \
            -i out/video-only.mp4 \
            -i public/audio/narration.m4a \
            -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.07[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            out/v28-30min-sleep-final.mp4
      - name: Verify production duration
        run: |
          test -s out/v28-30min-sleep-final.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/v28-30min-sleep-final.mp4
          python3 - <<'PY'
          import subprocess
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','out/v28-30min-sleep-final.mp4']).decode().strip())
          assert 600 <= d <= 2100, f'Unexpected production duration: {d:.2f}s'
          PY
      - name: Create QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v28-30min-sleep-final.mp4 \
            -vf "fps=1/22,scale=240:135,tile=8x8" \
            -frames:v 1 -q:v 2 out/v28-30min-sleep-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v28-30min-sleep-${GITHUB_RUN_ID}.mp4"
          cp out/v28-30min-sleep-final.mp4 "out/${VIDEO_NAME}"
          TAG="v28-30min-sleep-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "out/${VIDEO_NAME}" \
            out/v28-30min-sleep-contact-sheet.jpg \
            --repo "$GITHUB_REPOSITORY" \
            --title "V28 30 Minute Sleep Production ${GITHUB_RUN_ID}" \
            --notes "Full production: 30分睡眠にすると体に起きること. 68 measured narration beats, 34 semantic cinematic scenes; viral short-sleeper debate, chronic sleep restriction performance decline, attention lapses, emotional control, metabolic and inflammatory effects, immune night-shift metaphor, glymphatic research nuance, evolutionary cost of sleep, natural short-sleeper genetics, objective measurement, sleep architecture, animal sleep diversity and the evolutionary question of why sleep was not eliminated. VOICEVOX Aoyama Ryusei Normal; narration + restrained BGM only; no SFX; segmented parallel rendering and QA contact sheet."
