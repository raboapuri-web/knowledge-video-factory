name: Kangaeru Yoru v8 Stage 1 motion and pictogram QA
on:
  push:
    branches: [kangaeru-yoru-v8-motion-20261106]
    paths:
      - 'standalone_kangaeru_v8/**'
      - '.github/workflows/kangaeru-v8-preflight.yml'
permissions:
  contents: read
jobs:
  motion_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free SVG/geometry dependencies
        run: python -m pip install --quiet Pillow requests cairosvg
      - name: Run all 24 motion-selector, pictogram and caption-layout tests
        run: |
          python -m py_compile standalone_kangaeru_v8/*.py
          python -m unittest discover -s standalone_kangaeru_v8/tests -v
      - name: Preserve the complete implemented motion contract
        run: |
          python - <<'PY'
          import json,sys,pathlib
          sys.path.insert(0,'standalone_kangaeru_v8')
          import motion
          p=pathlib.Path('standalone_kangaeru_v8/output/preflight');p.mkdir(parents=True,exist_ok=True)
          data=motion.metadata()
          (p/'motion_catalogue.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf8')
          count=sum(len(v) for v in data.values())
          assert count==24,count
          print(json.dumps({'passed':True,'implemented_templates':count,'by_category':{k:len(v) for k,v in data.items()},'api_calls':0},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kangaeru-yoru-v8-motion-24-templates-QA
          path: standalone_kangaeru_v8/output/preflight/
          if-no-files-found: warn
          retention-days: 14
