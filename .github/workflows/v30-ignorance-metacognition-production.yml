name: V30 Ignorance Metacognition Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v30-ignorance-metacognition-production.yml'
      - 'v30-ignorance-metacognition/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    defaults:
      run:
        working-directory: v30-ignorance-metacognition
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check before narration generation
        run: npm run check
      - name: Validate rich semantic visual architecture
        run: |
          node - <<'NODE'
          const s=require('./src/script-data.json');
          if(s.beats.length!==88) throw new Error(`Expected 88 beats, got ${s.beats.length}`);
          const unique=new Set(s.beats.map(b=>b.visual));
          if(unique.size<40) throw new Error(`Need >=40 semantic visual scenes, got ${unique.size}`);
          console.log(`V30: ${s.beats.length} narration beats / ${unique.size} semantic rich visual scenes`);
          NODE
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then echo 'VOICEVOX ready'; exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        run: node scripts/generate-voicevox.mjs
      - name: Plan render segments
        id: plan
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Upload prepared timing and narration
        uses: actions/upload-artifact@v4
        with:
          name: v30-prepared
          retention-days: 1
          if-no-files-found: error
          path: |
            v30-ignorance-metacognition/src/sync-timing.json
            v30-ignorance-metacognition/public/audio/narration.m4a

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: v30-ignorance-metacognition
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Download measured timing
        uses: actions/download-artifact@v4
        with:
          name: v30-prepared
          path: v30-ignorance-metacognition
      - name: Render segment ${{ matrix.id }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.ts V30IgnoranceMetacognition "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 \
            --crf=18 \
            --concurrency=2 \
            --log=warn
          test -s "out/segment-${{ matrix.id }}.mp4"
      - name: Upload segment ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: v30-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v30-ignorance-metacognition/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v30-ignorance-metacognition
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download narration and timing
        uses: actions/download-artifact@v4
        with:
          name: v30-prepared
          path: v30-ignorance-metacognition
      - name: Download all rendered segments
        uses: actions/download-artifact@v4
        with:
          pattern: v30-segment-*
          path: v30-ignorance-metacognition/parts
          merge-multiple: true
      - name: Generate restrained BGM
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments without re-encoding
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do
            printf "file '%s'\n" "$(realpath "$f")"
          done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        run: |
          ffmpeg -y -loglevel error \
            -i out/video-only.mp4 \
            -i public/audio/narration.m4a \
            -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.065[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            out/v30-ignorance-metacognition-final.mp4
      - name: Verify production duration
        run: |
          test -s out/v30-ignorance-metacognition-final.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/v30-ignorance-metacognition-final.mp4
          python3 - <<'PY'
          import subprocess
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','out/v30-ignorance-metacognition-final.mp4']).decode().strip())
          assert 600 <= d <= 2400, f'Unexpected production duration: {d:.2f}s'
          PY
      - name: Create QA contact sheet
        run: |
          ffmpeg -y -loglevel error -i out/v30-ignorance-metacognition-final.mp4 \
            -vf "fps=1/22,scale=240:135,tile=8x8" \
            -frames:v 1 -q:v 2 out/v30-ignorance-metacognition-contact-sheet.jpg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v30-ignorance-metacognition-${GITHUB_RUN_ID}.mp4"
          cp out/v30-ignorance-metacognition-final.mp4 "out/${VIDEO_NAME}"
          TAG="v30-ignorance-metacognition-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            "out/${VIDEO_NAME}" \
            out/v30-ignorance-metacognition-contact-sheet.jpg \
            --repo "$GITHUB_REPOSITORY" \
            --title "V30 Ignorance Metacognition Production ${GITHUB_RUN_ID}" \
            --notes "Full production: なぜ教養のない人ほど、『知らない』と言えないのか？ 88 measured narration beats and 44 semantic visual scenes. Rich Remotion animation covers the confidence paradox, unknown unknowns, metacognition, Dunning-Kruger calibration, broken error detectors, illusion of explanatory depth, causal complexity, scientific uncertainty, AI/search information access, knowledge boundaries, and the final distinction between naive and educated 'I don't know'. VOICEVOX Aoyama Ryusei Normal; narration-synced subtitles; cinematic camera drift; layered diagrams; dark restrained BGM; segmented parallel rendering and QA contact sheet."
