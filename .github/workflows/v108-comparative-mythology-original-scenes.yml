name: V108 Comparative Mythology Original Scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v108-comparative-mythology-original-scenes.yml','shared/bootstrap/v108-comparative-mythology-original-scenes.mjs','shared/v108/**']
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v108-comparative-mythology-original-scenes.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v108-comparative-mythology-original-scenes
        run: npm install
      - working-directory: v108-comparative-mythology-original-scenes
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v108-comparative-mythology-original-scenes
        run: node scripts/build-preproduction.mjs
      - name: Verify 170 narration-specific actions and unique backgrounds
        run: |
          node - <<'NODE'
          const fs=require('fs'),d=require('./v108-comparative-mythology-original-scenes/src/scene-data.json');
          const expected={prologue:32,ancestor:29,counter:30,travel:30,cognition:26,epilogue:23};
          if(d.length!==170||new Set(d.map(x=>x.environment)).size!==170)throw Error('V108 full original scene inventory missing');
          for(const k of ['action','actionId','environment','sceneKey','visual'])if(new Set(d.map(x=>x[k])).size!==170)throw Error('V108 reused '+k);
          for(const [phase,count] of Object.entries(expected))if(d.filter(x=>x.phase===phase).length!==count)throw Error('V108 incomplete chapter '+phase);
          for(let i=0;i<d.length;i++){const b=d[i],prior=d[i-1];if(!b.narration||!b.action||!b.primary||!b.verb)throw Error('V108 generic unsupported scene '+b.id);if(prior&&prior.family===b.family)throw Error('V108 adjacent similar visual family '+b.id);}
          const engine=fs.readFileSync('shared/v108/myth-engine.tsx','utf8'),art=fs.readFileSync('shared/v108/myth-art.tsx','utf8'),bg=fs.readFileSync('shared/v108/backgrounds.tsx','utf8');
          if(!engine.includes("throw Error('V108 unsupported physical verb")||!art.includes("throw Error('V108 unsupported object")||!bg.includes("throw Error('V108 unsupported background family"))throw Error('V108 generic renderer fallback detected');
          console.log('V108 QA PASS: 170 narration-linked actions / 170 unique environments / 6 complete sections');
          NODE
      - working-directory: v108-comparative-mythology-original-scenes
        run: npm run check
      - name: Draw all 170 scene previews and reject exact duplicates
        working-directory: v108-comparative-mythology-original-scenes
        run: |
          mkdir -p out/preview
          seq 0 169 | xargs -P 3 -I @ bash -c 'I=@; FRAME=$((I*20+12)); npx remotion still src/index.tsx V108ScenePreview "out/preview/scene-$(printf %03d "$I").png" --frame="$FRAME" --log=error'
          test "$(find out/preview -name '*.png' | wc -l)" -eq 170
          DUPES=$(find out/preview -name '*.png' -print0 | xargs -0 sha256sum | cut -d' ' -f1 | sort | uniq -d)
          test -z "$DUPES" || (echo "V108 exact duplicated previews" && exit 1)
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v108-comparative-mythology-original-scenes
        run: node scripts/generate-voicevox.mjs
      - working-directory: v108-comparative-mythology-original-scenes
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v108-comparative-mythology-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v108-comparative-mythology-original-scenes/node_modules' --exclude='v108-comparative-mythology-original-scenes/.voice-tmp' --exclude='v108-comparative-mythology-original-scenes/out/preview' -czf v108-prepared.tar.gz v108-comparative-mythology-original-scenes
      - uses: actions/upload-artifact@v4
        with: {name: v108-prepared, path: v108-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v108-prepared}
      - run: tar -xzf v108-prepared.tar.gz
      - working-directory: v108-comparative-mythology-original-scenes
        run: npm install
      - working-directory: v108-comparative-mythology-original-scenes
        run: mkdir -p out && npx remotion render src/index.tsx V108ComparativeMythologyOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v108-segment-${{ matrix.id }}', path: 'v108-comparative-mythology-original-scenes/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v108-prepared}
      - run: tar -xzf v108-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v108-segment-*', path: v108-comparative-mythology-original-scenes/parts, merge-multiple: true}
      - working-directory: v108-comparative-mythology-original-scenes
        run: node scripts/generate-bgm.mjs
      - working-directory: v108-comparative-mythology-original-scenes
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v108-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v108-final.mp4 | head -1 | tr -cd '0-9')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v108-final.mp4 | head -1 | tr -cd '0-9')
          F=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 out/v108-final.mp4 | head -1 | tr -d '\r')
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v108-final.mp4 | tr -d '\r')
          A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 out/v108-final.mp4 | wc -l)
          test "$W" = '1920' && test "$H" = '1080' && test "$F" = '30/1' && test "$A" -ge 1
          awk "BEGIN{exit !($D >= 720)}"
          mkdir -p qa
          node -e 'const fs=require("fs");fs.writeFileSync("qa/final-validation.json",JSON.stringify({videoId:"V108-comparative-mythology-original-scenes",durationSeconds:Number(process.argv[1]),fps:30,audioStreams:Number(process.argv[2]),minimumSeconds:720,passed:true},null,2))' "$D" "$A"
      - run: node shared/qa/generate-scene-contact-sheet.mjs v108-comparative-mythology-original-scenes v108-comparative-mythology-original-scenes/out/v108-final.mp4 v108-comparative-mythology-original-scenes/out/v108-contact-sheet.jpg
      - working-directory: v108-comparative-mythology-original-scenes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v108-comparative-mythology-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v108-comparative-mythology-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v108-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v108-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json qa/final-validation.json SOURCES.md V108_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V108 Comparative Mythology Original Scenes ${GITHUB_RUN_ID}" --notes "V108: comparative mythology full original film; 170 narration-linked actions, 170 unique environments, bespoke Orochi/Hydra/Kaliya/underworld/linguistics/cognition sequences, four SHA-verified user library backgrounds used once each, synced VOICEVOX/subtitles/BGM, all-scene preview duplicate check and final contact sheet."
