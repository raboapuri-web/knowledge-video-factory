name: V147 Photo Memory Presentation Motion Canvas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v147-photo-memory-slides.yml
      - shared/v147/**

permissions:
  contents: write

concurrency:
  group: v147-photo-memory-${{ github.sha }}
  cancel-in-progress: false

jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v147
    steps:
      - uses: actions/checkout@v4
      - name: Validate narration and slide boundaries
        run: node scripts/compile.mjs
      - name: Check audit
        run: node -e "const a=require('./content/audit.json'); if(a.totalSlides!==62||a.errors.length){console.error(a);process.exit(1)} console.log('PREFLIGHT_OK', a.totalSlides, 'render units /', a.specSlides, 'spec slides')"
      - uses: actions/upload-artifact@v4
        with:
          name: v147-source-audit
          path: shared/v147/content/audit.json
          retention-days: 21

  chapter:
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter: [prologue, chapter1, chapter2, chapter3, epilogue]
    env:
      CHAPTER: ${{ matrix.chapter }}
      VOICEVOX_SPEED: '1.15'
      VOICEVOX_SPEAKER_ID: '13'
      VOICE_PARALLEL: '3'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v147/.puppeteer
    defaults:
      run:
        working-directory: shared/v147
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system packages
        run: timeout 300 sudo apt-get install -y -qq fonts-noto-cjk fontconfig ffmpeg
      - name: Reuse stable Motion Canvas rendering runtime from V124 and chapter renderer from V146
        run: |
          mkdir -p src src/lib scripts
          cp ../v124/package.json .
          cp ../v124/tsconfig.json .
          cp ../v124/vite.config.ts .
          cp ../v124/headless.html .
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts
          cp ../v124/scripts/render.mjs scripts/render.mjs
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          sed -i 's/v124/v147/g; s/!smoke/false/g' scripts/render.mjs
          grep -n "v147" scripts/render.mjs
          cp ../v146/src/lib/chapter.tsx src/lib/chapter.tsx
          sed -i "s/#111317/#111113/g; s/#F2EBDD/#F1EBDD/g; s/#A7353A/#A52A38/g; s/#4F9297/#777A80/g; s/#A9A6A0/#777A80/g" src/lib/chapter.tsx
          sed -i "s/s.id === '48'/false/g" src/lib/chapter.tsx
          grep -n "#111113" src/lib/chapter.tsx | head -3
          if grep -q "s.id === '48'" src/lib/chapter.tsx; then echo "DARK48 STILL PRESENT"; exit 1; fi
          echo "CHAPTER_TSX_READY"
      - name: Compile slides and generate project
        run: |
          node --check scripts/compile.mjs
          node --check scripts/synth.mjs
          node scripts/compile.mjs "$CHAPTER"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start VOICEVOX engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then echo VOICEVOX_UP; exit 0; fi
            sleep 2
          done
          echo "VOICEVOX did not start" >&2
          docker logs $(docker ps -q --filter ancestor=voicevox/voicevox_engine:cpu-latest | head -1) || true
          exit 1
      - name: Synthesize narration
        run: |
          node scripts/synth.mjs "$CHAPTER"
          test -s "media/$CHAPTER/narration.wav"
          test -s "content/measured-$CHAPTER.json"
      - name: Build
        run: npm run build
      - name: Smoke render
        run: |
          node scripts/render.mjs "$CHAPTER" --smoke || echo "SMOKE_RENDER_FAILED"
          ls -la output/ || true
          ls "output/v147-$CHAPTER-smoke/" | head -3 || true
          if [ -d "output/v147-$CHAPTER-smoke" ]; then ffmpeg -y -framerate 60 -pattern_type glob -i "output/v147-$CHAPTER-smoke/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v147-$CHAPTER-smoke.mp4"; fi
          test -s "output/v147-$CHAPTER-smoke.mp4"
      - name: Render chapter video
        run: |
          node scripts/render.mjs "$CHAPTER" || echo "RENDER_FAILED"
          ls -la output/ || true
          if [ -d "output/v147-$CHAPTER" ]; then ffmpeg -y -framerate 60 -pattern_type glob -i "output/v147-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v147-$CHAPTER.mp4"; fi
          test -s "output/v147-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v147-$CHAPTER.mp4"
      - name: Mix narration audio
        run: |
          ffmpeg -y -i "output/v147-$CHAPTER.mp4" -i "media/$CHAPTER/narration.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "output/v147-$CHAPTER-with-audio.mp4"
          mv "output/v147-$CHAPTER-with-audio.mp4" "output/v147-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v147-$CHAPTER.mp4"
      - name: Upload chapter segment
        uses: actions/upload-artifact@v4
        with:
          name: v147-segment-${{ matrix.chapter }}
          path: shared/v147/output/v147-${{ matrix.chapter }}.mp4
          retention-days: 14
          compression-level: 0

  finalize:
    needs: chapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v147
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get install -y -qq ffmpeg
      - name: Download chapter segments
        uses: actions/download-artifact@v4
        with:
          pattern: v147-segment-*
          path: ${{ github.workspace }}/shared/v147/segments
          merge-multiple: true
      - name: Concatenate chapters
        run: |
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 epilogue; do
            echo "file '$GITHUB_WORKSPACE/shared/v147/segments/v147-$c.mp4'" >> output/concat.txt
          done
          cat output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy -movflags +faststart output/v147-voice-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v147-voice-master.mp4
      - name: Mix BGM if available
        run: |
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          BGM_FILE=""
          for cand in "../../common/BGM/Amazon-river-ambience.mp3" "../common/BGM/Amazon-river-ambience.mp3" "common/BGM/Amazon-river-ambience.mp3"; do
            if [ -f "$cand" ]; then BGM_FILE="$cand"; break; fi
          done
          if [ -n "$BGM_FILE" ]; then
            echo "BGM found at $BGM_FILE, mixing at 0.035"
            mkdir -p common/BGM
            cp "$BGM_FILE" common/BGM/Amazon-river-ambience.mp3
            D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v147-voice-master.mp4)
            node scripts/generate-bgm.mjs "$D"
            ffmpeg -y -i output/v147-voice-master.mp4 -i output/bgm.m4a -filter_complex "[0:a]volume=1[voice];[1:a]volume=.035[music];[voice][music]amix=inputs=2:duration=first;[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart output/v147-photo-memory-slides-final.mp4
          else
            echo "BGM not found, finishing without BGM"
            cp output/v147-voice-master.mp4 output/v147-photo-memory-slides-final.mp4
          fi
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 output/v147-photo-memory-slides-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v147-photo-memory-slides-final.mp4
      - name: Contact sheet
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v147-photo-memory-slides-final.mp4)
          I=$(python3 -c "print(max(1.0, float('$D')/24))")
          ffmpeg -y -i output/v147-photo-memory-slides-final.mp4 -vf "fps=1/$I,scale=384:-1,tile=6x4:padding=4:margin=4" -frames:v 1 output/v147-contact-sheet.jpg
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: v147-photo-memory-slides-master
          path: |
            shared/v147/output/v147-photo-memory-slides-final.mp4
            shared/v147/output/v147-contact-sheet.jpg
          retention-days: 21
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v147-photo-memory-slides-${{ github.run_id }}"
          TITLE="V147 考える夜｜なぜ写真を撮るほど、思い出を忘れてしまうことがあるのか 完成動画"
          gh release create "$TAG" --title "$TITLE" --notes "V147 完成動画（1920x1080・30fps）。スライド62枚（レンダリング単位62）。ナレーションはVOICEVOX（青山龍星、速度1.15）で合成。" output/v147-photo-memory-slides-final.mp4 output/v147-contact-sheet.jpg
