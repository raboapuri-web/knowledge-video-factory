name: V46 Luck Talent Production V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-luck-talent-production-v2.yml'
      - 'shared/bootstrap/v46-luck-talent-v2.mjs'
      - 'shared/bootstrap/v46-luck-talent.mjs'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize V46 production
        run: node shared/bootstrap/v46-luck-talent-v2.mjs
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install V46 dependencies
        working-directory: v46-luck-talent
        run: npm install
      - name: Expose V46 dependencies to shared tools
        working-directory: v46-luck-talent
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Build preproduction plan
        working-directory: v46-luck-talent
        run: node scripts/build-preproduction.mjs
      - name: V46 story and visual-diversity guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v46-luck-talent/src/script-data.json');
          if(s.beats.length!==69) throw new Error(`Expected 69 beats, got ${s.beats.length}`);
          const keys=s.beats.map(b=>b.visual);
          if(new Set(keys).size!==69) throw new Error(`Expected 69 distinct visual keys, got ${new Set(keys).size}`);
          if(new Set(s.beats.map(b=>b.id)).size!==69) throw new Error('Duplicate beat ids');
          const all=s.beats.map(b=>b.narration).join('\n');
          for(const phrase of ['ゴルトン','メリトクラシー','Talent Versus Luck','マタイ効果','相対年齢効果','near miss','才能','運']) {
            if(!all.includes(phrase)) throw new Error(`Missing narrative anchor: ${phrase}`);
          }
          const renderer=fs.readFileSync('./v46-luck-talent/src/scenes.tsx','utf8');
          const cases=[...renderer.matchAll(/case\s+(\d+)\s*:/g)].map(m=>Number(m[1]));
          const set=new Set(cases);
          if(set.size!==69) throw new Error(`Renderer requires 69 explicit scene cases, got ${set.size}`);
          for(let i=1;i<=69;i++) if(!set.has(i)) throw new Error(`Missing explicit renderer case ${i}`);
          console.log(`V46 architecture: ${s.beats.length} beats / ${new Set(keys).size} visual keys / ${set.size} render cases`);
          NODE
      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v46-luck-talent pre
      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs
      - name: TypeScript check
        working-directory: v46-luck-talent
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        working-directory: v46-luck-talent
        run: node scripts/generate-voicevox.mjs
      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v46-luck-talent/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s`);
          if(s.durationSeconds<900) throw new Error(`V46 is shorter than 15 minutes: ${s.durationSeconds}s`);
          if(s.durationSeconds>1350) throw new Error(`V46 is longer than 22m30s: ${s.durationSeconds}s`);
          if((s.beats||[]).length!==69) throw new Error(`Expected 69 measured scenes, got ${(s.beats||[]).length}`);
          NODE
      - name: Production QA post
        run: node shared/qa/validate-video.mjs v46-luck-talent post
      - id: plan
        working-directory: v46-luck-talent
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Pack prepared V46
        run: tar --exclude='v46-luck-talent/node_modules' -czf v46-prepared.tar.gz v46-luck-talent
      - uses: actions/upload-artifact@v4
        with:
          name: v46-prepared
          retention-days: 1
          if-no-files-found: error
          path: v46-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v46-prepared
          path: .
      - run: tar -xzf v46-prepared.tar.gz
      - name: Install V46 dependencies
        working-directory: v46-luck-talent
        run: npm install
      - name: Render segment
        working-directory: v46-luck-talent
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V46LuckTalent "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v46-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v46-luck-talent/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v46-prepared
          path: .
      - run: tar -xzf v46-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v46-segment-*
          path: v46-luck-talent/parts
          merge-multiple: true
      - name: Generate BGM
        working-directory: v46-luck-talent
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        working-directory: v46-luck-talent
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        working-directory: v46-luck-talent
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.05[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v46-luck-talent-final.mp4
      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v46-luck-talent v46-luck-talent/out/v46-luck-talent-final.mp4 v46-luck-talent/out/v46-luck-talent-scene-contact-sheet.jpg
      - name: Verify QA sheet source count
        run: |
          node - <<'NODE'
          const s=require('./v46-luck-talent/src/sync-timing.json');
          if((s.beats||[]).length!==69) throw new Error(`QA requires 69 measured scenes, got ${(s.beats||[]).length}`);
          NODE
      - name: Publish GitHub Release
        working-directory: v46-luck-talent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v46-luck-talent-${GITHUB_RUN_ID}.mp4"
          cp out/v46-luck-talent-final.mp4 "out/${VIDEO_NAME}"
          TAG="v46-luck-talent-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v46-luck-talent-scene-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json IMPLEMENTATION_PLAN.md src/script-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V46 Luck Talent Production ${GITHUB_RUN_ID}" \
            --notes "69-scene long-form Remotion production on whether luck or talent matters more for success. It covers grant review, Galton, meritocracy, skewed success distributions, Talent Versus Luck simulations, Merton's Matthew effect, relative-age effects in hockey, elite competition, tennis brackets, NIH near-miss research, survivorship bias, parallel lives, cumulative advantage, and the final talent-times-luck thesis. Every scene has a distinct visual key and explicit renderer case, measured 青山龍星 narration, synchronized subtitles, BGM, segmented rendering, and one QA frame per scene."
