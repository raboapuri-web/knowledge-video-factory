name: V112 Market Value Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v112-market-value-40s.yml'
      - 'shared/bootstrap/v112-market-value-40s.mjs'
      - 'shared/v112/**'

permissions:
  contents: write

concurrency:
  group: v112-market-value-production
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      voice_matrix: '${{ steps.voiceplan.outputs.matrix }}'
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap V112
        run: node shared/bootstrap/v112-market-value-40s.mjs

      - name: Ensure media and Japanese fonts
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-match "Noto Sans CJK JP" | grep -qi "Noto"; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-noto-cjk
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v112-market-value-40s/package-lock.json

      - name: Install Remotion dependencies once for preflight
        working-directory: v112-market-value-40s
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build preproduction package
        working-directory: v112-market-value-40s
        run: node scripts/build-preproduction.mjs

      - name: Structural scene QA
        run: |
          node - <<'NODE'
          const d=require('./v112-market-value-40s/src/scene-data.json');
          if(d.length<185)throw Error('V112 needs fine scene segmentation, got '+d.length);
          for(const k of ['action','actionId','sceneKey','visual']){
            if(new Set(d.map(x=>x[k])).size!==d.length)throw Error('V112 reused '+k);
          }
          const seen=new Set();
          for(let i=0;i<d.length;i++){
            const b=d[i],p=d[i-1];
            if(!b.narration||!b.primary||!b.verb||!b.environment||!b.family||!b.shotKind)throw Error('V112 incomplete beat '+b.id);
            if(seen.has(b.environment)&&(!p||p.environment!==b.environment))throw Error('V112 noncontiguous background reuse '+b.environment);
            if(p&&p.environment===b.environment&&p.primary===b.primary&&p.verb===b.verb)throw Error('V112 static background with unchanged foreground '+b.id);
            if(p&&[b.family,b.primary,b.verb,b.shotKind].join('|')===[p.family,p.primary,p.verb,p.shotKind].join('|'))throw Error('V112 adjacent visual signature duplicate '+b.id);
            seen.add(b.environment);
          }
          const families=new Set(d.map(x=>x.family)),primaries=new Set(d.map(x=>x.primary)),verbs=new Set(d.map(x=>x.verb));
          if(families.size<14||primaries.size<20||verbs.size<12)throw Error('V112 insufficient global visual diversity '+families.size+'/'+primaries.size+'/'+verbs.size);
          console.log('V112 structural QA PASS scenes='+d.length+' groups='+seen.size+' families='+families.size+' primaries='+primaries.size+' verbs='+verbs.size);
          NODE

      - name: TypeScript check
        working-directory: v112-market-value-40s
        run: npm run check

      - id: voiceplan
        name: Plan six parallel narration chunks
        working-directory: v112-market-value-40s
        run: echo "matrix=$(node scripts/plan-voice-parts.mjs)" >> "$GITHUB_OUTPUT"

      - name: Pack visual base
        run: |
          tar --exclude='v112-market-value-40s/node_modules'               --exclude='v112-market-value-40s/.voice-tmp'               --exclude='v112-market-value-40s/out'               -czf v112-base.tar.gz v112-market-value-40s

      - uses: actions/upload-artifact@v4
        with:
          name: v112-base
          path: v112-base.tar.gz
          retention-days: 1

  voice:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: '${{ fromJson(needs.prepare.outputs.voice_matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v112-base}
      - run: tar -xzf v112-base.tar.gz

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done
          exit 1

      - name: Generate narration chunk
        working-directory: v112-market-value-40s
        env:
          START: '${{ matrix.start }}'
          END: '${{ matrix.end }}'
          PART: '${{ matrix.id }}'
        run: node scripts/generate-voice-chunk.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: 'v112-voice-${{ matrix.id }}'
          path: v112-market-value-40s/voice-parts
          retention-days: 1

  smoke:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v112-base}
      - run: tar -xzf v112-base.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v112-market-value-40s/package-lock.json
      - name: Install cached dependencies
        working-directory: v112-market-value-40s
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Semantic smoke render in parallel with narration
        working-directory: v112-market-value-40s
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V112SmokePreview out/v112-smoke.mp4 --codec=h264 --crf=30 --concurrency=4 --log=error
          test -s out/v112-smoke.mp4

  assemble:
    needs: [prepare, voice, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      matrix: '${{ steps.renderplan.outputs.matrix }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v112-base}
      - run: tar -xzf v112-base.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v112-voice-*
          path: v112-market-value-40s/voice-parts
          merge-multiple: true

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: Assemble narration and exact scene sync
        working-directory: v112-market-value-40s
        run: node scripts/assemble-voice.mjs

      - name: Voice and runtime QA
        working-directory: v112-market-value-40s
        run: |
          node scripts/check-scenes.mjs
          node scripts/build-preproduction.mjs

      - id: renderplan
        name: Plan sixteen render segments
        working-directory: v112-market-value-40s
        run: echo "matrix=$(node scripts/plan-segments-fast.mjs)" >> "$GITHUB_OUTPUT"

      - name: Pack prepared production
        run: |
          tar --exclude='v112-market-value-40s/node_modules'               --exclude='v112-market-value-40s/.voice-tmp'               --exclude='v112-market-value-40s/.voice-assemble'               --exclude='v112-market-value-40s/voice-parts'               --exclude='v112-market-value-40s/out'               -czf v112-prepared.tar.gz v112-market-value-40s

      - uses: actions/upload-artifact@v4
        with:
          name: v112-prepared
          path: v112-prepared.tar.gz
          retention-days: 1

  render:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: '${{ fromJson(needs.assemble.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v112-prepared}
      - run: tar -xzf v112-prepared.tar.gz

      - name: Ensure Japanese fonts
        run: |
          if ! fc-match "Noto Sans CJK JP" | grep -qi "Noto"; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v112-market-value-40s/package-lock.json

      - name: Restore cached dependencies
        working-directory: v112-market-value-40s
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Render segment
        working-directory: v112-market-value-40s
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V112MarketValue "out/segment-${{ matrix.id }}.mp4"             --frames=${{ matrix.start }}-${{ matrix.end }}             --codec=h264 --crf=18 --concurrency=4 --log=error

      - uses: actions/upload-artifact@v4
        with:
          name: 'v112-segment-${{ matrix.id }}'
          path: 'v112-market-value-40s/out/segment-${{ matrix.id }}.mp4'
          retention-days: 1

  finalize:
    needs: [assemble, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - uses: actions/setup-node@v4
        with: {node-version: 20}

      - uses: actions/download-artifact@v4
        with: {name: v112-prepared}
      - run: tar -xzf v112-prepared.tar.gz

      - uses: actions/download-artifact@v4
        with:
          pattern: v112-segment-*
          path: v112-market-value-40s/parts
          merge-multiple: true

      - name: Generate BGM, concat and validate
        working-directory: v112-market-value-40s
        run: |
          node scripts/generate-bgm.mjs
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error             -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a             -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]"             -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v112-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v112-final.mp4 | head -1 | tr -cd '0-9')
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v112-final.mp4 | head -1 | tr -cd '0-9')
          F=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 out/v112-final.mp4 | head -1 | tr -d '\r')
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v112-final.mp4 | tr -d '\r')
          A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 out/v112-final.mp4 | wc -l)
          test "$W" = '1920' && test "$H" = '1080' && test "$F" = '30/1' && test "$A" -ge 1
          awk "BEGIN{exit !($D >= 900)}"
          mkdir -p qa
          node -e 'const fs=require("fs");fs.writeFileSync("qa/final-validation.json",JSON.stringify({videoId:"V112-market-value-40s",durationSeconds:Number(process.argv[1]),fps:30,audioStreams:Number(process.argv[2]),minimumSeconds:900,passed:true},null,2))' "$D" "$A"

      - name: Generate contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v112-market-value-40s v112-market-value-40s/out/v112-final.mp4 v112-market-value-40s/out/v112-contact-sheet.jpg

      - name: Publish release
        working-directory: v112-market-value-40s
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v112-market-value-40s-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v112-market-value-40s-${GITHUB_RUN_ID}.mp4"
          cp out/v112-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v112-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json qa/final-validation.json SOURCES.md V112_PRODUCTION_SPEC.md             --repo "$GITHUB_REPOSITORY"             --title "V112 Market Value 40s ${GITHUB_RUN_ID}"             --notes "V112: human capital, seniority wages, external labor-market pricing and reproducibility in the AI era. Fine narration-linked scenes, static contiguous micro-backgrounds, unique semantic actions, smoke render parallelized with six-way VOICEVOX, sixteen-way final render, cached npm dependencies, subtitles/BGM, validation and contact-sheet QA."
