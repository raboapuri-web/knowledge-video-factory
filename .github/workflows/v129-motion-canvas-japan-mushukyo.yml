name: V129 Motion Canvas Japan Mushukyo
on:
  workflow_dispatch:
    inputs:
      only_chapter:
        description: 'all or one chapter'
        required: true
        default: all
        type: choice
        options: [all, prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, chapter7, chapter8, chapter9, chapter10, chapter11, epilogue]
  push:
    branches: [v129-japan-mushukyo-production]
    paths:
      - '.github/workflows/v129-motion-canvas-japan-mushukyo.yml'
      - 'shared/v122/**'
permissions:
  contents: write
concurrency:
  group: v129-japan-mushukyo
  cancel-in-progress: true
env:
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v122/.puppeteer

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Compile scenes and structural QA
        working-directory: shared/v122
        run: |
          python3 scripts/build_data.py
          python3 scripts/qa.py
      - name: Install once and typecheck all eleven projects
        working-directory: shared/v122
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package prepared renderer once
        run: |
          tar --exclude='shared/v122/media' --exclude='shared/v122/output' --exclude='shared/v122/render' --exclude='shared/v122/qa' -czf v129-motion-base.tar.gz shared/v122
      - uses: actions/upload-artifact@v4
        with:
          name: v129-motion-base
          path: v129-motion-base.tar.gz
          retention-days: 3
          compression-level: 0

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: [prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, chapter7, chapter8, chapter9, chapter10, chapter11, epilogue]
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
      - name: Start VOICEVOX
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..100}; do if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi; sleep 2; done
          exit 1
      - name: Generate measured VOICEVOX cues
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        working-directory: shared/v122
        env:
          VOICEVOX_SPEAKER_ID: '13'
          VOICEVOX_SPEED: '1.15'
          VOICEVOX_PARALLEL: '4'
        run: |
          python3 scripts/build_data.py
          python3 scripts/synth_chapter.py "${{ matrix.slug }}"
      - name: Package voice and measured timing
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        run: |
          tar -czf "v129-voice-${{ matrix.slug }}.tar.gz" "shared/v122/media/${{ matrix.slug }}" "shared/v122/content/measured-${{ matrix.slug }}.json" "shared/v122/voice-report-${{ matrix.slug }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        with:
          name: v129-voice-${{ matrix.slug }}
          path: v129-voice-${{ matrix.slug }}.tar.gz
          retention-days: 3
          compression-level: 0

  render:
    needs: [prepare, voice]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: [prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, chapter7, chapter8, chapter9, chapter10, chapter11, epilogue]
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        with: {name: v129-motion-base}
      - name: Unpack prepared renderer
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        run: tar -xzf v129-motion-base.tar.gz
      - uses: actions/download-artifact@v4
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        with: {name: 'v129-voice-${{ matrix.slug }}'}
      - name: Merge measured subtitles and rebuild
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        working-directory: shared/v122
        run: |
          tar -xzf "../../v129-voice-${{ matrix.slug }}.tar.gz" -C ../..
          python3 scripts/merge_timing.py "${{ matrix.slug }}"
          python3 scripts/qa.py
          npm run build
      - name: Ensure FFmpeg
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
      - name: Smoke render and pixel subtitle QA
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        working-directory: shared/v122
        run: |
          node scripts/render.mjs "${{ matrix.slug }}" --smoke
          test -s "output/v129-${{ matrix.slug }}-smoke.mp4"
          python3 scripts/check_smoke.py "output/v129-${{ matrix.slug }}-smoke.mp4"
          rm -f "output/v129-${{ matrix.slug }}-smoke.mp4"
      - name: Render full chapter with retry
        if: ${{ inputs.only_chapter == '' || inputs.only_chapter == 'all' || inputs.only_chapter == matrix.slug }}
        working-directory: shared/v122
        run: |
          chmod +x ../motion-canvas-standard/render-with-retry.sh
          MAX_ATTEMPTS=2 ../motion-canvas-standard/render-with-retry.sh 42m node scripts/render.mjs "${{ matrix.slug }}"
      - name: Package finished chapter
        if: success()
        run: |
          tar -czf "v129-render-${{ matrix.slug }}.tar.gz" "shared/v122/output/v129-${{ matrix.slug }}.mp4" "shared/v122/render-report-${{ matrix.slug }}.json" "shared/v122/voice-report-${{ matrix.slug }}.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v129-render-${{ matrix.slug }}
          path: v129-render-${{ matrix.slug }}.tar.gz
          retention-days: 3
          compression-level: 0

  finalize:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v129-render-*
          path: renders
          merge-multiple: true
      - name: Restore newly rendered chapters
        run: |
          shopt -s nullglob
          files=(renders/v129-render-*.tar.gz)
          test ${#files[@]} -gt 0
          for f in "${files[@]}"; do tar -xzf "$f"; done
      - name: Reuse unchanged chapters from previous V129 release
        if: ${{ inputs.only_chapter != '' && inputs.only_chapter != 'all' }}
        working-directory: shared/v122
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 80 --json tagName,publishedAt --jq '[.[] | select(.tagName|startswith("v129-japan-mushukyo-"))] | sort_by(.publishedAt) | last | .tagName')
          test -n "$TAG"
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 chapter7 chapter8 chapter9 chapter10 chapter11 epilogue; do
            if [ ! -s "output/v129-$c.mp4" ]; then gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "v129-$c.mp4" --dir output; fi
          done
      - name: Ensure FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Concat, BGM and final QA
        working-directory: shared/v122
        run: |
          set -euo pipefail
          mkdir -p output qa
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 chapter7 chapter8 chapter9 chapter10 chapter11 epilogue; do test -s "output/v129-$c.mp4"; done
          : > output/concat.txt
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 chapter7 chapter8 chapter9 chapter10 chapter11 epilogue; do printf "file '%s'\n" "$(realpath "output/v129-$c.mp4")" >> output/concat.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i output/concat.txt -c copy output/v129-voice-master.mp4
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/v129-voice-master.mp4)
          node scripts/generate-bgm.mjs "$D"
          ffmpeg -y -loglevel error -i output/v129-voice-master.mp4 -i output/bgm.m4a -filter_complex '[0:a]volume=1[vo];[1:a]volume=.035[bg];[vo][bg]amix=inputs=2:duration=first[a]' -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart output/v129-final.mp4
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 output/v129-final.mp4 | head -1)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 output/v129-final.mp4 | head -1)
          FPS=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 output/v129-final.mp4 | head -1)
          AUD=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 output/v129-final.mp4 | wc -l)
          SIZE=$(stat -c%s output/v129-final.mp4)
          test "$W" = 1920 && test "$H" = 1080 && test "$FPS" = '30/1' && test "$AUD" -ge 1 && test "$SIZE" -gt 5000000
          awk "BEGIN {exit !($D>=600)}"
          printf '{"videoId":"V129","scenes":79,"visualStatesPerScene":8,"microBeatsPerScene":24,"approxVisualBeats":1896,"renderUnits":11,"resolution":"1920x1080","fps":30,"durationSeconds":%s,"audioTracks":%s,"bytes":%s,"passed":true}\n' "$D" "$AUD" "$SIZE" > qa/final-validation.json
          set +e
          ffmpeg -hide_banner -i output/v129-final.mp4 -vf 'blackdetect=d=2:pix_th=0.02,freezedetect=n=-55dB:d=6' -an -f null - 2> qa/visual-anomaly-scan.txt
          set -e
          INTERVAL=$(awk "BEGIN{print $D/42}")
          ffmpeg -y -loglevel error -i output/v129-final.mp4 -vf "fps=1/$INTERVAL,scale=320:-1,tile=7x6:padding=6:margin=8" -frames:v 1 output/v129-contact-sheet.jpg
      - name: Publish V129 release and reusable chapters
        working-directory: shared/v122
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG="v129-japan-mushukyo-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v129-japan-mushukyo-${GITHUB_RUN_ID}.mp4"
          cp output/v129-final.mp4 "output/$NAME"
          gh release create "$TAG" "output/$NAME" output/v129-contact-sheet.jpg qa/final-validation.json qa/visual-anomaly-scan.txt SOURCES.md README.md output/v129-prologue.mp4 output/v129-chapter1.mp4 output/v129-chapter2.mp4 output/v129-chapter3.mp4 output/v129-chapter4.mp4 output/v129-chapter5.mp4 output/v129-chapter6.mp4 output/v129-chapter7.mp4 output/v129-chapter8.mp4 output/v129-chapter9.mp4 output/v129-epilogue.mp4 --repo "$GITHUB_REPOSITORY" --title "V129 日本は何教なのか？――「無宗教」という日本最大の宗教" --notes '考える夜 / 神道×仏教×宗教社会学×世俗化 / 79 continuous meaning scenes / 24 micro beats each / approx 1896 visual beats / unique motion signatures / 11 render units / measured VOICEVOX / smoke + pixel subtitle QA / final ffmpeg QA'
