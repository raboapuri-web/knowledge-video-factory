# V150 考える夜｜なぜ親友より、たまに会う知人の方が人生を変えるのか？ (58 slides)
# - storyboard: 台本・スライド整合性監査 + audit.json をアーティファクト化
# - chapter: 6章並列(最大3)で VOICEVOX 合成→ Motion Canvas レンダ→音声ミックス
# - finalize: 章 MP4 を連結→ BGM ミックス→コンタクトシート→リリース作成
name: V150 Weak Ties V2 Director's Cut


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v150-weak-ties-slides.yml'
      - 'shared/v150/**'


permissions:
  contents: write


concurrency:
  group: v150-weak-ties-${{ github.sha }}
  cancel-in-progress: false


jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Compile slides and check audit
        run: node scripts/compile.mjs
      - name: Check audit
        run: node -e "const a=require('./content/audit.json'); if(a.totalSlides!==58||a.errors.length){console.error(a);process.exit(1)} console.log('PREFLIGHT_OK', a.totalSlides, 'render units /', a.specSlides, 'spec slides')"
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v150-source-audit
          path: shared/v150/content/audit.json
          retention-days: 21


  chapter:
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chapter: [prologue, chapter1, chapter2, chapter3, chapter4, epilogue]
    env:
      CHAPTER: ${{ matrix.chapter }}
      VOICEVOX_SPEED: '1.10'
      VOICEVOX_SPEAKER_ID: '13'
      VOICE_PARALLEL: '3'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v150/.puppeteer
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system packages
        run: |
          npm install --prefix "$RUNNER_TEMP/v150-media" --no-audit --no-fund @ffmpeg-installer/ffmpeg @ffprobe-installer/ffprobe
          mkdir -p "$RUNNER_TEMP/v150-bin"
          ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v150-media/node_modules/@ffmpeg-installer/ffmpeg').path")" "$RUNNER_TEMP/v150-bin/ffmpeg"
          ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v150-media/node_modules/@ffprobe-installer/ffprobe').path")" "$RUNNER_TEMP/v150-bin/ffprobe"
          "$RUNNER_TEMP/v150-bin/ffmpeg" -version | head -1
          "$RUNNER_TEMP/v150-bin/ffprobe" -version | head -1
          echo "$RUNNER_TEMP/v150-bin" >> "$GITHUB_PATH"
      - name: Setup Motion Canvas with original V150 cinematic renderer
        run: |
          mkdir -p src/scenes src/projects src/lib scripts
          cp ../v124/package.json package.json
          cp ../v124/tsconfig.json tsconfig.json
          cp ../v124/vite.config.ts vite.config.ts
          cp ../v124/headless.html headless.html
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts
          cp ../v124/scripts/render.mjs scripts/render.mjs
          sed -i 's/v124/v150/g; s/!smoke/false/g' scripts/render.mjs
          test -s src/lib/chapter.tsx
          echo "V150 CINEMATIC RENDERER READY"

      - name: Compile slides and generate project
        run: node scripts/compile.mjs "$CHAPTER" # content/slides.json && cp ../v149/content/narration-*.txt content/ && sed -i "s/!== 58/!== 33/" scripts/compile.mjs && node scripts/compile.mjs "$CHAPTER" && node -e "const fs=require('fs');const p='content/slides.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));for(const s of j.slides){}fs.writeFileSync(p,JSON.stringify(j));console.log('CONTROL_V149_DATA',j.slides.length);"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @fontsource/noto-serif-jp@5.2.7
      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then echo "VOICEVOX READY"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version
      - name: Synthesize narration
        run: node scripts/synth.mjs "$CHAPTER" # cat "content/measured-${CHAPTER}.json" | head -c 3000; echo
      - name: Build
        run: npm run build #(require('./node_modules/typescript/package.json').version)"; ls content src/scenes src/projects; cat tsconfig.json; cat "src/scenes/${CHAPTER}.tsx" "src/projects/${CHAPTER}.ts"; npm run build
      - name: Smoke render
        run: |
          timeout 600 npm run render:smoke || true
          ls -la output/ || true
          if [ -d "output/v150-$CHAPTER" ]; then echo "SMOKE PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v150-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -crf 17 -preset medium -profile:v high -pix_fmt yuv420p -movflags +faststart "output/v150-$CHAPTER.mp4"; fi
          ls -la output/ || true
      - name: Render chapter video
        run: |
          timeout 2400 npm run render || true
          ls -la output/ || true
          if [ -d "output/v150-$CHAPTER" ]; then echo "PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v150-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -crf 17 -preset medium -profile:v high -pix_fmt yuv420p -movflags +faststart "output/v150-$CHAPTER.mp4"; fi
          ls -lh "output/v150-$CHAPTER.mp4"
      - name: Mix narration audio
        run: |
          ls -lh media/$CHAPTER/narration.wav "output/v150-$CHAPTER.mp4"
          ffmpeg -y -i "output/v150-$CHAPTER.mp4" -i media/$CHAPTER/narration.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "output/v150-$CHAPTER-with-audio.mp4"
          mv "output/v150-$CHAPTER-with-audio.mp4" "output/v150-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v150-$CHAPTER.mp4"
      - name: Upload chapter segment
        uses: actions/upload-artifact@v4
        with:
          name: v150-segment-${{ matrix.chapter }}
          path: shared/v150/output/v150-${{ matrix.chapter }}.mp4
          retention-days: 14
          compression-level: 0


  finalize:
    needs: chapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          npm install --prefix "$RUNNER_TEMP/v150-media" --no-audit --no-fund @ffmpeg-installer/ffmpeg @ffprobe-installer/ffprobe
          mkdir -p "$RUNNER_TEMP/v150-bin"
          ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v150-media/node_modules/@ffmpeg-installer/ffmpeg').path")" "$RUNNER_TEMP/v150-bin/ffmpeg"
          ln -sf "$(node -p "require(process.env.RUNNER_TEMP+'/v150-media/node_modules/@ffprobe-installer/ffprobe').path")" "$RUNNER_TEMP/v150-bin/ffprobe"
          "$RUNNER_TEMP/v150-bin/ffmpeg" -version | head -1
          "$RUNNER_TEMP/v150-bin/ffprobe" -version | head -1
          echo "$RUNNER_TEMP/v150-bin" >> "$GITHUB_PATH"
      - name: Download chapter segments
        uses: actions/download-artifact@v4
        with:
          pattern: v150-segment-*
          path: ${{ github.workspace }}/shared/v150/segments
          merge-multiple: true
      - name: Concatenate chapters
        run: |
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 chapter4 epilogue; do echo "file '$GITHUB_WORKSPACE/shared/v150/segments/v150-$c.mp4'" >> output/concat.txt; done
          cat output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy -movflags +faststart output/v150-voice-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v150-voice-master.mp4
      - name: Mix BGM if available
        run: |
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          BGM_FILE=""
          for p in ../../common/BGM/Amazon-river-ambience.mp3 ../common/BGM/Amazon-river-ambience.mp3 common/BGM/Amazon-river-ambience.mp3; do if [ -f "$p" ]; then BGM_FILE="$p"; break; fi; done
          if [ -n "$BGM_FILE" ]; then echo "BGM found: $BGM_FILE"; node scripts/generate-bgm.mjs output/v150-voice-master.mp4 output/v150-weak-ties-directorscut-v2-final.mp4 "$BGM_FILE" 0.035; else echo "BGM not found, finishing without BGM"; cp output/v150-voice-master.mp4 output/v150-weak-ties-directorscut-v2-final.mp4; fi
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 output/v150-weak-ties-directorscut-v2-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v150-weak-ties-directorscut-v2-final.mp4
      - name: Strict final media quality audit
        run: |
          FILE="output/v150-weak-ties-directorscut-v2-final.mp4"
          test -s "$FILE"
          python3 - <<'PY'
          import json, subprocess,os,sys
          p="output/v150-weak-ties-directorscut-v2-final.mp4"
          j=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height,r_frame_rate","-of","json",p]))
          tracks=j["streams"]
          video=next((s for s in tracks if s["codec_type"]=="video"),None)
          audio=next((s for s in tracks if s["codec_type"]=="audio"),None)
          duration=float(j["format"]["duration"]);size=int(j["format"]["size"])
          assert video and audio, "Missing video or audio track"
          assert video.get("width")==1920 and video.get("height")==1080, "Unexpected video dimensions"
          assert duration>600, "Suspiciously short film duration"
          assert size>12000000, "Suspiciously small video file"
          print("V2_FINAL_QA_PASS",{"duration":round(duration,2),"bytes":size,"video":video.get("r_frame_rate"),"audio":audio.get("codec_type")})
          PY
      - name: Create contact sheet
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v150-weak-ties-directorscut-v2-final.mp4)
          I=$(python3 -c "print(max(1.0, float('$D')/24))")
          ffmpeg -y -i output/v150-weak-ties-directorscut-v2-final.mp4 -vf "fps=1/$I,scale=384:-1,tile=6x4:padding=4:margin=4" -frames:v 1 output/v150-contact-sheet.jpg
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: v150-weak-ties-directorscut-v2-master
          path: |
            shared/v150/output/v150-weak-ties-directorscut-v2-final.mp4
            shared/v150/output/v150-contact-sheet.jpg
          retention-days: 21
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v150-weak-ties-directorscut-v2-${{ github.run_id }}"
          TITLE="V150 考える夜｜弱い紐帯 Director’s Cut V2"
          gh release create "$TAG" --title "$TITLE" --notes "Director’s Cut V2 完成動画（1920x1080・30fps・H.264 CRF17）。研究資料・データ視覚化・人物関係・情報の橋・選択肢を画面ごとに描き分けた58シーン。日本語明朝＆ゴシックの2書体。Google Docs現行原稿のナレーションと字幕を保持。VOICEVOX青山龍星、速度1.10。" output/v150-weak-ties-directorscut-v2-final.mp4 output/v150-contact-sheet.jpg


# Note: chapter render steps use npm run render / render:smoke; shared/v124/package.json must pass $CHAPTER to scripts/render.mjs.
