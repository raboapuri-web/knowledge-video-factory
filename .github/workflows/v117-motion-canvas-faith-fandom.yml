name: V117 Motion Canvas Faith Fandom
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v117-motion-canvas-faith-fandom.yml','shared/v117/**']
permissions: {contents: write}
concurrency: {group: v117-motion-canvas-faith-fandom, cancel-in-progress: true}
env:
  PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v117/.puppeteer
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node shared/v117/scripts/check-plan.mjs
      - working-directory: shared/v117
        run: npm install --no-audit --no-fund
      - run: tar --exclude='shared/v117/media' --exclude='shared/v117/output' --exclude='shared/v117/qa' -czf v117-motion-base.tar.gz shared/v117
      - uses: actions/upload-artifact@v4
        with: {name: v117-motion-base, path: v117-motion-base.tar.gz, retention-days: 1, compression-level: 0}
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {slug: [00-prologue,01-sacred,02-belief,03-collective,04-narrative,05-reinvent,06-shadow,07-epilogue]}
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name "voicevox-${{ strategy.job-index }}" -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi; sleep 2; done
          exit 1
      - run: node shared/v117/scripts/generate-chapter-voice.mjs "${{ matrix.slug }}"
      - run: tar -czf "v117-voice-${{ matrix.slug }}.tar.gz" "shared/v117/media/${{ matrix.slug }}" "shared/v117/src/generated/${{ matrix.slug }}.ts" "shared/v117/voice-report-${{ matrix.slug }}.json"
      - uses: actions/upload-artifact@v4
        with: {name: "v117-voice-${{ matrix.slug }}", path: "v117-voice-${{ matrix.slug }}.tar.gz", retention-days: 1, compression-level: 0}
  render:
    needs: [prepare,voice]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {slug: [00-prologue,01-sacred,02-belief,03-collective,04-narrative,05-reinvent,06-shadow,07-epilogue]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with: {name: v117-motion-base}
      - run: tar -xzf v117-motion-base.tar.gz
      - uses: actions/download-artifact@v4
        with: {name: "v117-voice-${{ matrix.slug }}"}
      - run: tar -xzf "v117-voice-${{ matrix.slug }}.tar.gz"
      - working-directory: shared/v117
        run: npm run build
      - working-directory: shared/v117
        run: node scripts/render.mjs "${{ matrix.slug }}" --smoke && test -s "output/v117-${{ matrix.slug }}-smoke.mp4" && rm -f "output/v117-${{ matrix.slug }}-smoke.mp4"
      - working-directory: shared/v117
        run: chmod +x ../motion-canvas-standard/render-with-retry.sh && MAX_ATTEMPTS=2 ../motion-canvas-standard/render-with-retry.sh 12m node scripts/render.mjs "${{ matrix.slug }}"
      - run: tar -czf "v117-render-${{ matrix.slug }}.tar.gz" "shared/v117/output/v117-${{ matrix.slug }}.mp4" "shared/v117/render-report-${{ matrix.slug }}.json" "shared/v117/voice-report-${{ matrix.slug }}.json"
      - uses: actions/upload-artifact@v4
        with: {name: "v117-render-${{ matrix.slug }}", path: "v117-render-${{ matrix.slug }}.tar.gz", retention-days: 1, compression-level: 0}
  finalize:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: node shared/v117/scripts/check-plan.mjs
      - uses: actions/download-artifact@v4
        with: {pattern: v117-render-*, path: renders, merge-multiple: true}
      - run: for f in renders/v117-render-*.tar.gz; do tar -xzf "$f"; done
      - working-directory: shared/v117
        run: |
          mkdir -p output
          for f in output/v117-00-prologue.mp4 output/v117-01-sacred.mp4 output/v117-02-belief.mp4 output/v117-03-collective.mp4 output/v117-04-narrative.mp4 output/v117-05-reinvent.mp4 output/v117-06-shadow.mp4 output/v117-07-epilogue.mp4; do printf "file '%s'\n" "$(realpath "$f")"; done > output/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i output/concat.txt -c copy output/v117-voice-master.mp4
          D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/v117-voice-master.mp4)
          node scripts/generate-bgm.mjs "$D"
          ffmpeg -y -loglevel error -i output/v117-voice-master.mp4 -i output/bgm.m4a -filter_complex "[0:a]volume=1[vo];[1:a]volume=.035[bg];[vo][bg]amix=inputs=2:duration=first[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest output/v117-final.mp4
          mkdir -p qa
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 output/v117-final.mp4 | head -1); H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 output/v117-final.mp4 | head -1); F=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 output/v117-final.mp4 | head -1); D=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 output/v117-final.mp4); A=$(ffprobe -v error -select_streams a -show_entries stream=index -of default=nw=1:nk=1 output/v117-final.mp4 | wc -l)
          test "$W" = "1920"; test "$H" = "1080"; test "$F" = "30/1"; test "$A" -ge 1; awk "BEGIN{exit !($D >= 480)}"
          node - "$D" "$A" <<'NODE'
          const fs=require('fs'),duration=Number(process.argv[2]),audioStreams=Number(process.argv[3]),m=JSON.parse(fs.readFileSync('manifest.json','utf8'));const vr=fs.readdirSync('.').filter(x=>x.startsWith('voice-report-')).map(x=>JSON.parse(fs.readFileSync(x))),rr=fs.readdirSync('.').filter(x=>x.startsWith('render-report-')).map(x=>JSON.parse(fs.readFileSync(x))),semanticScenes=m.chapters.reduce((s,[slug])=>s+JSON.parse(fs.readFileSync('chapters/'+slug+'.json')).beats.length,0),out={videoId:'V117',durationSeconds:duration,durationMinutes:Number((duration/60).toFixed(2)),resolution:'1920x1080',fps:30,audioStreams,semanticScenes,narrationSeconds:Number(vr.reduce((s,x)=>s+x.totalSeconds,0).toFixed(3)),chapterRenderSeconds:Number(rr.reduce((s,x)=>s+x.renderSeconds,0).toFixed(2)),subtitleLayer:'persistent topmost UI overlay',passed:true};fs.writeFileSync('qa/final-validation.json',JSON.stringify(out,null,2))
          NODE
          set +e; ffmpeg -hide_banner -i output/v117-final.mp4 -vf "blackdetect=d=2:pix_th=0.02,freezedetect=n=-55dB:d=6" -an -f null - 2> qa/visual-anomaly-scan.txt; set -e
          INTERVAL=$(awk "BEGIN{print $D/25}"); ffmpeg -y -loglevel error -i output/v117-final.mp4 -vf "fps=1/$INTERVAL,scale=384:-1,tile=5x5:padding=6:margin=8" -frames:v 1 output/v117-contact-sheet.jpg
      - working-directory: shared/v117
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="v117-faith-fandom-${GITHUB_RUN_ID}"; NAME="knowledge-video-v117-faith-fandom-${GITHUB_RUN_ID}.mp4"; cp output/v117-final.mp4 "output/$NAME"
          gh release create "$TAG" "output/$NAME" output/v117-contact-sheet.jpg qa/preproduction-summary.json qa/final-validation.json qa/visual-anomaly-scan.txt SOURCES.md V117_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V117 Faith and Fandom ${GITHUB_RUN_ID}" --notes "V117 full Motion Canvas production for 文化的暴飲暴食. 37 semantic scenes / 8 chapter renders / VOICEVOX / topmost subtitles / QA contact sheet."
