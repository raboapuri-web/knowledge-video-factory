# V150 考える夜｜2026米中間選挙から見る日本の最悪シナリオ（69 slides）
# - storyboard: 台本・スライド整合性監査 + audit.json をアーティファクト化
# - chapter: 8章並列(最大4)で VOICEVOX 合成→ Motion Canvas レンダ→音声ミックス
# - finalize: 章 MP4 を連結→ BGM ミックス→全画面QA→Artifact納品（main・YouTubeは不変更）
name: V150 US Midterm Japan Worst Case Presentation Motion Canvas


on:
  workflow_dispatch:
  push:
    branches: [production/v150-us-midterm-japan-20261107]
    paths:
      - '.github/workflows/v150-us-midterm-japan-slides.yml'
      - 'shared/v150/**'


permissions:
  contents: write


concurrency:
  group: v150-midterm-japan-${{ github.sha }}
  cancel-in-progress: false


jobs:
  storyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Compile slides and check audit
        run: node scripts/compile.mjs
      - name: Check audit
        run: node -e "const a=require('./content/audit.json'); if(a.totalSlides!==69||a.errors.length){console.error(a);process.exit(1)} console.log('PREFLIGHT_OK', a.totalSlides, 'render units /', a.totalSlides, 'spec slides')"
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v150-source-audit
          path: shared/v150/content/audit.json
          retention-days: 21


  chapter:
    needs: storyboard
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chapter: [prologue, chapter1, chapter2, chapter3, chapter4, chapter5, chapter6, epilogue]
    env:
      CHAPTER: ${{ matrix.chapter }}
      VOICEVOX_SPEED: '1.12'
      VOICEVOX_SPEAKER_ID: '13'
      VOICE_PARALLEL: '3'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/shared/v150/.puppeteer
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system packages
        run: timeout 300 sudo apt-get install -y -qq fonts-noto-cjk fontconfig ffmpeg
      - name: Prepare Motion Canvas harness, bespoke renderer, and TTS integration
        run: |
          mkdir -p src src/lib scripts
          cp ../v124/package.json package.json
          cp ../v124/tsconfig.json tsconfig.json
          cp ../v124/vite.config.ts vite.config.ts
          cp ../v124/headless.html headless.html
          cp ../v124/src/headless.ts src/headless.ts
          cp ../v124/src/types.d.ts src/types.d.ts
          cp ../v124/scripts/render.mjs scripts/render.mjs
          sed -i 's/v124/v150/g; s/!smoke/false/g' scripts/render.mjs
          cp ../v149/scripts/synth.mjs scripts/synth.mjs
          test -s src/lib/chapter.tsx
          test -s scripts/compile.mjs
      - name: Compile slides and generate project
        run: node scripts/compile.mjs "$CHAPTER"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then echo "VOICEVOX READY"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version
      - name: Synthesize narration
        run: node scripts/synth.mjs "$CHAPTER"
      - name: Build
        run: npm run build
      - name: Smoke render
        run: |
          timeout 600 npm run render:smoke || true
          ls -la output/ || true
          if [ -d "output/v150-$CHAPTER" ]; then echo "SMOKE PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v150-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v150-$CHAPTER.mp4"; fi
          ls -la output/ || true
      - name: Render chapter video
        run: |
          timeout 2400 npm run render || true
          ls -la output/ || true
          if [ -d "output/v150-$CHAPTER" ]; then echo "PNG FRAMES FOUND"; ffmpeg -y -framerate 60 -pattern_type glob -i "output/v150-$CHAPTER/*.png" -vf fps=30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "output/v150-$CHAPTER.mp4"; fi
          ls -lh "output/v150-$CHAPTER.mp4"
      - name: Mix narration audio
        run: |
          ls -lh media/$CHAPTER/narration.wav "output/v150-$CHAPTER.mp4"
          ffmpeg -y -i "output/v150-$CHAPTER.mp4" -i media/$CHAPTER/narration.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest "output/v150-$CHAPTER-with-audio.mp4"
          mv "output/v150-$CHAPTER-with-audio.mp4" "output/v150-$CHAPTER.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/v150-$CHAPTER.mp4"
      - name: Upload chapter segment
        uses: actions/upload-artifact@v4
        with:
          name: v150-segment-${{ matrix.chapter }}
          path: shared/v150/output/v150-${{ matrix.chapter }}.mp4
          retention-days: 14
          compression-level: 0


  finalize:
    needs: chapter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shared/v150
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: timeout 300 sudo apt-get install -y -qq ffmpeg
      - name: Download chapter segments
        uses: actions/download-artifact@v4
        with:
          pattern: v150-segment-*
          path: ${{ github.workspace }}/shared/v150/segments
          merge-multiple: true
      - name: Concatenate chapters
        run: |
          mkdir -p output
          for c in prologue chapter1 chapter2 chapter3 chapter4 chapter5 chapter6 epilogue; do echo "file '$GITHUB_WORKSPACE/shared/v150/segments/v150-$c.mp4'" >> output/concat.txt; done
          cat output/concat.txt
          ffmpeg -y -f concat -safe 0 -i output/concat.txt -c copy -movflags +faststart output/v150-voice-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v150-voice-master.mp4
      - name: Mix BGM if available
        run: |
          cp ../v124/scripts/generate-bgm.mjs scripts/generate-bgm.mjs
          BGM_FILE=""
          for p in ../../common/BGM/Amazon-river-ambience.mp3 ../common/BGM/Amazon-river-ambience.mp3 common/BGM/Amazon-river-ambience.mp3; do if [ -f "$p" ]; then BGM_FILE="$p"; break; fi; done
          if [ -n "$BGM_FILE" ]; then echo "BGM found: $BGM_FILE"; node scripts/generate-bgm.mjs output/v150-voice-master.mp4 output/v150-midterm-japan-worst-cases-final.mp4 "$BGM_FILE" 0.035; else echo "BGM not found, finishing without BGM"; cp output/v150-voice-master.mp4 output/v150-midterm-japan-worst-cases-final.mp4; fi
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 output/v150-midterm-japan-worst-cases-final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/v150-midterm-japan-worst-cases-final.mp4
      - name: Create contact sheet
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/v150-midterm-japan-worst-cases-final.mp4)
          I=$(python3 -c "print(max(1.0, float('$D')/24))")
          ffmpeg -y -i output/v150-midterm-japan-worst-cases-final.mp4 -vf "fps=1/$I,scale=384:-1,tile=6x4:padding=4:margin=4" -frames:v 1 output/v150-contact-sheet.jpg
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: v150-midterm-japan-worst-cases-master
          path: |
            shared/v150/output/v150-midterm-japan-worst-cases-final.mp4
            shared/v150/output/v150-contact-sheet.jpg
          retention-days: 21

      - name: Verify final video geometry, audio and duration
        run: |
          python3 - <<'PY'
          import json,subprocess,pathlib
          p=pathlib.Path('output/v150-midterm-japan-worst-cases-final.mp4')
          assert p.stat().st_size > 5_000_000, p.stat().st_size
          x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          vid=next(s for s in x['streams'] if s['codec_type']=='video')
          aud=next(s for s in x['streams'] if s['codec_type']=='audio')
          assert (vid['width'],vid['height'])==(1920,1080)
          assert vid['codec_name']=='h264' and aud['codec_name']=='aac'
          assert float(x['format']['duration'])>400
          report={'file':str(p),'duration':float(x['format']['duration']),'width':vid['width'],'height':vid['height'],'fps':vid['r_frame_rate'],'video_codec':vid['codec_name'],'audio_codec':aud['codec_name'],'status':'PASS'}
          pathlib.Path('output/v150-qa-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(report)
          PY
      - name: Upload video quality report
        uses: actions/upload-artifact@v4
        with:
          name: v150-midterm-japan-qa
          path: shared/v150/output/v150-qa-report.json
          retention-days: 30
