name: V45 Game Work Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v45-game-work-production.yml'
      - 'shared/bootstrap/v45-game-work.mjs'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize V45 production
        run: node shared/bootstrap/v45-game-work.mjs
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install V45 dependencies
        working-directory: v45-game-work
        run: npm install
      - name: Expose V45 dependencies to shared tools
        working-directory: v45-game-work
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Build preproduction plan
        working-directory: v45-game-work
        run: node scripts/build-preproduction.mjs
      - name: V45 story and visual-diversity guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v45-game-work/src/script-data.json');
          if(s.beats.length!==64) throw new Error(`Expected 64 beats, got ${s.beats.length}`);
          const visualKeys=s.beats.map(b=>b.visual);
          const used=[...new Set(visualKeys)];
          if(used.length!==64) throw new Error(`Expected 64 distinct visual keys, got ${used.length}`);
          if(new Set(s.beats.map(b=>b.id)).size!==64) throw new Error('Duplicate beat ids');
          const all=s.beats.map(b=>b.narration).join('\n');
          for(const phrase of ['時間規律','疎外','自律性','有能感','関係性','フロー','失敗','デイリー']) {
            if(!all.includes(phrase)) throw new Error(`Missing narrative anchor: ${phrase}`);
          }
          const renderer=fs.readFileSync('./v45-game-work/src/scenes.tsx','utf8');
          const cases=[...renderer.matchAll(/case\s+(\d+)\s*:/g)].map(m=>Number(m[1]));
          const caseSet=new Set(cases);
          if(caseSet.size!==64) throw new Error(`Renderer requires 64 explicit scene cases, got ${caseSet.size}`);
          for(let i=1;i<=64;i++) if(!caseSet.has(i)) throw new Error(`Missing explicit renderer case ${i}`);
          console.log(`V45 architecture: ${s.beats.length} beats / ${used.length} unique visual keys / ${caseSet.size} explicit render cases`);
          NODE
      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v45-game-work pre
      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs
      - name: TypeScript check
        working-directory: v45-game-work
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        working-directory: v45-game-work
        run: node scripts/generate-voicevox.mjs
      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v45-game-work/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s`);
          if(s.durationSeconds<900) throw new Error(`V45 is shorter than 15 minutes: ${s.durationSeconds}s`);
          if(s.durationSeconds>1230) throw new Error(`V45 is longer than 20m30s: ${s.durationSeconds}s`);
          if((s.beats||[]).length!==64) throw new Error(`Expected 64 measured scenes, got ${(s.beats||[]).length}`);
          NODE
      - name: Production QA post
        run: node shared/qa/validate-video.mjs v45-game-work post
      - id: plan
        working-directory: v45-game-work
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Pack prepared V45
        run: tar --exclude='v45-game-work/node_modules' -czf v45-prepared.tar.gz v45-game-work
      - uses: actions/upload-artifact@v4
        with:
          name: v45-prepared
          retention-days: 1
          if-no-files-found: error
          path: v45-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v45-prepared
          path: .
      - run: tar -xzf v45-prepared.tar.gz
      - name: Install V45 dependencies
        working-directory: v45-game-work
        run: npm install
      - name: Render segment
        working-directory: v45-game-work
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V45GameWork "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v45-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v45-game-work/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v45-prepared
          path: .
      - run: tar -xzf v45-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v45-segment-*
          path: v45-game-work/parts
          merge-multiple: true
      - name: Generate BGM
        working-directory: v45-game-work
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        working-directory: v45-game-work
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        working-directory: v45-game-work
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.05[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v45-game-work-final.mp4
      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v45-game-work v45-game-work/out/v45-game-work-final.mp4 v45-game-work/out/v45-game-work-scene-contact-sheet.jpg
      - name: Verify QA sheet source count
        run: |
          node - <<'NODE'
          const s=require('./v45-game-work/src/sync-timing.json');
          if((s.beats||[]).length!==64) throw new Error(`QA requires 64 measured scenes, got ${(s.beats||[]).length}`);
          NODE
      - name: Publish GitHub Release
        working-directory: v45-game-work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v45-game-work-${GITHUB_RUN_ID}.mp4"
          cp out/v45-game-work-final.mp4 "out/${VIDEO_NAME}"
          TAG="v45-game-work-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v45-game-work-scene-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json IMPLEMENTATION_PLAN.md src/script-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V45 Game Work Production ${GITHUB_RUN_ID}" \
            --notes "64-scene long-form Remotion production on why people who feel exhausted by real-world work can voluntarily perform labor-like tasks for hours inside games. The visual story moves through a late office, commute, game settlement, pre-industrial task-oriented labor, industrial time discipline, Marxian alienation, self-determination theory, flow, raid cooperation, job characteristics, feedback distance, cheap failure, persistent worlds, daily-quest obligation, craft work, and the final night-to-morning contrast. Every scene has a distinct visual key and explicit renderer case, with measured 青山龍星 narration, synchronized subtitles, dark ambient BGM, segmented rendering, and one QA frame per scene."
