name: V101 Greek Mythology Original Scenes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v101-greek-myths-original-scenes.yml'
      - 'shared/bootstrap/v101-greek-myths-original-scenes.mjs'
      - 'shared/v101/**'
permissions: {contents: write}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v101-greek-myths-original-scenes.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v101-greek-myths-original-scenes
        run: npm install
      - working-directory: v101-greek-myths-original-scenes
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v101-greek-myths-original-scenes
        run: node scripts/build-preproduction.mjs
      - name: Check narration-specific scene coverage and static settings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r='v101-greek-myths-original-scenes/src/';
          const beats=require('./'+r+'scene-data.json');
          const script=require('./'+r+'script-data.json');
          if(beats.length<114||beats.length!==script.beats.length)throw Error('Missing scenes');
          if(new Set(beats.map(b=>b.actionId)).size!==beats.length)throw Error('Duplicate action');
          if(new Set(beats.map(b=>b.sceneKey)).size!==beats.length)throw Error('Duplicate scene');
          if(new Set(beats.map(b=>b.phase)).size!==6)throw Error('Missing chapter');
          const seen=new Set();
          for(let i=0;i<beats.length;i++){
            const b=beats[i];
            if(!b.primary||!b.motion||!b.environment||!b.label)throw Error('Undesigned scene '+b.id);
            if(seen.has(b.environment)&&(i===0||beats[i-1].environment!==b.environment))throw Error('Noncontiguous environment reuse '+b.environment);
            seen.add(b.environment);
          }
          const renderer=fs.readFileSync('shared/v101/greek-visuals.tsx','utf8');
          if(!renderer.includes('throw new Error'))throw Error('Generic image fallback not permitted');
          console.log('PASS '+beats.length+' custom narration actions; '+seen.size+' settings, all static within adjacent groups');
          NODE
      - working-directory: v101-greek-myths-original-scenes
        run: npm run check
      - name: Visual preview across the entire film
        working-directory: v101-greek-myths-original-scenes
        run: |
          mkdir -p out/preview
          TOTAL=$(node -e "console.log(require('./src/scene-data.json').length)")
          for I in $(seq 0 19); do
            FRAME=$(( I * (TOTAL * 20 - 1) / 19 ))
            npx remotion still src/index.tsx V101ScenePreview "out/preview/scene-${I}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 20
      - name: Start VOICEVOX engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for I in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done
          exit 1
      - working-directory: v101-greek-myths-original-scenes
        run: node scripts/generate-voicevox.mjs
      - working-directory: v101-greek-myths-original-scenes
        run: node scripts/check-original-scenes.mjs
      - id: plan
        working-directory: v101-greek-myths-original-scenes
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v101-greek-myths-original-scenes/node_modules' -czf v101-prepared.tar.gz v101-greek-myths-original-scenes
      - uses: actions/upload-artifact@v4
        with: {name: v101-prepared, path: v101-prepared.tar.gz, retention-days: 2}

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v101-prepared}
      - run: tar -xzf v101-prepared.tar.gz
      - working-directory: v101-greek-myths-original-scenes
        run: npm install
      - working-directory: v101-greek-myths-original-scenes
        run: mkdir -p out && npx remotion render src/index.tsx V101GreekMythsOriginalScenes "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=1 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v101-segment-${{ matrix.id }}', path: 'v101-greek-myths-original-scenes/out/segment-${{ matrix.id }}.mp4', retention-days: 2}

  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v101-prepared}
      - run: tar -xzf v101-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v101-segment-*', path: v101-greek-myths-original-scenes/parts, merge-multiple: true}
      - working-directory: v101-greek-myths-original-scenes
        run: node scripts/generate-bgm.mjs
      - working-directory: v101-greek-myths-original-scenes
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v101-final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v101-final.mp4 | head -1)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v101-final.mp4 | head -1)" = '1080'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v101-final.mp4 | cut -d. -f1)" -gt 450
      - run: node shared/qa/generate-scene-contact-sheet.mjs v101-greek-myths-original-scenes v101-greek-myths-original-scenes/out/v101-final.mp4 v101-greek-myths-original-scenes/out/v101-contact-sheet.jpg
      - working-directory: v101-greek-myths-original-scenes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v101-greek-myths-original-scenes-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v101-greek-myths-original-scenes-${GITHUB_RUN_ID}.mp4"
          cp out/v101-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v101-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V101_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V101 Greek Mythology Original Scenes ${GITHUB_RUN_ID}" --notes "V101 original Greek-mythology animation: narration-matched action for every scene, static setting in adjacent shots, individually illustrated myth figures and artifacts, spoken Japanese VOICEVOX narration, subtitles, 1920x1080 video and contact-sheet QA."
