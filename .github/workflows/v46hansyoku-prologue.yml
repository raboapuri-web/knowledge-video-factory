name: V46 Hansyoku Prologue Review R1 Parallel Render
on:
  push:
    branches: [main]
    paths:
      - 'v46hansyoku/**'
      - '.github/workflows/v46hansyoku-prologue.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v46hansyoku-prologue-review-r1
  cancel-in-progress: true
jobs:
  render-prologue:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install graphics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Check exact approved chapter script and registered assets
        working-directory: v46hansyoku
        run: |
          node scripts/check-source.mjs
          node scripts/stage-assets.mjs
      - name: Install Remotion and verify shared production-policy versions
        working-directory: v46hansyoku
        run: |
          npm install --no-audit --no-fund
          ln -sfn "$PWD/node_modules" ../node_modules
          node ../shared/voice/test-pronunciation.mjs
          node ../shared/qa/validate-video.mjs . pre
      - name: Download original prologue for identical soundtrack and measured timing
        uses: actions/download-artifact@v4
        with:
          run-id: 36023379029
          github-token: ${{ github.token }}
          name: v46hansyoku-prologue-32-scenes-voiced-review
          path: v46hansyoku/.approved-previous
      - name: Restore original AAC narration and subtitles without new voice synthesis
        working-directory: v46hansyoku
        run: |
          set -euo pipefail
          original_mp4="$(find .approved-previous -type f -name 'v46-prologue.mp4' -print -quit)"
          old_timing="$(find .approved-previous -type f -name 'sync-timing.json' -print -quit)"
          old_subtitles="$(find .approved-previous -type f -name 'subtitle-cues.json' -print -quit)"
          old_report="$(find .approved-previous -type f -name 'pronunciation-report.json' -print -quit)"
          test -s "$original_mp4"
          test -s "$old_timing"
          test -s "$old_subtitles"
          test -s "$old_report"
          mkdir -p public/audio out
          cp "$old_timing" src/sync-timing.json
          cp "$old_subtitles" src/subtitle-cues.json
          cp "$old_report" public/audio/pronunciation-report.json
          ffmpeg -y -loglevel error -i "$original_mp4" -map 0:a:0 -vn -c:a copy public/audio/narration.m4a
          test -s public/audio/narration.m4a
          npm run subtitles
          node scripts/check-source.mjs
          node ../shared/qa/validate-video.mjs . post
          echo "Original AAC narration restored exactly from previously reviewed video."
      - name: Typecheck entire Remotion implementation
        working-directory: v46hansyoku
        run: npm run check
      - name: Parallel render 1920x1080 revised prologue with preserved voice and subtitles
        working-directory: v46hansyoku
        run: |
          mkdir -p out
          npm run render:revised
          test -s out/v46-prologue-review-r1.mp4
          python3 - <<'PY'
          import json, subprocess
          p='out/v46-prologue-review-r1.mp4'
          raw=subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p],text=True)
          meta=json.loads(raw)
          videos=[s for s in meta['streams'] if s['codec_type']=='video']
          audios=[s for s in meta['streams'] if s['codec_type']=='audio']
          assert len(videos)==1, f"Expected exactly one video stream, got {len(videos)}"
          assert len(audios)>=1, "MP4 is missing the required narration audio"
          v=videos[0]
          assert (v['width'],v['height'])==(1920,1080), f"Wrong dimensions: {(v['width'],v['height'])}"
          assert v['codec_name']=='h264', f"Wrong video codec: {v['codec_name']}"
          assert v['avg_frame_rate']=='30/1', f"Wrong framerate: {v['avg_frame_rate']}"
          assert any(a['codec_name']=='aac' for a in audios), f"Wrong audio codec(s): {[a['codec_name'] for a in audios]}"
          assert 180<float(meta['format']['duration'])<240, f"Unexpected runtime: {meta['format']['duration']}s"
          print(f"MP4 technical verification passed: {meta['format']['duration']}s, 1920x1080, 30fps, H264/AAC")
          PY
      - name: Generate one representative frame per source-aligned scene
        working-directory: v46hansyoku
        run: |
          node ../shared/qa/generate-scene-contact-sheet.mjs . out/v46-prologue-review-r1.mp4 out/scene-contact-sheet.jpg
          test "$(find .qa-scene-frames -name 'scene-*.jpg' | wc -l)" -eq 32
      - name: Publish review artifact (not chapter approval)
        uses: actions/upload-artifact@v4
        with:
          name: v46hansyoku-prologue-review-r1-parallel-32-scenes
          path: |
            v46hansyoku/out/v46-prologue-review-r1.mp4
            v46hansyoku/out/v46-prologue.srt
            v46hansyoku/out/scene-contact-sheet.jpg
            v46hansyoku/.qa-scene-frames/scene-*.jpg
            v46hansyoku/public/audio/pronunciation-report.json
            v46hansyoku/src/sync-timing.json
            v46hansyoku/src/subtitle-cues.json
            v46hansyoku/src/script-data.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic data on failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v46hansyoku-prologue-review-r1-failed-diagnostics
          path: |
            v46hansyoku/src/sync-timing.json
            v46hansyoku/src/subtitle-cues.json
            v46hansyoku/public/audio/pronunciation-report.json
            v46hansyoku/out/*.srt
            v46hansyoku/out/*.jpg
          if-no-files-found: ignore
          retention-days: 5
