name: V113 Long Tenure Market Value
on:
  workflow_dispatch:
  push:
    branches: [v113-long-tenure-market-value-production]
    paths:
      - '.github/workflows/v113-long-tenure-market-value.yml'
      - 'shared/bootstrap/v113-long-tenure-market-value.mjs'
      - 'shared/v113/**'
permissions:
  contents: write
concurrency:
  group: v113-long-tenure-market-value
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      matrix: '${{ steps.plan.outputs.matrix }}'
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap
        run: node shared/bootstrap/v113-long-tenure-market-value.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v113-long-tenure-market-value
        run: npm install --no-audit --no-fund
      - working-directory: v113-long-tenure-market-value
        run: node scripts/build-preproduction.mjs
      - name: Structural scene QA
        run: |
          node - <<'NODE'
          const d=require('./v113-long-tenure-market-value/src/scene-data.json');
          if(d.length<120)throw Error('too few scenes '+d.length);
          for(const k of ['action','actionId','sceneKey','visual','environment'])if(new Set(d.map(x=>x[k])).size!==d.length)throw Error('reused '+k);
          for(let i=0;i<d.length;i++){
            const b=d[i],p=d[i-1];
            if(!b.narration||b.narration.length<22)throw Error('short narration '+b.id);
            if(!b.primary||!b.verb||!b.family||!b.shotKind)throw Error('incomplete '+b.id);
            if(p&&p.family===b.family)throw Error('adjacent family reuse '+b.id);
            if(p&&[b.family,b.primary,b.verb,b.shotKind].join('|')===[p.family,p.primary,p.verb,p.shotKind].join('|'))throw Error('similar adjacent cut '+b.id);
          }
          const f=new Set(d.map(x=>x.family)),p=new Set(d.map(x=>x.primary)),v=new Set(d.map(x=>x.verb));
          if(f.size<18||p.size<28||v.size<15)throw Error('insufficient diversity '+f.size+'/'+p.size+'/'+v.size);
          console.log('V113 QA PASS',d.length,f.size,p.size,v.size);
          NODE
      - working-directory: v113-long-tenure-market-value
        run: npm run check
      - name: Semantic smoke render
        working-directory: v113-long-tenure-market-value
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V113SmokePreview out/v113-smoke.mp4 --codec=h264 --crf=30 --concurrency=4 --log=error
          test -s out/v113-smoke.mp4
      - name: Background motion QA
        working-directory: v113-long-tenure-market-value
        run: |
          mkdir -p out/bgqa
          node - <<'NODE'
          const fs=require('fs'),b=require('./src/scene-data.json'),m=new Map();
          for(const [i,x] of b.entries())if(!m.has(x.family))m.set(x.family,i);
          fs.writeFileSync('out/bgqa/index.json',JSON.stringify([...m.entries()].map(([family,i])=>({family,i}))));
          NODE
          node - <<'NODE'
          const {execFileSync}=require('child_process'),fs=require('fs'),crypto=require('crypto');
          const a=JSON.parse(fs.readFileSync('out/bgqa/index.json','utf8'));
          for(const {family,i} of a){
            const one='out/bgqa/'+family+'-a.png',two='out/bgqa/'+family+'-b.png';
            execFileSync('npx',['remotion','still','src/index.tsx','V113BackgroundPreview',one,'--frame='+(i*18+2),'--log=error'],{stdio:'inherit'});
            execFileSync('npx',['remotion','still','src/index.tsx','V113BackgroundPreview',two,'--frame='+(i*18+15),'--log=error'],{stdio:'inherit'});
            const h=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
            if(h(one)===h(two))throw Error('background not animated '+family);
          }
          NODE
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done
          exit 1
      - working-directory: v113-long-tenure-market-value
        run: node scripts/generate-voicevox.mjs
      - name: Voice timing QA
        working-directory: v113-long-tenure-market-value
        run: |
          node - <<'NODE'
          const d=require('./src/scene-data.json'),t=require('./src/sync-timing.json');
          if(t.beats.length!==d.length)throw Error('timing mismatch');
          if(!Number.isFinite(t.durationSeconds)||t.durationSeconds<840)throw Error('runtime too short '+t.durationSeconds);
          for(const [i,x] of t.beats.entries())if(!(x.end>x.start)||x.index!==i)throw Error('bad timing '+i);
          console.log('duration',t.durationSeconds);
          NODE
      - id: plan
        working-directory: v113-long-tenure-market-value
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v113-long-tenure-market-value/node_modules' -czf v113-prepared.tar.gz v113-long-tenure-market-value
      - uses: actions/upload-artifact@v4
        with: {name: v113-prepared, path: v113-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v113-prepared}
      - run: tar -xzf v113-prepared.tar.gz
      - working-directory: v113-long-tenure-market-value
        run: npm install --no-audit --no-fund
      - working-directory: v113-long-tenure-market-value
        run: mkdir -p out && npx remotion render src/index.tsx V113LongTenureMarketValue "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v113-segment-${{ matrix.id }}', path: 'v113-long-tenure-market-value/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v113-prepared}
      - run: tar -xzf v113-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v113-segment-*', path: v113-long-tenure-market-value/parts, merge-multiple: true}
      - working-directory: v113-long-tenure-market-value
        run: node scripts/generate-bgm.mjs
      - working-directory: v113-long-tenure-market-value
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v113-final.mp4
      - name: Final validation
        working-directory: v113-long-tenure-market-value
        run: |
          node - <<'NODE'
          const {execFileSync}=require('child_process'),fs=require('fs'),t=require('./src/sync-timing.json');
          const f='out/v113-final.mp4';
          const d=Number(execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',f],{encoding:'utf8'}).trim());
          const m=JSON.parse(execFileSync('ffprobe',['-v','error','-show_entries','stream=codec_type,width,height,r_frame_rate','-of','json',f],{encoding:'utf8'}));
          if(Math.abs(d-t.durationSeconds)>2.5)throw Error('duration mismatch '+d+'/'+t.durationSeconds);
          if(!m.streams.some(x=>x.codec_type==='video'&&x.width===1920&&x.height===1080&&x.r_frame_rate==='30/1'))throw Error('bad video stream');
          if(!m.streams.some(x=>x.codec_type==='audio'))throw Error('missing audio');
          if(fs.statSync(f).size<5000000)throw Error('small render');
          fs.mkdirSync('qa',{recursive:true});
          fs.writeFileSync('qa/final-validation.json',JSON.stringify({videoId:'V113-long-tenure-market-value',durationSeconds:d,minimumSeconds:840,passed:true},null,2));
          NODE
      - run: node shared/qa/generate-scene-contact-sheet.mjs v113-long-tenure-market-value v113-long-tenure-market-value/out/v113-final.mp4 v113-long-tenure-market-value/out/v113-contact-sheet.jpg
      - working-directory: v113-long-tenure-market-value
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v113-long-tenure-market-value-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v113-long-tenure-market-value-${GITHUB_RUN_ID}.mp4"
          cp out/v113-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v113-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json qa/final-validation.json SOURCES.md V113_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V113 Long Tenure Market Value ${GITHUB_RUN_ID}" --notes "Long-tenure careers, firm-specific human capital, signaling and skill obsolescence. Narration-specific actions, no adjacent background-family reuse, background-motion QA, synchronized Japanese narration, BGM and final validation."
