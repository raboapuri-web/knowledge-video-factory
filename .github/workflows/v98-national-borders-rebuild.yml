name: V98 National Borders Rebuild
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v98-national-borders-rebuild-production.yml','shared/bootstrap/v98-national-borders-rebuild.mjs','shared/v98/**']
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v98-national-borders-rebuild.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v98-national-borders-rebuild
        run: npm install
      - working-directory: v98-national-borders-rebuild
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v98-national-borders-rebuild
        run: node scripts/build-preproduction.mjs
      - name: Fine scene and static-background guard
        run: |
          node - <<'NODE'
          const s=require('./v98-national-borders-rebuild/src/script-data.json'),d=require('./v98-national-borders-rebuild/src/scene-data.json');const n=s.beats.length;if(n<270||n>380)throw Error(`scene count ${n}`);if(d.length!==n)throw Error('scene mismatch');if(new Set(d.map(x=>x.visual)).size!==n)throw Error('visual key reuse');if(new Set(d.map(x=>x.bgGroup)).size!==n)throw Error('background ID reuse');const phases=new Set(d.map(x=>x.phase)),modes=new Set(d.map(x=>x.mode));if(phases.size!==28)throw Error(`expected 28 phases, got ${phases.size}`);if(modes.size<14)throw Error(`too few modes ${modes.size}`);for(let i=0;i<d.length;i++){if(i&&d[i].mode===d[i-1].mode)throw Error(`adjacent mode repeat ${d[i].id}`);const w=d.slice(Math.max(0,i-4),i+1);if(w.length===5&&new Set(w.map(x=>x.mode)).size<3)throw Error(`low 5-shot variety ${d[i].id}`);}for(const ph of phases){const x=d.filter(z=>z.phase===ph);if(new Set(x.map(z=>z.mode)).size<4)throw Error(`phase repetitive ${ph}`);}const assetUse={};for(const x of d)if(x.asset)assetUse[x.asset]=(assetUse[x.asset]||0)+1;for(const [k,v] of Object.entries(assetUse))if(v>2)throw Error(`asset ${k} reused ${v} times`);const src=require('fs').readFileSync('./shared/v98/scenes.tsx','utf8');if(!src.includes('const renderMode=')||!src.includes('const cinematic=')||!src.includes('const diagram=')||!src.includes('const montage=')||!src.includes('export const SceneVisual'))throw Error('Missing V98 mixed storyboard engine');console.log(`${n} scenes / ${n} unique backgrounds / ${phases.size} phases / ${modes.size} visual modes / assets ${JSON.stringify(assetUse)}`);
          NODE
      - working-directory: v98-national-borders-rebuild
        run: npm run check
      - name: Preview critical original shots
        working-directory: v98-national-borders-rebuild
        run: |
          mkdir -p out/preview
          for FRAME in 0 420 840 1260 1680 2100 2520 2940 3360 3780 4200 4620 5040 5460; do
            npx remotion still src/index.tsx V98ScenePreview "out/preview/scene-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 14
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v98-national-borders-rebuild
        run: node scripts/generate-voicevox.mjs
      - name: Enforce visual rhythm and scene duration
        working-directory: v98-national-borders-rebuild
        run: node scripts/check-visual-rhythm.mjs
      - id: plan
        working-directory: v98-national-borders-rebuild
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v98-national-borders-rebuild/node_modules' -czf v98-prepared.tar.gz v98-national-borders-rebuild
      - uses: actions/upload-artifact@v4
        with: {name: v98-prepared, path: v98-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v98-prepared}
      - run: tar -xzf v98-prepared.tar.gz
      - working-directory: v98-national-borders-rebuild
        run: npm install
      - working-directory: v98-national-borders-rebuild
        run: mkdir -p out && npx remotion render src/index.tsx V98NationalBordersRebuild "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v98-segment-${{ matrix.id }}', path: 'v98-national-borders-rebuild/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v98-prepared}
      - run: tar -xzf v98-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v98-segment-*', path: v98-national-borders-rebuild/parts, merge-multiple: true}
      - working-directory: v98-national-borders-rebuild
        run: node scripts/generate-bgm.mjs
      - working-directory: v98-national-borders-rebuild
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v98-final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v98-final.mp4 | head -1)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v98-final.mp4 | head -1)" = '1080'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v98-final.mp4 | cut -d. -f1)" -gt 650
      - run: node shared/qa/generate-scene-contact-sheet.mjs v98-national-borders-rebuild v98-national-borders-rebuild/out/v98-final.mp4 v98-national-borders-rebuild/out/v98-contact-sheet.jpg
      - working-directory: v98-national-borders-rebuild
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v98-national-borders-rebuild-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v98-national-borders-rebuild-${GITHUB_RUN_ID}.mp4"
          cp out/v98-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v98-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V98_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V98 National Borders Rebuild ${GITHUB_RUN_ID}" --notes "Full V98 rebuild: 28 narrative phases, 17 distinct visual modes, narration-specific animation, no adjacent identical visual mode, at least three visual modes per five-shot window, unique background per micro-scene, selected asset-library backgrounds reused at most twice, measured scene-duration guard, neutral sourced treatment, VOICEVOX, subtitles and BGM."
