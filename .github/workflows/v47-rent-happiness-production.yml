name: V47 Rent Happiness Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v47-rent-happiness-production.yml'
      - 'shared/bootstrap/v47-rent-happiness.mjs'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize V47 from V46-compatible production base
        run: node shared/bootstrap/v47-rent-happiness.mjs
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - name: Install V47 dependencies
        working-directory: v47-rent-happiness
        run: npm install
      - name: Expose V47 dependencies to shared tools
        working-directory: v47-rent-happiness
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v47-rent-happiness pre
      - name: TypeScript check
        working-directory: v47-rent-happiness
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        working-directory: v47-rent-happiness
        run: node scripts/generate-voicevox.mjs
      - name: Duration and scene guard
        run: |
          node - <<'NODE'
          const s=require('./v47-rent-happiness/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / beats=${(s.beats||[]).length}`);
          if((s.beats||[]).length!==29) throw new Error(`Expected 29 measured scenes, got ${(s.beats||[]).length}`);
          if(s.durationSeconds<70) throw new Error(`V47 is unexpectedly short: ${s.durationSeconds}s`);
          if(s.durationSeconds>210) throw new Error(`V47 is unexpectedly long: ${s.durationSeconds}s`);
          NODE
      - name: Production QA post
        run: node shared/qa/validate-video.mjs v47-rent-happiness post
      - id: plan
        working-directory: v47-rent-happiness
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Pack prepared V47
        run: tar --exclude='v47-rent-happiness/node_modules' -czf v47-prepared.tar.gz v47-rent-happiness
      - uses: actions/upload-artifact@v4
        with:
          name: v47-prepared
          retention-days: 1
          if-no-files-found: error
          path: v47-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v47-prepared
          path: .
      - run: tar -xzf v47-prepared.tar.gz
      - name: Install V47 dependencies
        working-directory: v47-rent-happiness
        run: npm install
      - name: Render segment
        working-directory: v47-rent-happiness
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V47RentHappiness "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v47-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v47-rent-happiness/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v47-prepared
          path: .
      - run: tar -xzf v47-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v47-segment-*
          path: v47-rent-happiness/parts
          merge-multiple: true
      - name: Generate BGM
        working-directory: v47-rent-happiness
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        working-directory: v47-rent-happiness
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        working-directory: v47-rent-happiness
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.045[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v47-rent-happiness-final.mp4
      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v47-rent-happiness v47-rent-happiness/out/v47-rent-happiness-final.mp4 v47-rent-happiness/out/v47-rent-happiness-scene-contact-sheet.jpg
      - name: Publish GitHub Release
        working-directory: v47-rent-happiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v47-rent-happiness-${GITHUB_RUN_ID}.mp4"
          cp out/v47-rent-happiness-final.mp4 "out/${VIDEO_NAME}"
          TAG="v47-rent-happiness-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v47-rent-happiness-scene-contact-sheet.jpg public/audio/pronunciation-report.json IMPLEMENTATION_PLAN.md src/script-data.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "V47 Rent Happiness Production ${GITHUB_RUN_ID}" \
            --notes "港区文学『家賃を3倍にしたら、幸福まで上がると思っていた。』。V46互換のVOICEVOX実測同期・Remotion・分割レンダー・BGM・QA・Releaseパイプラインを使用。raboapuri-web/test の背景SVG、人物Reactテンプレート、小物を再利用し、29シーンすべてに個別の情景アニメーションを実装。"
