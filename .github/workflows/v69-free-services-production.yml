name: V69 Free Services Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v69-free-services-production.yml','shared/bootstrap/v69-free-services.mjs','shared/v69/**']
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs: {matrix: '${{ steps.plan.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
      - run: node shared/bootstrap/v69-free-services.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - working-directory: v69-free-services
        run: npm install
      - working-directory: v69-free-services
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - working-directory: v69-free-services
        run: node scripts/build-preproduction.mjs
      - name: Fine scene and static-background guard
        run: |
          node - <<'NODE'
          const s=require('./v69-free-services/src/script-data.json'),d=require('./v69-free-services/src/scene-data.json');const n=s.beats.length;if(n<170||n>380)throw Error(`scene count ${n}`);if(d.length!==n)throw Error('scene mismatch');if(new Set(s.beats.map(x=>x.visual)).size!==n)throw Error('visual key reuse');const g={},seen=new Set(),phases=new Set();let prev='';for(const x of d){phases.add(x.phase);g[x.bgGroup]=(g[x.bgGroup]||0)+1;if(x.bgGroup!==prev&&seen.has(x.bgGroup))throw Error(`nonconsecutive background reuse ${x.bgGroup}`);seen.add(x.bgGroup);prev=x.bgGroup;}for(const [k,v] of Object.entries(g))if(v>2)throw Error(`background ${k} used ${v} scenes`);if(Object.keys(g).length<88)throw Error(`too few backgrounds ${Object.keys(g).length}`);if(phases.size!==14)throw Error(`expected 14 distinct narrative phases, got ${phases.size}`);const src=require('fs').readFileSync('./shared/v69/scenes.tsx','utf8');if(!src.includes('export const SceneVisual')||!src.includes('const stage='))throw Error('Missing bespoke animation rendering');if(src.includes('useCurrentFrame'))throw Error('Visual background is not frame-static');console.log(`${n} micro-scenes / ${Object.keys(g).length} unique continuity backgrounds / ${phases.size} bespoke story worlds`);
          NODE
      - working-directory: v69-free-services
        run: npm run check
      - name: Preview critical original shots
        working-directory: v69-free-services
        run: |
          mkdir -p out/preview
          for FRAME in 0 300 600 900 1200 1500 1800 2100; do
            npx remotion still src/index.tsx V69ScenePreview "out/preview/scene-${FRAME}.png" --frame="$FRAME" --log=error
          done
          test "$(find out/preview -name '*.png' | wc -l)" -eq 8
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do curl -fsS http://127.0.0.1:50021/version && exit 0; sleep 2; done; exit 1
      - working-directory: v69-free-services
        run: node scripts/generate-voicevox.mjs
      - id: plan
        working-directory: v69-free-services
        run: echo "matrix=$(node scripts/plan-segments.mjs)" >> "$GITHUB_OUTPUT"
      - run: tar --exclude='v69-free-services/node_modules' -czf v69-prepared.tar.gz v69-free-services
      - uses: actions/upload-artifact@v4
        with: {name: v69-prepared, path: v69-prepared.tar.gz, retention-days: 1}
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: '${{ fromJson(needs.prepare.outputs.matrix) }}'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v69-prepared}
      - run: tar -xzf v69-prepared.tar.gz
      - working-directory: v69-free-services
        run: npm install
      - working-directory: v69-free-services
        run: mkdir -p out && npx remotion render src/index.tsx V69FreeServices "out/segment-${{ matrix.id }}.mp4" --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with: {name: 'v69-segment-${{ matrix.id }}', path: 'v69-free-services/out/segment-${{ matrix.id }}.mp4', retention-days: 1}
  finalize:
    needs: [prepare,render]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/download-artifact@v4
        with: {name: v69-prepared}
      - run: tar -xzf v69-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with: {pattern: 'v69-segment-*', path: v69-free-services/parts, merge-multiple: true}
      - working-directory: v69-free-services
        run: node scripts/generate-bgm.mjs
      - working-directory: v69-free-services
        run: |
          mkdir -p out
          find parts -name 'segment-*.mp4' -print | sort -V | while read f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a -filter_complex "[1:a]volume=1[vo];[2:a]volume=.04[bg];[vo][bg]amix=inputs=2:duration=longest[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/v69-final.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 out/v69-final.mp4 | head -1)" = '1920'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 out/v69-final.mp4 | head -1)" = '1080'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/v69-final.mp4 | cut -d. -f1)" -gt 750
      - run: node shared/qa/generate-scene-contact-sheet.mjs v69-free-services v69-free-services/out/v69-final.mp4 v69-free-services/out/v69-contact-sheet.jpg
      - working-directory: v69-free-services
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          TAG="v69-free-services-${GITHUB_RUN_ID}"
          NAME="knowledge-video-v69-free-services-${GITHUB_RUN_ID}.mp4"
          cp out/v69-final.mp4 "out/$NAME"
          gh release create "$TAG" "out/$NAME" out/v69-contact-sheet.jpg preproduction-plan.json qa/preproduction-summary.json SOURCES.md V69_PRODUCTION_SPEC.md --repo "$GITHUB_REPOSITORY" --title "V69 Free Services Production ${GITHUB_RUN_ID}" --notes "Original ad-funded media and free services documentary: 14 original historical and contemporary story phases; 170–380 micro-scenes, scene-specific evolving foreground, held local background, synchronized Japanese narration, BGM."
