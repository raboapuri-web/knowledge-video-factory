name: Kangaeru Yoru v7 all 71 visual frames QA NO API
on:
  push:
    branches: [kangaeru-yoru-v7-design-20261106]
    paths: ['.github/workflows/kangaeru-v7-all-frames-qa.yml']
permissions:
  contents: read
  actions: read
jobs:
  visual_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: kangaeru-yoru-v7-gk-7-context-vetted-photos-5-fallbacks
          run-id: 42170721259
          github-token: ${{ github.token }}
          path: standalone_kangaeru_v7/output/full_gk_render
      - name: Install SVG renderer and Japanese fonts
        run: |
          python -m pip install --quiet Pillow requests cairosvg
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --silent --show-error --max-time 120 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf --output "$HOME/.local/share/fonts/NotoSerifCJKjp-Regular.otf"
          curl --fail --location --silent --show-error --max-time 120 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf --output "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f
      - name: Render actual first caption of all 71 scenes, including 7 genuine photos
        run: |
          python - <<'PY'
          import pathlib,json,sys,math
          import cairosvg
          from PIL import Image
          sys.path.insert(0,'standalone_kangaeru_v7')
          import render_full
          root=pathlib.Path('standalone_kangaeru_v7/output/full_gk_render')
          board=json.loads((root/'storyboard_with_photos.json').read_text())
          ledger=json.loads((root/'photo_ledger.json').read_text())
          out=root/'frame_proofs';out.mkdir(exist_ok=True)
          samples=[]
          for s in board['scenes']:
            subtitle=s['subtitle_cues'][0]['text']
            svg=render_full.build_svg(s,subtitle,ledger)
            image=out/(s['id']+'.png')
            cairosvg.svg2png(bytestring=svg.encode(),write_to=str(image),output_width=640,output_height=360)
            with Image.open(image) as p: samples.append(p.convert('RGB').copy())
          assert len(samples)==71,len(samples)
          for pageindex in range(math.ceil(len(samples)/12)):
            sheet=Image.new('RGB',(1280,1080),'#0e0d0c')
            for n,p in enumerate(samples[pageindex*12:(pageindex+1)*12]):
              sheet.paste(p,((n%2)*640,(n//2)*180))
            sheet.save(root/(f'preview_sheet_{pageindex+1:02d}.jpg'),quality=85)
          report={'passed':True,'scene_images':len(samples),'photos_used':len(ledger['photos']),
                  'fallbacks':len(ledger['fallbacks']),'caption_preview':'first page only',
                  'human_visual_review_required':True}
          (root/'qa_all_frames.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kangaeru-yoru-v7-71-scene-contact-sheets-preflight
          path: |
            standalone_kangaeru_v7/output/full_gk_render/preview_sheet_*.jpg
            standalone_kangaeru_v7/output/full_gk_render/qa_all_frames.json
          if-no-files-found: warn
