name: V52 Conscious Reality Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v52-conscious-reality-production.yml'
      - 'shared/bootstrap/v52-conscious-reality.mjs'
      - 'shared/v52/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize V52 production
        run: node shared/bootstrap/v52-conscious-reality.mjs
      - name: Install audio tools and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install V52 dependencies
        working-directory: v52-conscious-reality
        run: npm install
      - name: Expose dependencies to shared tools
        working-directory: v52-conscious-reality
        run: ln -sfn "$PWD/node_modules" ../node_modules
      - name: Build preproduction plan
        working-directory: v52-conscious-reality
        run: node scripts/build-preproduction.mjs
      - name: Story, fine-scene and static-background guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=require('./v52-conscious-reality/src/script-data.json');
          const d=require('./v52-conscious-reality/src/scene-data.json');
          const n=s.beats.length;
          if(!s.beats[0].narration.startsWith('朝、六時四十七分。')) throw new Error('Wrong canonical V52 script loaded');
          if(n<80||n>130) throw new Error(`Unexpected V52 scene count ${n}`);
          if(d.length!==n) throw new Error(`Scene data mismatch ${d.length}/${n}`);
          if(new Set(s.beats.map(b=>b.visual)).size!==n) throw new Error('Every V52 scene must have a distinct visual key');
          const groups=[...new Set(d.map(x=>x.bgGroup))];
          if(groups.length<40) throw new Error(`Need at least 40 background groups, got ${groups.length}`);
          const seen=new Set();let prev='';const counts={};
          for(const x of d){counts[x.bgGroup]=(counts[x.bgGroup]||0)+1;if(x.bgGroup!==prev&&seen.has(x.bgGroup))throw new Error(`Background reused non-consecutively: ${x.bgGroup}`);seen.add(x.bgGroup);prev=x.bgGroup;}
          for(const [g,c] of Object.entries(counts))if(c>2)throw new Error(`Background ${g} used ${c} scenes; max 2`);
          const phases=new Set(d.map(x=>x.phase));
          const required=['morning_room','skull_box','basement_detective','signal_decode','hallway_coat','station_friend','prediction_engine','illusion','dress','rubber_hand','self_model','interoception','night_road','controlled_hallucination','office','message','ambiguity','social','limits','return_room','final'];
          for(const p of required)if(!phases.has(p))throw new Error(`Missing semantic phase ${p}`);
          const code=fs.readFileSync('./shared/v52/scenes.tsx','utf8');
          for(const p of required.filter(p=>p!=='final'))if(!code.includes(`m.phase==='${p}'`)&&!['morning_room','return_room'].includes(p))throw new Error(`Renderer missing phase ${p}`);
          if(code.includes('useCurrentFrame')) throw new Error('Scene renderer backgrounds must not use global frame motion');
          console.log(`V52 architecture: ${n} scenes / ${phases.size} phases / ${groups.length} background groups / all backgrounds sequential-only max2`);
          NODE
      - name: Production QA pre
        run: node shared/qa/validate-video.mjs v52-conscious-reality pre
      - name: Pronunciation regression tests
        run: node shared/voice/test-pronunciation.mjs
      - name: TypeScript check
        working-directory: v52-conscious-reality
        run: npm run check
      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs voicevox || true
          exit 1
      - name: Generate measured narration
        working-directory: v52-conscious-reality
        run: node scripts/generate-voicevox.mjs
      - name: Duration guard
        run: |
          node - <<'NODE'
          const s=require('./v52-conscious-reality/src/sync-timing.json');
          console.log(`Measured duration: ${s.durationSeconds}s / ${(s.beats||[]).length} scenes`);
          if(s.durationSeconds<700) throw new Error(`V52 unexpectedly short: ${s.durationSeconds}s`);
          if(s.durationSeconds>1250) throw new Error(`V52 unexpectedly long: ${s.durationSeconds}s`);
          NODE
      - name: Production QA post
        run: node shared/qa/validate-video.mjs v52-conscious-reality post
      - id: plan
        working-directory: v52-conscious-reality
        run: |
          MATRIX="$(node scripts/plan-segments.mjs)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - name: Pack prepared V52
        run: tar --exclude='v52-conscious-reality/node_modules' -czf v52-prepared.tar.gz v52-conscious-reality
      - uses: actions/upload-artifact@v4
        with:
          name: v52-prepared
          retention-days: 1
          if-no-files-found: error
          path: v52-prepared.tar.gz

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v52-prepared
          path: .
      - run: tar -xzf v52-prepared.tar.gz
      - name: Install V52 dependencies
        working-directory: v52-conscious-reality
        run: npm install
      - name: Render segment
        working-directory: v52-conscious-reality
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p out
          npx remotion render src/index.tsx V52ConsciousReality "out/segment-${{ matrix.id }}.mp4" \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --concurrency=2 --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: v52-segment-${{ matrix.id }}
          retention-days: 1
          if-no-files-found: error
          path: v52-conscious-reality/out/segment-${{ matrix.id }}.mp4

  finalize:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: v52-prepared
          path: .
      - run: tar -xzf v52-prepared.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: v52-segment-*
          path: v52-conscious-reality/parts
          merge-multiple: true
      - name: Generate BGM
        working-directory: v52-conscious-reality
        run: node scripts/generate-bgm.mjs
      - name: Concatenate segments
        working-directory: v52-conscious-reality
        run: |
          mkdir -p out
          find parts -maxdepth 1 -name 'segment-*.mp4' -print | sort -V | while read -r f; do printf "file '%s'\n" "$(realpath "$f")"; done > out/concat.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i out/concat.txt -c copy out/video-only.mp4
      - name: Mix narration and BGM
        working-directory: v52-conscious-reality
        run: |
          ffmpeg -y -loglevel error -i out/video-only.mp4 -i public/audio/narration.m4a -i public/audio/bgm.m4a \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]volume=0.042[bg];[vo][bg]amix=inputs=2:duration=longest:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest out/v52-conscious-reality-final.mp4
      - name: Create scene-complete QA contact sheet
        run: node shared/qa/generate-scene-contact-sheet.mjs v52-conscious-reality v52-conscious-reality/out/v52-conscious-reality-final.mp4 v52-conscious-reality/out/v52-conscious-reality-scene-contact-sheet.jpg
      - name: Verify QA scene count
        run: |
          node - <<'NODE'
          const s=require('./v52-conscious-reality/src/sync-timing.json');
          if((s.beats||[]).length<80)throw new Error(`QA scene count too low: ${(s.beats||[]).length}`);
          console.log(`QA sheet sourced from ${(s.beats||[]).length} measured scenes`);
          NODE
      - name: Publish GitHub Release
        working-directory: v52-conscious-reality
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIDEO_NAME="knowledge-video-v52-conscious-reality-${GITHUB_RUN_ID}.mp4"
          cp out/v52-conscious-reality-final.mp4 "out/${VIDEO_NAME}"
          TAG="v52-conscious-reality-${GITHUB_RUN_ID}"
          gh release create "$TAG" "out/${VIDEO_NAME}" out/v52-conscious-reality-scene-contact-sheet.jpg public/audio/pronunciation-report.json qa/preproduction-summary.json preproduction-plan.json SOURCES.md V52_IMPLEMENTATION.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "V52 Conscious Reality Production ${GITHUB_RUN_ID}" \
            --notes "Fine-scene original Remotion production about predictive perception and conscious reality. Sequential-only static background groups, foreground-only motion across continuity scenes, measured 青山龍星 VOICEVOX timing, synchronized subtitles, restrained ambient BGM, parallel segmented rendering, and scene-complete QA."
