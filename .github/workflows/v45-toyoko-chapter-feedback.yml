name: V45 Toyoko Chapter-by-Chapter Feedback Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v45-toyoko-chapter-feedback.yml'
  workflow_dispatch:
    inputs:
      chapter:
        description: Chapter with a reviewed src/chapter-edits/<chapter>.json edit plan
        required: true
        type: choice
        options: [prologue]
        default: prologue
      source_run_id:
        description: Existing approved original six-chapter VOICEVOX artifacts
        required: false
        default: '35831899329'
permissions:
  contents: read
  actions: read
concurrency:
  group: toyoko-chapter-feedback-${{ github.ref }}-${{ inputs.chapter || 'prologue' }}
  cancel-in-progress: true
jobs:
  prologue-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Reuse previous full and approved original VOICEVOX chapter audio
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id || '35831899329' }}
          github-token: ${{ github.token }}
          pattern: toyoko-audio-*
          path: v45-toyoko/out/chapter-audio
          merge-multiple: false
      - name: Build one standalone editorial chapter, not the old 160-shot film
        working-directory: v45-toyoko
        run: |
          node scripts/check-original-script.mjs
          node scripts/verify-reused-chapter-audio.mjs
          node scripts/build-full-review.mjs
          node scripts/stage-assets.mjs
          node scripts/build-chapter-preview.mjs prologue
          npm install --no-audit --no-fund
          ln -sfn "$PWD/node_modules" ../node_modules
          npm run check
      - name: Render the real voiced prologue at 1280x720 for human feedback
        working-directory: v45-toyoko
        run: |
          mkdir -p out
          npx remotion render src/chapter-review-index.tsx ToyokoChapterPreview \
            out/toyoko-prologue-feedback-v1.mp4 \
            --scale=0.6666666666667 --codec=h264 --crf=21 --concurrency=2 --log=warn
          test -s out/toyoko-prologue-feedback-v1.mp4
      - name: Verify chapter runtime, picture and original audio are present
        working-directory: v45-toyoko
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('src/chapter-selected-data.json','utf8'));
          const x=JSON.parse(execFileSync('ffprobe',['-v','error','-show_entries',
            'format=duration:stream=codec_type,codec_name,width,height',
            '-of','json','out/toyoko-prologue-feedback-v1.mp4'],{encoding:'utf8'}));
          const v=x.streams.find(s=>s.codec_type==='video');
          const a=x.streams.find(s=>s.codec_type==='audio');
          if(!v||v.width!==1280||v.height!==720||!a||a.codec_name!=='aac'||
             Math.abs(+x.format.duration-m.durationFrames/30)>1.5)
            throw Error('Chapter review movie has an unexpected format or incorrect runtime');
          console.log('VERIFIED: real 720p chapter movie with original narration, subtitles, '+
            m.shots.length+' editorial shots, '+x.format.duration+' sec');
          NODE
      - name: Upload ONLY the first reviewed chapter; do not concatenate unapproved chapters
        uses: actions/upload-artifact@v4
        with:
          name: toyoko-prologue-feedback-v1-voice-and-visual
          path: |
            v45-toyoko/out/toyoko-prologue-feedback-v1.mp4
            v45-toyoko/out/prologue-review-scene-list.json
            v45-toyoko/src/chapter-edits/prologue.json
          if-no-files-found: error
          retention-days: 7
