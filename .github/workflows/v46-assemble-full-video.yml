name: V46 Assemble Full Approved Video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v46-assemble-full-video.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved Prologue and Chapter1 locks
        run: |
          node v46hansyoku/scripts/verify-approved-prologue.mjs
          node v46hansyoku/scripts/verify-approved-chapters.mjs

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Prepare approved prologue
        run: |
          set -euo pipefail
          mkdir -p assembly/prologue
          cp v46hansyoku/approved-video/V46_PROLOGUE_APPROVED_20260925.mp4 assembly/prologue/prologue.mp4
          echo '7c3c8f76fd8819bf02174ea600ca211889bbf45f8be152719ad7a420664d5384  assembly/prologue/prologue.mp4' | sha256sum --check --status

      - name: Download approved Chapter1 R3 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36137608832
          github-token: ${{ github.token }}
          name: v46hansyoku-chapter1-36-scenes-parallel-review
          path: assembly/chapter1

      - name: Download Chapter2 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36141633561
          github-token: ${{ github.token }}
          name: v46hansyoku-chapter2-high-motion-review
          path: assembly/chapter2

      - name: Download Chapter3 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36141633561
          github-token: ${{ github.token }}
          name: v46hansyoku-chapter3-high-motion-review
          path: assembly/chapter3

      - name: Download Chapter4 artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36141633561
          github-token: ${{ github.token }}
          name: v46hansyoku-chapter4-high-motion-review
          path: assembly/chapter4

      - name: Download Epilogue artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 36141633561
          github-token: ${{ github.token }}
          name: v46hansyoku-epilogue-high-motion-review
          path: assembly/epilogue

      - name: Locate exact chapter MP4s
        run: |
          set -euo pipefail
          cp "$(find assembly/chapter1 -type f -name 'v46-chapter1.mp4' -print -quit)" assembly/chapter1.mp4
          cp "$(find assembly/chapter2 -type f -name 'v46-chapter2.mp4' -print -quit)" assembly/chapter2.mp4
          cp "$(find assembly/chapter3 -type f -name 'v46-chapter3.mp4' -print -quit)" assembly/chapter3.mp4
          cp "$(find assembly/chapter4 -type f -name 'v46-chapter4.mp4' -print -quit)" assembly/chapter4.mp4
          cp "$(find assembly/epilogue -type f -name 'v46-epilogue.mp4' -print -quit)" assembly/epilogue.mp4
          for f in assembly/prologue/prologue.mp4 assembly/chapter1.mp4 assembly/chapter2.mp4 assembly/chapter3.mp4 assembly/chapter4.mp4 assembly/epilogue.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 "$f"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$f"
          done

      - name: Concatenate all six parts without rerendering
        run: |
          set -euo pipefail
          mkdir -p v46hansyoku/out/final
          cat > assembly/concat.txt <<'EOF'
          file 'prologue/prologue.mp4'
          file 'chapter1.mp4'
          file 'chapter2.mp4'
          file 'chapter3.mp4'
          file 'chapter4.mp4'
          file 'epilogue.mp4'
          EOF
          cd assembly
          ffmpeg -y -hide_banner -loglevel warning -f concat -safe 0 -i concat.txt -c copy -movflags +faststart ../v46hansyoku/out/final/V46_HANSHOKU_FULL_20260925.mp4

      - name: Verify full movie
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, os
          parts=[
            'assembly/prologue/prologue.mp4',
            'assembly/chapter1.mp4',
            'assembly/chapter2.mp4',
            'assembly/chapter3.mp4',
            'assembly/chapter4.mp4',
            'assembly/epilogue.mp4',
          ]
          out='v46hansyoku/out/final/V46_HANSHOKU_FULL_20260925.mp4'
          def probe(p):
            return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p],text=True))
          metas=[probe(p) for p in parts]; m=probe(out)
          expected=sum(float(x['format']['duration']) for x in metas)
          actual=float(m['format']['duration'])
          v=[x for x in m['streams'] if x['codec_type']=='video']
          a=[x for x in m['streams'] if x['codec_type']=='audio']
          assert len(v)==1 and len(a)>=1
          assert v[0]['codec_name']=='h264'
          assert (int(v[0]['width']),int(v[0]['height']))==(1920,1080)
          assert v[0]['r_frame_rate']=='30/1'
          assert any(x['codec_name']=='aac' for x in a)
          assert abs(actual-expected)<2.0,(actual,expected)
          assert 1200<actual<1400,actual
          print(f'FULL VIDEO VERIFIED: {actual:.3f}s ({actual/60:.2f} min), expected parts {expected:.3f}s')
          print('Order: Prologue -> Chapter1 -> Chapter2 -> Chapter3 -> Chapter4 -> Epilogue')
          print('Size bytes:', os.path.getsize(out))
          PY

      - name: Write assembly manifest
        run: |
          python3 - <<'PY'
          import json, subprocess, hashlib, os
          out='v46hansyoku/out/final/V46_HANSHOKU_FULL_20260925.mp4'
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',out],text=True))
          h=hashlib.sha256()
          with open(out,'rb') as f:
            while True:
              b=f.read(1024*1024)
              if not b: break
              h.update(b)
          manifest={
            'videoId':'V46',
            'fileName':'V46_HANSHOKU_FULL_20260925.mp4',
            'assemblyMethod':'ffmpeg concat demuxer stream copy; no rerender/transcode',
            'order':['prologue','chapter1','chapter2','chapter3','chapter4','epilogue'],
            'sources':{
              'prologue':{'kind':'approved-git-file','path':'v46hansyoku/approved-video/V46_PROLOGUE_APPROVED_20260925.mp4','sha256':'7c3c8f76fd8819bf02174ea600ca211889bbf45f8be152719ad7a420664d5384'},
              'chapter1':{'runId':36137608832,'artifactId':10865049586,'file':'v46-chapter1.mp4','approved':True},
              'chapter2':{'runId':36141633561,'artifactId':10868776142,'file':'v46-chapter2.mp4'},
              'chapter3':{'runId':36141633561,'artifactId':10866982651,'file':'v46-chapter3.mp4'},
              'chapter4':{'runId':36141633561,'artifactId':10868267141,'file':'v46-chapter4.mp4'},
              'epilogue':{'runId':36141633561,'artifactId':10867297330,'file':'v46-epilogue.mp4'}
            },
            'durationSeconds':float(meta['format']['duration']),
            'sizeBytes':os.path.getsize(out),
            'sha256':h.hexdigest()
          }
          json.dump(manifest,open('v46hansyoku/out/final/assembly-manifest.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Upload full movie
        uses: actions/upload-artifact@v4
        with:
          name: V46-HANSHOKU-FULL-VIDEO
          path: |
            v46hansyoku/out/final/V46_HANSHOKU_FULL_20260925.mp4
            v46hansyoku/out/final/assembly-manifest.json
          if-no-files-found: error
          retention-days: 14
